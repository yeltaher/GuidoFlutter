name: guido
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  just_audio: ^0.9.36
  audio_session: ^0.1.16
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  google_fonts: ^6.1.0
  flutter_animate: ^4.5.0
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.5
  sensors_plus: ^6.1.1
  flutter_local_notifications: ^21.0.0
  flutter_timezone: ^5.0.2
  wakelock_plus: ^1.6.1
  model_viewer_plus: ^1.10.0
  vr_player: ^0.3.0
  path_provider: ^2.1.5
  video_player: ^2.11.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.8
  isar_generator: ^3.1.0+1
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/images/app_icon.png"
  android: true
  ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/voci/en/
    - assets/audio/voci/it/
    - assets/audio/ambient/
    - assets/audio/respirazioni/
    - assets/models/
    - assets/audio/real/Meditazioni/Acqua/
    - assets/audio/real/Meditazioni/Effetti/
    - assets/audio/real/Meditazioni/Generale/
    - assets/audio/real/Respirazioni/Acqua/
    - assets/audio/real/Respirazioni/Aria/
    - assets/audio/real/Respirazioni/Fuoco/
    - assets/audio/real/Respirazioni/Terra/
    - "assets/Esperienze_Guido/Video/"
    - "assets/Esperienze_Guido/Video/Respirazioni/Acqua/Respirazione_Mono.mp4"
    - "assets/Esperienze_Guido/Video/Respirazioni/Acqua/Respirazione_Acqua_SBS.mp4"
  fonts:
    - family: Oswald
      fonts:
        - asset: assets/fonts/Oswald-Light.ttf
          weight: 300
        - asset: assets/fonts/Oswald-Regular.ttf
          weight: 400
        - asset: assets/fonts/Oswald-Bold.ttf
          weight: 700
    - family: LiberationSans
      fonts:
        - asset: assets/fonts/LiberationSans.ttf
