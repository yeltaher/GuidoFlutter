name: guido
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+20

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^2.4.9
  equatable: ^2.0.7
  just_audio: ^0.9.36
  audio_session: ^0.1.16
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  google_fonts: ^6.1.0
  flutter_animate: ^4.5.0
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.5
  sensors_plus: ^6.1.1
  flutter_local_notifications: ^21.0.0
  flutter_timezone: ^5.0.2
  wakelock_plus: ^1.6.1
  model_viewer_plus: ^1.10.0
  vr_player: ^0.3.0
  path_provider: ^2.1.5
  video_player: ^2.11.1
  animated_text_kit: ^4.3.0
  go_router: ^17.3.0
  flutter_unity_widget: ^2022.2.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.8
  isar_generator: ^3.1.0+1
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icona_new.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#070A18"
  color_dark: "#070A18"
  image: "assets/images/sfondo_new.png"
  background_image: "assets/images/sfondo_new.png"
  android: true
  ios: true
  ios_content_mode: scaleAspectFill
  android_gravity: fill
  fullscreen: true

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/voci/en/
    - assets/audio/voci/it/
    - assets/audio/ambient/
    - assets/audio/respirazioni/
    - assets/models/
    - assets/audio/real/Meditazioni/Acqua/
    - assets/audio/real/Meditazioni/Effetti/
    - assets/audio/real/Meditazioni/Generale/
    - assets/audio/real/Respirazioni/Acqua/
    - assets/audio/real/Respirazioni/Aria/
    - assets/audio/real/Respirazioni/Fuoco/
    - assets/audio/real/Respirazioni/Terra/
    - assets/Esperienze_Guido/Audio/Voce_Luigi/
    - assets/Esperienze_Guido/Audio/Respirazioni/Acqua/
    - assets/Esperienze_Guido/Audio/Respirazioni/Aria/
    - assets/Esperienze_Guido/Audio/Respirazioni/Fuoco/
    - assets/Esperienze_Guido/Audio/Respirazioni/Terra/
    - assets/Esperienze_Guido/Audio/Meditazioni/Acqua/
    - assets/Esperienze_Guido/Audio/Meditazioni/Effetti/
    - assets/Esperienze_Guido/Audio/Meditazioni/Generale/
    - "assets/Esperienze_Guido/Video/"
    - "assets/Esperienze_Guido/Video/Respirazioni/Acqua/Respirazione_Acqua_4K_Mono.mp4"
    - "assets/Esperienze_Guido/Video/Respirazioni/Acqua/Respirazione_Acqua_VR360_SBS.mp4"
  fonts:
    - family: Oswald
      fonts:
        - asset: assets/fonts/Oswald-Light.ttf
          weight: 300
        - asset: assets/fonts/Oswald-Regular.ttf
          weight: 400
        - asset: assets/fonts/Oswald-Bold.ttf
          weight: 700
    - family: LiberationSans
      fonts:
        - asset: assets/fonts/LiberationSans.ttf
