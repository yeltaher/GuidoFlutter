      if (state.isCompleted) return;
      state.isCompleted = true;
      try { pauseExperience(); } catch(e) {}
      if (billboardMesh) billboardMesh.visible = false;

      notifyFlutter('onSessionComplete', { duration: TOTAL_DURATION_SEC });

      if (state.isVRMode) {
        showVRCompletionPopup();
      } else {
        show2DCompletionPopup();
      }
    }

    /* ======================================================================
       TIMELINE & ENVIRONMENT SHADER UPDATES (Zero black silhouettes)
       ====================================================================== */
    function updateExperienceTimeline(timeSec, deltaSec, snapCamera = false) {
      updateSubtitlesForTime(timeSec);

      // Outdoor visibility check during Tunnel transit (285s - 313s)
      const isTunnelActive = (timeSec >= 285 && timeSec < 313);
      const outdoorVis = !isTunnelActive;

      if (skySphere) skySphere.visible = outdoorVis;
      if (waterMesh) waterMesh.visible = outdoorVis;
      if (waterSubSurfaceMesh) waterSubSurfaceMesh.visible = outdoorVis;
      if (terrainAlpineMassives) terrainAlpineMassives.visible = outdoorVis;
      if (terrainPromontoryWest) terrainPromontoryWest.visible = outdoorVis;
      if (terrainPromontoryEast) terrainPromontoryEast.visible = outdoorVis;
      if (terrainForegroundShore) terrainForegroundShore.visible = outdoorVis;
      if (terrainBoulders) terrainBoulders.visible = outdoorVis;

      // Threshold Veil Transitions (Enter Tunnel 284-288s, Exit 309-313s)
      if (thresholdMesh) {
        if (timeSec >= 284 && timeSec <= 288) {
          let alpha = 0;
          if (timeSec < 286) alpha = smoothstep(284, 286, timeSec);
          else alpha = 1.0 - smoothstep(286, 288, timeSec);
          thresholdMesh.material.opacity = alpha * 0.98;
          thresholdMesh.visible = true;
        } else if (timeSec >= 309 && timeSec <= 313) {
          let alpha = 0;
          if (timeSec < 311) alpha = smoothstep(309, 311, timeSec);
          else alpha = 1.0 - smoothstep(311, 313, timeSec);
          thresholdMesh.material.opacity = alpha * 0.98;
          thresholdMesh.visible = true;
        } else {
          thresholdMesh.material.opacity = 0;
          thresholdMesh.visible = false;
        }
      }

      // Observer Camera Ergonomics (Majestic elevated bluff at Z=42, Y=8.2; dry ground Y=6.5)
      let targetCamX = 0;
      let targetCamY = 8.2;
      let targetCamZ = 42.0;

      if (timeSec < 51.0) {
        // Scena 1: Standing on panoramic bluff
        targetCamY = 8.2;
        targetCamZ = 42.0;
      } else if (timeSec >= 51.0 && timeSec < 83.0) {
        // Scena 2: Contemplative shift toward water view
        const p = smoothstep(51.0, 83.0, timeSec);
        targetCamY = lerp(8.2, 8.0, p);
        targetCamZ = lerp(42.0, 40.0, p);
      } else if (timeSec >= 83.0 && timeSec < 195.0) {
        // Scena 3: Gentle respiration wave bobbing
        const p = smoothstep(83.0, 100.0, timeSec);
        const breathBob = Math.sin(timeSec * 0.78) * 0.04;
        targetCamY = lerp(8.0, 7.8, p) + breathBob;
        targetCamZ = lerp(40.0, 38.0, p);
      } else if (timeSec >= 195.0 && timeSec < 243.0) {
        // Scena 4: Comet viewing overhead
        const p = smoothstep(195.0, 210.0, timeSec);
        targetCamY = lerp(7.8, 8.0, p);
        targetCamZ = lerp(38.0, 40.0, p);
      } else if (timeSec >= 243.0 && timeSec < 285.0) {
        // Scena 5: Concentric Sacred Circles
        targetCamY = 8.0;
        targetCamZ = 39.0;
      } else if (timeSec >= 285.0 && timeSec < 313.0) {
        // Scena 6: Light Tunnel Transit (forward glide through tunnel)
        const p = smoothstep(285.0, 313.0, timeSec);
        targetCamY = 8.2;
        targetCamZ = lerp(20.0, -25.0, p);
      } else {
        // Scena 7: Outro at peaceful bluff
        const p = smoothstep(313.0, 320.0, timeSec);
        targetCamY = lerp(8.2, 8.2, p);
        targetCamZ = lerp(39.0, 42.0, p);
      }

      if (snapCamera) {
        cameraRig.position.set(targetCamX, targetCamY, targetCamZ);
      } else {
        const damp = 1.0 - Math.exp(-6.0 * deltaSec);
        cameraRig.position.x += (targetCamX - cameraRig.position.x) * damp;
        cameraRig.position.y += (targetCamY - cameraRig.position.y) * damp;
        cameraRig.position.z += (targetCamZ - cameraRig.position.z) * damp;
      }

      // Sky & Lighting Progression (Sunset fades from 1.0 to 0.0 between 12s and 75s)
      const sunsetProg = 1.0 - smoothstep(12.0, 75.0, timeSec);

      if (skySphere && skySphere.material.uniforms) {
        skySphere.material.uniforms.uSunsetProg.value = sunsetProg;
      }
      if (waterMesh && waterMesh.material.uniforms) {
        waterMesh.material.uniforms.uSunsetProg.value = sunsetProg;
      }
      if (terrainMaterial && terrainMaterial.uniforms) {
        terrainMaterial.uniforms.uSunsetProg.value = sunsetProg;
      }

      // Sun Setting Trajectory (Scene 1)
      if (sunMesh) {
        if (timeSec < 68.0) {
          const sProg = smoothstep(0.0, 52.0, timeSec);
          sunMesh.position.y = lerp(8.0, -32.0, sProg);
          sunLight.position.copy(sunMesh.position);
          sunLight.intensity = (1.0 - sProg * 0.8) * 1.35;
          sunMesh.visible = (sunMesh.position.y > -26.0);
        } else {
          sunMesh.visible = false;
          sunLight.intensity = 0.0;
        }
      }

      // Moon Rising Trajectory (Scene 2-7, ZERO flat grey discs!)
      if (moonMesh) {
        if (timeSec >= 48.0) {
          moonMesh.visible = outdoorVis;
          const mIn = smoothstep(48.0, 75.0, timeSec);
          if (moonCorona1) moonCorona1.material.opacity = mIn * 0.85;
          if (moonCorona2) moonCorona2.material.opacity = mIn * 0.35;
          moonLight.intensity = mIn * 0.85;
        } else {
          moonMesh.visible = false; // Never show moon during Sunset!
          moonLight.intensity = 0.0;
        }
      }

      // Starfield Brightening as sunset fades
      if (starField) {
        starField.material.opacity = lerp(0.12, 0.90, 1.0 - sunsetProg);
      }

      // Aurora Borealis Shimmer
      let auroraIntensity = 0.0;
      if (timeSec >= 51.0 && timeSec < 285.0) {
        const aIn = smoothstep(51.0, 80.0, timeSec);
        const aPulse = Math.sin(timeSec * 0.45) * 0.2 + 0.8;
        auroraIntensity = aIn * aPulse * 0.9;
      } else if (timeSec >= 313.0) {
        auroraIntensity = smoothstep(313.0, 320.0, timeSec) * 0.75;
      }
      if (auroraMesh && auroraMesh.material.uniforms) {
        auroraMesh.material.uniforms.uTime.value = timeSec;
        auroraMesh.material.uniforms.uIntensity.value = auroraIntensity;
      }
      if (waterMesh && waterMesh.material.uniforms) {
        waterMesh.material.uniforms.uAuroraIntensity.value = auroraIntensity;
      }
      if (terrainMaterial && terrainMaterial.uniforms) {
        terrainMaterial.uniforms.uAuroraIntensity.value = auroraIntensity;
      }

      // SCENA 3: CASCATA DI LUCE BIANCA (83s - 195s)
      const wIn = smoothstep(83.0, 92.0, timeSec);
      const wOut = 1.0 - smoothstep(188.0, 195.0, timeSec);
      const wAlpha = wIn * wOut;
      if (wAlpha > 0.001) {
        waterfallGroup.visible = true;
        if (waterfallBeamMesh && waterfallBeamMesh.material.uniforms) {
          waterfallBeamMesh.material.uniforms.uTime.value = timeSec;
          waterfallBeamMesh.material.uniforms.uOpacity.value = wAlpha;
        }
        if (waterfallCausticPool && waterfallCausticPool.material.uniforms) {
          waterfallCausticPool.material.uniforms.uTime.value = timeSec;
          waterfallCausticPool.material.uniforms.uOpacity.value = wAlpha;
        }
        if (waterfallPhotons) {
          waterfallPhotons.material.opacity = wAlpha * 0.92;
          const pos = waterfallPhotons.geometry.attributes.position.array;
          const { pSpeeds, pRadii, pAngles } = waterfallPhotons.geometry.userData;
          for (let i = 0; i < 1500; i++) {
            pos[i * 3 + 1] -= pSpeeds[i] * deltaSec;
            if (pos[i * 3 + 1] < 0.1) pos[i * 3 + 1] = 85.0;
            const ang = pAngles[i] + timeSec * 0.8;
            pos[i * 3 + 0] = Math.cos(ang) * pRadii[i];
            pos[i * 3 + 2] = Math.sin(ang) * pRadii[i];
          }
          waterfallPhotons.geometry.attributes.position.needsUpdate = true;
        }
      } else {
        waterfallGroup.visible = false;
      }

      // SCENA 4: STELLA COMETA AZZURRA (195s - 243s)
      const cIn = smoothstep(195.0, 202.0, timeSec);
      const cOut = 1.0 - smoothstep(238.0, 243.0, timeSec);
      const cAlpha = cIn * cOut;
      if (cAlpha > 0.001) {
        cometGroup.visible = true;
        const pComet = smoothstep(195.0, 243.0, timeSec);
        const startX = -30, startY = 46, startZ = -150;
        const midX = 45, midY = 38, midZ = -75;
        const endX = 140, endY = 25, endZ = 10;
        const invP = 1.0 - pComet;
        const curX = invP * invP * startX + 2.0 * invP * pComet * midX + pComet * pComet * endX;
        const curY = invP * invP * startY + 2.0 * invP * pComet * midY + pComet * pComet * endY;
        const curZ = invP * invP * startZ + 2.0 * invP * pComet * midZ + pComet * pComet * endZ;

        cometGroup.position.set(curX, curY, curZ);
        if (cometCoronaSprite) cometCoronaSprite.material.opacity = cAlpha * 0.95;

        if (cometTrailPoints) {
          cometTrailPoints.visible = true;
          cometTrailPoints.material.opacity = cAlpha * 0.85;
          const { maxHistory } = cometTrailPoints.userData;
          const tPos = cometTrailPoints.geometry.attributes.position.array;
          if (cometTrailPoints.userData.count === 0) {
            for (let i = 0; i < maxHistory; i++) {
              const t_i = Math.max(195.0, timeSec - i * 0.025);
              const p_i = smoothstep(195.0, 243.0, t_i);
              const invP_i = 1.0 - p_i;
              tPos[i * 3 + 0] = invP_i * invP_i * startX + 2.0 * invP_i * p_i * midX + p_i * p_i * endX;
              tPos[i * 3 + 1] = invP_i * invP_i * startY + 2.0 * invP_i * p_i * midY + p_i * p_i * endY;
              tPos[i * 3 + 2] = invP_i * invP_i * startZ + 2.0 * invP_i * p_i * midZ + p_i * p_i * endZ;
            }
            cometTrailPoints.userData.count = 1;
          } else {
            for (let i = (maxHistory - 1) * 3; i >= 3; i -= 3) {
              tPos[i] = tPos[i - 3];
              tPos[i + 1] = tPos[i - 2];
              tPos[i + 2] = tPos[i - 1];
            }
            tPos[0] = curX;
            tPos[1] = curY;
            tPos[2] = curZ;
          }
          cometTrailPoints.geometry.attributes.position.needsUpdate = true;
        }
      } else {
        cometGroup.visible = false;
        if (cometTrailPoints) cometTrailPoints.visible = false;
      }

      // SCENA 5: DOPPIO CERCHIO SACRO (243s - 285s)
      const sIn = smoothstep(243.0, 248.0, timeSec);
      const sOut = 1.0 - smoothstep(280.0, 285.0, timeSec);
      const sAlpha = sIn * sOut;
      if (sAlpha > 0.001) {
        sacredCirclesGroup.visible = true;
        if (outerRingMesh) {
          outerRingMesh.rotation.z -= deltaSec * 0.015;
          outerRingMesh.material.opacity = sAlpha * 0.92;
        }
        if (innerRingMesh) {
          innerRingMesh.rotation.z += deltaSec * 0.022;
          innerRingMesh.material.opacity = sAlpha * 0.95;
        }
        const breathPhase = Math.sin(timeSec * (2.0 * Math.PI / 6.0));
        const breathScale = 1.0 + breathPhase * 0.07;
        sacredCirclesGroup.scale.set(breathScale, breathScale, 1.0);

        if (sacredPoolReflectMesh) {
          sacredPoolReflectMesh.material.opacity = sAlpha * (0.35 + breathPhase * 0.15);
        }
      } else {
        sacredCirclesGroup.visible = false;
      }

      // SCENA 6: TUNNEL CILINDRICO DI LUCE SPIRALE (285s - 313s)
      const tIn = smoothstep(285.0, 288.0, timeSec);
      const tOut = 1.0 - smoothstep(310.0, 313.0, timeSec);
      const tAlpha = tIn * tOut;
      if (tAlpha > 0.001) {
        tunnelGroup.visible = true;
        if (tunnelMesh && tunnelMesh.material.uniforms) {
          tunnelMesh.material.uniforms.uTime.value = timeSec;
          tunnelMesh.material.uniforms.uOpacity.value = tAlpha;
        }
        if (tunnelStardust) {
          tunnelStardust.material.opacity = tAlpha * 0.9;
          const pos = tunnelStardust.geometry.attributes.position.array;
          for (let i = 0; i < 600; i++) {
            pos[i * 3 + 2] += deltaSec * 16.0;
            if (pos[i * 3 + 2] > 60.0) pos[i * 3 + 2] = -60.0;
          }
          tunnelStardust.geometry.attributes.position.needsUpdate = true;
        }
      } else {
        tunnelGroup.visible = false;
      }

      // Completion Trigger
      if (timeSec >= TOTAL_DURATION_SEC && !state.isCompleted) {
        onExperienceEnded();
      }
    }

    /* --- SUBTITLES UPDATE (2D Overlay & 3D VR Billboard) --- */
    let currentSubtitleText = '';

    function updateSubtitlesForTime(t) {
      let activeText = '';
      for (let i = 0; i < SCRIPT_CUES.length; i++) {
        if (t >= SCRIPT_CUES[i].start && t <= SCRIPT_CUES[i].end) {
          activeText = SCRIPT_CUES[i].text;
          break;
        }
      }
      currentSubtitleText = activeText;

      // 2D Overlay (Only in monoscopic 2D mode, hidden in VR mode)
      if (hudSubtitleText && hudSubtitleBox) {
        if (activeText && !state.isVRMode) {
          if (hudSubtitleText.textContent !== activeText) {
            hudSubtitleText.textContent = activeText;
          }
          hudSubtitleBox.classList.add('visible');
        } else {
          hudSubtitleBox.classList.remove('visible');
        }
      }

      // 3D VR Billboard
      if (billboardMesh) {
        if (state.isVRMode && activeText) {
          billboardMesh.visible = true;
          update3DSubtitle(activeText);
        } else {
          billboardMesh.visible = false;
        }
      }
    }

    /* ======================================================================
       AUDIO PLAYBACK & SYNC ENGINE
       ====================================================================== */
    function playExperience() {
      if (state.isCompleted) {
        state.isCompleted = false;
        hide2DCompletionPopup();
        hideVRCompletionPopup();
        seekExperience(0);
      }
      unlockAudio();
      state.isPlaying = true;
      audioVoice.play().catch(e => console.warn('Voice play fallback', e));
      audioMusic.play().catch(e => console.warn('Music play fallback', e));
    }

    function pauseExperience() {
      state.isPlaying = false;
      audioVoice.pause();
      audioMusic.pause();
    }

    function togglePlay() {
      if (state.isPlaying) pauseExperience();
      else playExperience();
    }

    function seekExperience(targetSec) {
      targetSec = Math.max(0, Math.min(TOTAL_DURATION_SEC, targetSec));
      state.currentTime = targetSec;
      if (state.isCompleted && targetSec < TOTAL_DURATION_SEC) {
        state.isCompleted = false;
        hide2DCompletionPopup();
        hideVRCompletionPopup();
      }

      function applyAudioSeek(el, t) {
        if (!el) return;
        if (el.readyState >= 1) {
          try { el.currentTime = t; } catch(e) {}
        } else {
          el.addEventListener('loadedmetadata', () => {
            try { el.currentTime = t; } catch(e) {}
          }, { once: true });
        }
      }

      const voiceSeekLimit = (audioVoice && isFinite(audioVoice.duration) && audioVoice.duration > 0)
        ? audioVoice.duration
        : VOICE_DURATION_SEC;
      applyAudioSeek(audioVoice, Math.min(targetSec, voiceSeekLimit));
      applyAudioSeek(audioMusic, targetSec);

      updateExperienceTimeline(targetSec, 0.016, true);
    }

    /* ======================================================================
       INTERACTION & CONTROLS (VR Stereo Mode, Mouse Look, Gyroscope)
       ====================================================================== */
    function setVRMode(enable) {
      state.isVRMode = !!enable;

      const uiLayer = document.getElementById('ui-layer');
      if (uiLayer) {
        if (state.isVRMode) {
          uiLayer.classList.add('hidden');
          uiLayer.style.setProperty('display', 'none', 'important');
        } else {
          uiLayer.classList.remove('hidden');
          uiLayer.style.removeProperty('display');
        }
      }

      if (vrReticleGroup) {
        vrReticleGroup.visible = state.isVRMode;
      }

      if (billboardMesh) {
        billboardMesh.visible = state.isVRMode;
        if (state.isVRMode) {
          lastRenderedSubtitleText = null;
          update3DSubtitle(currentSubtitleText || (state.currentTime > 0 ? "" : "Respira profondamente... Inizia la meditazione della sera."));
        }
      }

      if (state.isVRMode) {
        if (camera) camera.fov = 72;
        if (renderer) renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2.0));
        document.body.classList.add('vr-active');
        if (vrOverlay) vrOverlay.classList.add('active');
        requestDeviceOrientationPermission();
        if (screen.orientation && screen.orientation.lock) {
          screen.orientation.lock('landscape').catch(() => {});
        }
        if (state.isCompleted) {
          hide2DCompletionPopup();
          showVRCompletionPopup();
        }
      } else {
        deviceOrientationEnabled = false;
        if (camera) camera.fov = 52;
        if (renderer) renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2.0));
        hideVRCompletionPopup();
        document.body.classList.remove('vr-active');
        if (vrOverlay) vrOverlay.classList.remove('active');
        if (screen.orientation && screen.orientation.unlock) {
          try { screen.orientation.unlock(); } catch (e) {}
        }
        if (state.isCompleted) {
          show2DCompletionPopup();
        }
      }

      if (camera) camera.updateProjectionMatrix();
      onWindowResize();
      notifyFlutter('onVRModeChanged', { isVR: state.isVRMode });
    }

    function toggleVR() {
      setVRMode(!state.isVRMode);
    }

    function recenterView() {
      targetYaw = 0;
      targetPitch = 0;
      yaw = 0;
      pitch = 0;
      vrAlphaOffset = -orientationAlpha;
      updateCameraRotation();
    }

    function enableDeviceOrientation() {
      window.addEventListener('deviceorientation', (e) => {
        if (!state.isVRMode) return;
        if (e && e.alpha !== null && e.alpha !== undefined && e.beta !== null && e.gamma !== null && (Math.abs(e.alpha) > 0.01 || Math.abs(e.beta) > 0.01 || Math.abs(e.gamma) > 0.01)) {
          deviceOrientationEnabled = true;
          orientationAlpha = e.alpha;
          orientationBeta = e.beta;
          orientationGamma = e.gamma;
        }
      }, true);
    }

    function requestDeviceOrientationPermission() {
      enableDeviceOrientation();
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission()
          .then(perm => {
            if (perm === 'granted') enableDeviceOrientation();
          })
          .catch(err => console.warn('Orientation permission err:', err));
      }
    }

    function getScreenOrientationAngle() {
      if (screen.orientation && typeof screen.orientation.angle === 'number') {
        return screen.orientation.angle;
      }
      if (typeof window.orientation === 'number') {
        return window.orientation;
      }
      if (window.innerWidth > window.innerHeight) {
        return 90;
      }
      return 0;
    }

    function updateCameraRotation() {
      const rotDamp = 1.0 - Math.exp(-14.0 * (state.lastDeltaSec || 0.016));
      yaw += (targetYaw - yaw) * rotDamp;
      pitch += (targetPitch - pitch) * rotDamp;

      if (deviceOrientationEnabled && state.isVRMode) {
        const alphaRad = THREE.MathUtils.degToRad(orientationAlpha + vrAlphaOffset) + yaw;
        const betaRad = THREE.MathUtils.degToRad(orientationBeta);
        const gammaRad = THREE.MathUtils.degToRad(orientationGamma);
        const orientRad = THREE.MathUtils.degToRad(getScreenOrientationAngle());

        // 1. Converti gli angoli W3C nel frame della telecamera Three.js
        _euler.set(betaRad, alphaRad, -gammaRad, 'YXZ');
        camera.quaternion.setFromEuler(_euler);

        // 2. Ruota per allineare l'asse del dispositivo con il frustum della camera (-90 deg attorno ad X)
        camera.quaternion.multiply(_q1);

        // 3. Compensa la rotazione landscape dello schermo (90 deg attorno a Z)
        _q0.setFromAxisAngle(_zee, -orientRad);
        camera.quaternion.multiply(_q0);
      } else {
        camera.rotation.set(pitch, yaw, 0, 'YXZ');
      }
    }

    function initControls() {
      requestDeviceOrientationPermission();

      if (btnModalExit) {
        btnModalExit.addEventListener('click', () => {
          notifyFlutter('onExitRequested', {});
        });
      }
      if (btnModalRepeat) {
        btnModalRepeat.addEventListener('click', () => {
          hide2DCompletionPopup();
          hideVRCompletionPopup();
          state.isCompleted = false;
          seekExperience(0);
          playExperience();
        });
      }

      // Pointer / Mouse Look
      window.addEventListener('mousedown', (e) => {
        isUserDragging = true;
        prevMouseX = e.clientX;
        prevMouseY = e.clientY;
      });

      window.addEventListener('mousemove', (e) => {
        if (!isUserDragging) return;
        const dx = e.clientX - prevMouseX;
        const dy = e.clientY - prevMouseY;
        prevMouseX = e.clientX;
        prevMouseY = e.clientY;

        targetYaw -= dx * 0.003;
        targetPitch -= dy * 0.003;
        targetPitch = Math.max(-Math.PI * 0.42, Math.min(Math.PI * 0.42, targetPitch));
      });

      window.addEventListener('mouseup', () => { isUserDragging = false; });

      // Touch drag
      let touchStartX = 0, touchStartY = 0;
      window.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
          touchStartX = e.touches[0].clientX;
          touchStartY = e.touches[0].clientY;
        }
      }, { passive: true });

      window.addEventListener('touchmove', (e) => {
        if (state.isVRMode && deviceOrientationEnabled) return;
        if (e.touches.length === 1) {
          const dx = e.touches[0].clientX - touchStartX;
          const dy = e.touches[0].clientY - touchStartY;
          touchStartX = e.touches[0].clientX;
          touchStartY = e.touches[0].clientY;

          targetYaw -= dx * 0.004;
          targetPitch -= dy * 0.004;
          targetPitch = Math.max(-Math.PI * 0.42, Math.min(Math.PI * 0.42, targetPitch));
        }
      }, { passive: true });

      // Keyboard Controls (1-7 scene seeking, Space toggle, V for VR, R for recenter)
      window.addEventListener('keydown', (e) => {
        if (e.key >= '1' && e.key <= '7') {
          const sIdx = parseInt(e.key) - 1;
          if (SCENES_CONFIG[sIdx]) {
            seekExperience(SCENES_CONFIG[sIdx].start + 0.1);
          }
        } else if (e.code === 'Space') {
          togglePlay();
        } else if (e.key === 'v' || e.key === 'V') {
          toggleVR();
        } else if (e.key === 'r' || e.key === 'R') {
          recenterView();
        }
      });
    }

    function onWindowResize() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      if (!camera || !renderer) return;

      camera.aspect = w / h;
      camera.fov = state.isVRMode ? 72 : 52;
      camera.updateProjectionMatrix();

      if (stereoCamera) {
        stereoCamera.aspect = 0.5;
      }
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2.0));
      renderer.setSize(w, h);
    }

    /* ======================================================================
       RENDER LOOP & FLUTTER DEVICE ORIENTATION
       ====================================================================== */
    let animationFrameId = null;
    let ambientWaterTime = 0;

    function animate(timestamp) {
      animationFrameId = requestAnimationFrame(animate);

      if (!state.lastTimestamp) state.lastTimestamp = timestamp;
      const deltaSec = Math.min(0.06, (timestamp - state.lastTimestamp) / 1000);
      state.lastTimestamp = timestamp;
      state.lastDeltaSec = deltaSec;
      ambientWaterTime += deltaSec;

      if (state.isPlaying) {
        const voiceDur = (audioVoice && isFinite(audioVoice.duration) && audioVoice.duration > 0)
          ? audioVoice.duration
          : VOICE_DURATION_SEC;
        if (!audioVoice.paused && audioVoice.currentTime > 0 && audioVoice.currentTime <= voiceDur) {
          state.currentTime = audioVoice.currentTime;
        } else if (!audioMusic.paused && audioMusic.currentTime > 0) {
          state.currentTime = audioMusic.currentTime;
        } else {
          state.currentTime += deltaSec;
        }
        if (state.currentTime > TOTAL_DURATION_SEC) {
          state.currentTime = TOTAL_DURATION_SEC;
          onExperienceEnded();
        }
      }

      // Continuous 60/120 FPS water time
      if (waterMesh && waterMesh.material && waterMesh.material.uniforms) {
        waterMesh.material.uniforms.uTime.value = ambientWaterTime;
      }

      // Timeline Updates
      updateExperienceTimeline(state.currentTime, deltaSec);

      // Camera Rotations & Orientation
      updateCameraRotation();

      // Gaze Interaction
      updateGazeInteraction(deltaSec);

      // Ensure camera matrix world is updated before stereoCamera update
      if (cameraRig) {
        cameraRig.updateMatrixWorld(true);
      } else if (camera) {
        camera.updateMatrixWorld(true);
      }

      // Stereo Cardboard VR or Monoscopic Rendering
      const width = window.innerWidth;
      const height = window.innerHeight;

      if (state.isVRMode) {
        renderer.setScissorTest(true);
        stereoCamera.update(camera);

        // Left Eye Viewport
        renderer.setScissor(0, 0, width / 2, height);
        renderer.setViewport(0, 0, width / 2, height);
        renderer.render(scene, stereoCamera.cameraL);

        // Right Eye Viewport
        renderer.setScissor(width / 2, 0, width / 2, height);
        renderer.setViewport(width / 2, 0, width / 2, height);
        renderer.render(scene, stereoCamera.cameraR);

        renderer.setScissorTest(false);
      } else {
        renderer.setScissorTest(false);
        renderer.setViewport(0, 0, width, height);
        renderer.render(scene, camera);
      }
    }

    /* ======================================================================
       FLUTTER BRIDGE & NATIVE API
       ====================================================================== */
    function notifyFlutter(eventName, data) {
      try {
        if (window.flutter_inappwebview && typeof window.flutter_inappwebview.callHandler === 'function') {
          window.flutter_inappwebview.callHandler(eventName, data);
        }
        if (window.GuidoFlutterBridge && typeof window.GuidoFlutterBridge.postMessage === 'function') {
          window.GuidoFlutterBridge.postMessage(JSON.stringify({ event: eventName, data: data }));
        } else if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'GUIDO_VR', event: eventName, data: data }, '*');
        }
      } catch (e) {
        console.warn('Flutter notify error:', e);
      }
    }

    window.GuidoVR = {
      start: function() { playExperience(); },
      startSession: function() { playExperience(); },
      pause: function() { pauseExperience(); },
      pauseSession: function() { pauseExperience(); },
      toggle: function() { togglePlay(); },
      reset: function() { 
        state.isCompleted = false;
        hide2DCompletionPopup();
        hideVRCompletionPopup();
        seekExperience(0);
        pauseExperience();
      },
      seek: function(sec) { seekExperience(sec); },
      recenter: function() { recenterView(); },
      setVRMode: function(enable) { setVRMode(enable); },
      enableVR: function() { setVRMode(true); },
      disableVR: function() { setVRMode(false); },
      toggleVR: function() { toggleVR(); },
      setMuted: function(mute) {
        state.isMuted = !!mute;
        syncVolumes();
      },
      setDeviceOrientation: function(alpha, beta, gamma) {
        if (!state.isVRMode) return;
        deviceOrientationEnabled = true;
        orientationAlpha = Number(alpha) || 0;
        orientationBeta = Number(beta) || 0;
        orientationGamma = Number(gamma) || 0;
        updateCameraRotation();
      },
      setLookAngle: function(p, y) {
        deviceOrientationEnabled = false;
        pitch = targetPitch = Number(p) || 0;
        yaw = targetYaw = Number(y) || 0;
        if (camera) camera.rotation.set(pitch, yaw, 0, 'YXZ');
      },
      setCameraLook: function(p, y) {
        deviceOrientationEnabled = false;
        pitch = targetPitch = Number(p) || 0;
        yaw = targetYaw = Number(y) || 0;
        if (camera) camera.rotation.set(pitch, yaw, 0, 'YXZ');
      },
      showCompletionPopup: function() {
        if (state.isVRMode) showVRCompletionPopup();
        else show2DCompletionPopup();
      },
      hideCompletionPopup: function() {
        hideVRCompletionPopup();
        hide2DCompletionPopup();
      },
      getState: function() { return { ...state }; },
      dispose: function() { disposeExperience(); }
    };

    // Global Window Aliases for WebXR bridges & automated testing
    window.enterVR = function() { setVRMode(true); };
    window.exitVR = function() { setVRMode(false); };
    window.recenterVR = function() { recenterView(); };

    /* --- Web Wake Lock API (Keep Screen Awake) --- */
    let wakeLockSentinel = null;
    async function requestScreenWakeLock() {
      try {
        if ('wakeLock' in navigator && navigator.wakeLock && typeof navigator.wakeLock.request === 'function') {
          wakeLockSentinel = await navigator.wakeLock.request('screen');
        }
      } catch (e) {}
    }
    function releaseScreenWakeLock() {
      if (wakeLockSentinel) {
        try { wakeLockSentinel.release(); } catch (e) {}
        wakeLockSentinel = null;
      }
    }
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        requestScreenWakeLock();
      }
    });

    /* --- iOS Audio & Orientation Unlock On First User Gesture --- */
    function unlockAudioOnGesture() {
      unlockAudio();
      requestDeviceOrientationPermission();
      requestScreenWakeLock();
      window.removeEventListener('touchstart', unlockAudioOnGesture);
      window.removeEventListener('touchend', unlockAudioOnGesture);
      window.removeEventListener('pointerdown', unlockAudioOnGesture);
      window.removeEventListener('click', unlockAudioOnGesture);
    }
    window.addEventListener('touchstart', unlockAudioOnGesture, { passive: true });
    window.addEventListener('pointerdown', unlockAudioOnGesture, { passive: true });
    window.addEventListener('click', unlockAudioOnGesture, { passive: true });

    /* ======================================================================
       RESOURCE TEARDOWN & LIFECYCLE MANAGEMENT (Zero WebGL Leaks)
       ====================================================================== */
    function disposeExperience() {
      releaseScreenWakeLock();
      if (animationFrameId) {
        cancelAnimationFrame(animationFrameId);
        animationFrameId = null;
      }

      window.removeEventListener('resize', onWindowResize);
      window.removeEventListener('beforeunload', disposeExperience);
      window.removeEventListener('touchstart', unlockAudioOnGesture);
      window.removeEventListener('pointerdown', unlockAudioOnGesture);
      window.removeEventListener('click', unlockAudioOnGesture);

      if (synthOsc432) {
        try { synthOsc432.stop(); synthOsc432.disconnect(); } catch(e) {}
        synthOsc432 = null;
      }
      if (synthGain) {
        try { synthGain.disconnect(); } catch(e) {}
        synthGain = null;
      }
      if (audioCtx) {
        try { audioCtx.close(); } catch(e) {}
        audioCtx = null;
      }

      try {
        audioVoice.pause();
        audioMusic.pause();
        audioVoice.src = '';
        audioMusic.src = '';
      } catch (e) {}

      if (scene) {
        scene.traverse(obj => {
          if (obj.geometry) {
            try { obj.geometry.dispose(); } catch (e) {}
          }
          if (obj.material) {
            const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
            mats.forEach(m => {
              if (m.map) m.map.dispose();
              if (m.uniforms) {
                for (const u in m.uniforms) {
                  if (m.uniforms[u] && m.uniforms[u].value && m.uniforms[u].value.isTexture) {
                    try { m.uniforms[u].value.dispose(); } catch (e) {}
                  }
                }
              }
              try { m.dispose(); } catch (e) {}
            });
          }
        });
      }

      if (billboardTexture) {
        try { billboardTexture.dispose(); } catch (e) {}
      }

      if (renderer) {
        try {
          renderer.dispose();
          renderer.forceContextLoss();
          if (renderer.domElement && renderer.domElement.parentNode) {
            renderer.domElement.parentNode.removeChild(renderer.domElement);
          }
        } catch (e) {}
      }

      notifyFlutter('onVRDisposed', { status: 'disposed', experience: 'meditazione_sera_acqua' });
    }

    window.addEventListener('beforeunload', disposeExperience);

    // DOM Boot & Automatic Start
    window.addEventListener('DOMContentLoaded', () => {
      initThreeScene();
      syncVolumes();
      requestScreenWakeLock();
      animate(0);

      const urlParams = new URLSearchParams(window.location.search);
      const isVrParam = urlParams.get('vr') === 'true' || urlParams.get('vr') === '1' || urlParams.get('vr') === 'yes';
      if (isVrParam) {
        setVRMode(true);
      }
      if (urlParams.has('seek')) {
        const targetSec = parseFloat(urlParams.get('seek'));
        seekExperience(targetSec);
      } else {
        playExperience();
      }

      window.focus();
      if (document.body) document.body.focus();

      notifyFlutter('onVRReady', { status: 'ready', experience: 'meditazione_sera_acqua', duration: TOTAL_DURATION_SEC });
    });
  </script>
</body>
</html>
