    function updateGazeInteraction(deltaSec) {
      if (!state.isVRMode || !vrReticleGroup || !vrCompletionPopupGroup || !vrCompletionPopupGroup.visible || gazeIntersectTargets.length === 0) {
        gazeHoverTarget = null;
        gazeDwellTimer = 0.0;
        if (vrReticleRing) {
          vrReticleRing.scale.set(1.0, 1.0, 1.0);
          vrReticleRing.material.opacity = 0.7;
        }
        return;
      }

      camera.getWorldPosition(_gazeOrigin);
      camera.getWorldDirection(_gazeForwardDir);
      gazeRaycaster.set(_gazeOrigin, _gazeForwardDir);
      const hits = gazeRaycaster.intersectObjects(gazeIntersectTargets, true);

      if (hits.length > 0) {
        let hitObj = hits[0].object;
        while (hitObj && (!hitObj.userData || typeof hitObj.userData.onDwellSelect !== 'function') && hitObj.parent && hitObj.parent !== scene) {
          hitObj = hitObj.parent;
        }

        if (hitObj && hitObj.userData && typeof hitObj.userData.onDwellSelect === 'function') {
          if (gazeHoverTarget === hitObj) {
            gazeDwellTimer += deltaSec;
            const progress = Math.min(1.0, gazeDwellTimer / DWELL_DURATION_SEC);

            if (vrReticleRing) {
              const s = 1.0 + progress * 0.75;
              vrReticleRing.scale.set(s, s, 1.0);
              vrReticleRing.material.opacity = 0.5 + progress * 0.5;
            }

            if (gazeDwellTimer >= DWELL_DURATION_SEC) {
              gazeDwellTimer = 0.0;
              if (vrReticleRing) {
                vrReticleRing.scale.set(1.0, 1.0, 1.0);
                vrReticleRing.material.opacity = 0.7;
              }
              notifyFlutter('onGazeTrigger', { action: hitObj.userData.actionName || 'click' });
              hitObj.userData.onDwellSelect();
            }
          } else {
            gazeHoverTarget = hitObj;
            gazeDwellTimer = 0.0;
          }
          return;
        }
      }

      gazeHoverTarget = null;
      gazeDwellTimer = 0.0;
      if (vrReticleRing) {
        vrReticleRing.scale.set(1.0, 1.0, 1.0);
        vrReticleRing.material.opacity = 0.7;
      }
    }

    function create3DButton(label, x, y, colorHex, actionName, onSelect) {
      const group = new THREE.Group();
      group.position.set(x, y, 0.02);

      const bgGeo = new THREE.PlaneGeometry(0.85, 0.35);
      const bgMat = new THREE.MeshBasicMaterial({
        color: colorHex,
        transparent: true,
        opacity: 0.88,
        depthTest: false,
        depthWrite: false
      });
      const bgMesh = new THREE.Mesh(bgGeo, bgMat);
      bgMesh.renderOrder = 9999;
      bgMesh.userData = { onDwellSelect: onSelect, actionName: actionName };
      group.add(bgMesh);

      const txt = createPopupTextSprite(label, 'bold 24px sans-serif', '#FFFFFF', 0.8, 0.32);
      txt.position.set(0, 0, 0.01);
      group.add(txt);
      return group;
    }

    /* ======================================================================
       TIMELINE & VFX ORCHESTRATION ENGINE (Ultra-Smooth Scene Transitions)
       ====================================================================== */
    function updateExperienceTimeline(timeSec, deltaSec, snapCamera = false) {
      state.currentTime = timeSec;

      // Update Subtitles (Voice Synchronized, Smooth Fading)
      updateSubtitlesForTime(timeSec, snapCamera);

      // Water Gerstner Animation Uniforms
      if (waterMesh && waterMesh.material && waterMesh.material.uniforms) {
        waterMesh.material.uniforms.uTime.value = ambientWaterTime;

        // Breath 3 calm effect: water ripples settle smoothly at 227-236s
        let calmness = 1.0;
        if (timeSec >= 227.0 && timeSec <= 236.0) {
          const p = (timeSec - 227.0) / 9.0;
          calmness = 1.0 - Math.sin(p * Math.PI) * 0.70;
        }
        waterMesh.material.uniforms.uCalmness.value = calmness;
      }

      // Subtle solar breathing / corona modulation during Scene 2 (Sole allo Zenith)
      if (sunCoronaMesh) {
        let solarScale = 1.0;
        if (timeSec >= 40.0 && timeSec <= 90.0) {
          const p = smoothstep(40.0, 55.0, timeSec) * (1.0 - smoothstep(75.0, 90.0, timeSec));
          solarScale = 1.0 + p * (0.05 * Math.sin(timeSec * 0.8));
        }
        sunCoronaMesh.scale.set(solarScale, solarScale, 1.0);
      }

      // ========================================================================
      // CONTINUOUS CAMERA POSITION & ALTITUDE TRAJECTORY (ZERO TELEPORTATION!)
      // ========================================================================
      let targetCamX = 0.0;
      let targetCamY = 2.2;
      let targetCamZ = 14.5;

      if (timeSec < 40.0) {
        // Scene 1: Connessione Naturale — Expansive shoreline promontory
        targetCamY = 2.2;
        targetCamZ = 14.5;
      } else if (timeSec >= 40.0 && timeSec < 75.0) {
        // Scene 2: Sole allo Zenith — Continuous smooth ascent toward regal high sun
        const p = smoothstep(40.0, 65.0, timeSec);
        targetCamY = lerp(2.2, 2.7, p);
        targetCamZ = lerp(14.5, 13.5, p);
      } else if (timeSec >= 75.0 && timeSec < 90.0) {
        // Scene 2 -> 3 Transition: Gentle glide down to grounded shoreline
        const p = smoothstep(75.0, 90.0, timeSec);
        targetCamY = lerp(2.7, 1.8, p);
        targetCamZ = lerp(13.5, 12.0, p);
      } else if (timeSec >= 90.0 && timeSec < 122.0) {
        // Scene 3: Onde di Presenza — Grounded shoreline with subtle water wave breath
        const waveBob = Math.sin(timeSec * 0.8) * 0.02;
        targetCamY = 1.8 + waveBob;
        targetCamZ = 12.0;
      } else if (timeSec >= 122.0 && timeSec < 167.0) {
        // Scene 4: Saggezza della Natura — Soft contemplative glide nearing water edge
        const p = smoothstep(122.0, 142.0, timeSec);
        const bob = Math.sin(timeSec * 0.7) * 0.015;
        targetCamY = lerp(1.8, 1.65, p) + bob;
        targetCamZ = lerp(12.0, 10.8, p);
      } else if (timeSec >= 167.0 && timeSec < 236.0) {
        // Scene 5: I Tre Respiri Guidati — Guided breathing with bio-pacing vertical chest expansion
        let breathElevation = 0.0;
        if (timeSec >= 167.0 && timeSec < 181.0) {
          const t = (timeSec - 167.0) / 14.0;
          breathElevation = (1.0 - Math.cos(t * Math.PI)) * 0.5 * 0.035;
        } else if (timeSec >= 181.0 && timeSec < 188.0) {
          const t = (timeSec - 181.0) / 7.0;
          breathElevation = (1.0 + Math.cos(t * Math.PI)) * 0.5 * 0.035;
        } else if (timeSec >= 188.0 && timeSec < 200.0) {
          const t = (timeSec - 188.0) / 12.0;
          breathElevation = (1.0 - Math.cos(t * Math.PI)) * 0.5 * 0.035;
        } else if (timeSec >= 200.0 && timeSec < 214.0) {
          const t = (timeSec - 200.0) / 14.0;
          breathElevation = (1.0 + Math.cos(t * Math.PI)) * 0.5 * 0.035;
        } else if (timeSec >= 214.0 && timeSec < 226.0) {
          const t = (timeSec - 214.0) / 12.0;
          breathElevation = (1.0 - Math.cos(t * Math.PI)) * 0.5 * 0.035;
        } else if (timeSec >= 226.0 && timeSec < 236.0) {
          const t = (timeSec - 226.0) / 10.0;
          breathElevation = (1.0 + Math.cos(t * Math.PI)) * 0.5 * 0.035;
        }

        const pEaseIn = smoothstep(167.0, 172.0, timeSec);
        targetCamZ = lerp(10.8, 11.5, pEaseIn);
        targetCamY = 1.75 + breathElevation;
      } else if (timeSec >= 236.0 && timeSec < 285.0) {
        // Scene 6 & 7: Drago Njord & Arcobaleno / Creatività & Doni — Expansive sky vantage
        const pDragonCam = smoothstep(236.0, 252.0, timeSec);
        const pSettle = smoothstep(274.0, 285.0, timeSec);
        const camYMid = lerp(1.75, 2.05, pDragonCam);
        const camZMid = lerp(11.5, 13.0, pDragonCam);
        targetCamY = lerp(camYMid, 1.8, pSettle);
        targetCamZ = lerp(camZMid, 12.0, pSettle);

        // Subtle skyward glance framing the soaring dragon in PC preview
        if (!state.userHasDraggedCamera && !state.isVRMode && !deviceOrientationEnabled) {
          const pGlance = smoothstep(236.0, 248.0, timeSec) * (1.0 - smoothstep(266.0, 282.0, timeSec));
          targetPitch = lerp(0.08, 0.22, pGlance);
        }
      } else {
        // Scene 8: Risveglio e Luce — Resting in peaceful calm
        const pOutro = smoothstep(285.0, 295.0, timeSec);
        targetCamY = lerp(1.8, 1.8, pOutro);
        targetCamZ = lerp(12.0, 12.0, pOutro);
      }

      // Frame-rate independent exponential camera rig position decay (or snap on seek)
      if (cameraRig) {
        if (snapCamera) {
          cameraRig.position.set(targetCamX, targetCamY, targetCamZ);
        } else {
          const camDamp = 1.0 - Math.exp(-6.0 * deltaSec);
          cameraRig.position.x += (targetCamX - cameraRig.position.x) * camDamp;
          cameraRig.position.y += (targetCamY - cameraRig.position.y) * camDamp;
          cameraRig.position.z += (targetCamZ - cameraRig.position.z) * camDamp;
        }
      }

      // ========================================================================
      // WARM SOLAR LIGHT THRESHOLD VEIL (Atmospheric Crossfades)
      // ========================================================================
      if (thresholdMesh) {
        let veilAlpha = 0.0;

        // Transition Scene 4 -> Scene 5 (Entering Guided Breaths 165.5s - 168.0s)
        if (timeSec >= 165.5 && timeSec <= 168.0) {
          const t = (timeSec - 165.5) / 2.5;
          veilAlpha = Math.sin(t * Math.PI) * 0.28;
        }
        // Transition Scene 5 -> Scene 6 (Drago Njord Entrance 235.0s - 237.5s)
        else if (timeSec >= 235.0 && timeSec <= 237.5) {
          const t = (timeSec - 235.0) / 2.5;
          veilAlpha = Math.sin(t * Math.PI) * 0.32;
        }
        // Transition Scene 7 -> Scene 8 (Reawakening 284.5s - 287.0s)
        else if (timeSec >= 284.5 && timeSec <= 287.0) {
          const t = (timeSec - 284.5) / 2.5;
          veilAlpha = Math.sin(t * Math.PI) * 0.25;
        }

        // User Seek / Scrubbing Crossfade micro-veil
        if (seekVeilTimer > 0.0) {
          seekVeilTimer = Math.max(0.0, seekVeilTimer - deltaSec);
          const seekProgress = seekVeilTimer / 0.40;
          const seekAlpha = Math.sin(seekProgress * Math.PI) * 0.45;
          veilAlpha = Math.max(veilAlpha, seekAlpha);
        }

        thresholdMesh.material.opacity = veilAlpha;
        thresholdMesh.visible = veilAlpha > 0.002;
      }

      /* --- VFX 1: CONCENTRIC GROUND WAVES (90s - 122s) --- */
      if (vfxGroundWaves && vfxGroundWaves.length === 3) {
        const waveConfigs = [
          { start: 90.0, dur: 12.0 },
          { start: 102.0, dur: 9.0 },
          { start: 110.0, dur: 12.0 }
        ];

        // Progressive smooth fade-in at start and delicate fade-out at end
        const groundMasterFade = smoothstep(89.5, 93.0, timeSec) * (1.0 - smoothstep(118.5, 122.0, timeSec));

        const motes = vfxGroundWavesGroup.userData.motes;
        if (motes) {
          motes.visible = groundMasterFade > 0.001;
          motes.material.opacity = groundMasterFade * 0.85;
          if (motes.visible) {
            motes.rotation.y = timeSec * 0.04;
          }
        }

        for (let i = 0; i < 3; i++) {
          const mesh = vfxGroundWaves[i];
          const cfg = waveConfigs[i];
          if (timeSec >= cfg.start && timeSec <= cfg.start + cfg.dur && groundMasterFade > 0.001) {
            const p = (timeSec - cfg.start) / cfg.dur;
            const r = 0.5 + p * 17.5;
            mesh.scale.set(r, r, 1.0);
            // Smooth attack and natural radial dissipation
            const attack = smoothstep(0.0, 0.18, p);
            const decay = 1.0 - p * p;
            const ringOp = attack * decay * 0.88 * groundMasterFade;
            mesh.material.opacity = ringOp;
            mesh.visible = ringOp > 0.002;
          } else {
            mesh.visible = false;
            mesh.material.opacity = 0.0;
          }
        }
      }

      /* --- VFX 2: THE 3 GUIDED BREATHS PARTICLES (167s - 236s) --- */
      if (vfxBreathsPoints) {
        // Continuous soft master fade envelope: zero sudden appearance or disappearance
        const breathMasterFade = smoothstep(166.5, 170.5, timeSec) * (1.0 - smoothstep(231.5, 236.0, timeSec));

        if (breathMasterFade > 0.001) {
          vfxBreathsPoints.visible = true;

          // Continuous 3-color blending without abrupt color jumps
          // Breath 1 (Gold): 167 - 188s
          // Breath 2 (Emerald Teal): 188 - 214s
          // Breath 3 (Cyan-Rainbow): 214 - 236s
          if (timeSec < 186.0) {
            _breathColor.copy(_colGold);
          } else if (timeSec < 190.0) {
            const t = smoothstep(186.0, 190.0, timeSec);
            _breathColor.copy(_colGold).lerp(_colEmerald, t);
          } else if (timeSec < 212.0) {
            _breathColor.copy(_colEmerald);
          } else if (timeSec < 216.0) {
            const t = smoothstep(212.0, 216.0, timeSec);
            _breathColor.copy(_colEmerald).lerp(_colCyan, t);
          } else {
            _breathColor.copy(_colCyan);
          }

          // Smooth sinusoidal bio-pacing radius expansion and contraction
          let currentRadiusScale = 1.0;
          if (timeSec <= 188.0) {
            // Breath 1
            if (timeSec <= 181.0) {
              const t = (timeSec - 167.0) / 14.0;
              const ease = (1.0 - Math.cos(Math.PI * clamp(t, 0.0, 1.0))) * 0.5;
              currentRadiusScale = 1.0 - ease * 0.78;
            } else {
              const t = (timeSec - 181.0) / 7.0;
              const ease = (1.0 - Math.cos(Math.PI * clamp(t, 0.0, 1.0))) * 0.5;
              currentRadiusScale = 0.22 + ease * 0.88;
            }
          } else if (timeSec <= 214.0) {
            // Breath 2
            if (timeSec <= 200.0) {
              const t = (timeSec - 188.0) / 12.0;
              const ease = (1.0 - Math.cos(Math.PI * clamp(t, 0.0, 1.0))) * 0.5;
              currentRadiusScale = 1.10 - ease * 0.88;
            } else {
              const t = (timeSec - 200.0) / 14.0;
              const ease = (1.0 - Math.cos(Math.PI * clamp(t, 0.0, 1.0))) * 0.5;
              currentRadiusScale = 0.22 + ease * 0.95;
            }
          } else {
            // Breath 3
            if (timeSec <= 226.0) {
              const t = (timeSec - 214.0) / 12.0;
              const ease = (1.0 - Math.cos(Math.PI * clamp(t, 0.0, 1.0))) * 0.5;
              currentRadiusScale = 1.17 - ease * 0.95;
            } else {
              const t = (timeSec - 226.0) / 10.0;
              const ease = (1.0 - Math.cos(Math.PI * clamp(t, 0.0, 1.0))) * 0.5;
              currentRadiusScale = 0.22 + ease * 1.05;
            }
          }

          // Living sacred prana orbital swirl & radius scale applied directly to object matrix (Zero CPU array copying)
          vfxBreathsPoints.rotation.y = (timeSec - 167.0) * 0.25;
          vfxBreathsPoints.scale.setScalar(currentRadiusScale);
          vfxBreathsPoints.material.color.copy(_breathColor);
          vfxBreathsPoints.material.opacity = breathMasterFade * 0.88;
        } else {
          vfxBreathsPoints.visible = false;
          vfxBreathsPoints.material.opacity = 0.0;
        }
      }

      /* --- VFX 3: MAJESTIC WATER DRAGON NJORD & RAINBOW AURORA (234s - 286s) --- */
      if (vfxDragonNjordGroup) {
        if (timeSec >= 234.0 && timeSec <= 286.0) {
          if (vfxDragonNjordGroup.userData.update) {
            vfxDragonNjordGroup.userData.update(timeSec);
          }

          if (vfxDragonMotes) {
            const fadeIn = Math.min(1.0, Math.max(0.0, (timeSec - 234.0) / 4.5));
            const fadeOut = Math.min(1.0, Math.max(0.0, (286.0 - timeSec) / 6.0));
            const motesAlpha = Math.sin(fadeIn * Math.PI * 0.5) * Math.sin(fadeOut * Math.PI * 0.5);
            vfxDragonMotes.material.opacity = motesAlpha * 0.88;
            vfxDragonMotes.visible = motesAlpha > 0.002;
            vfxDragonMotes.rotation.y = timeSec * 0.05;
          }

          vfxDragonNjordGroup.visible = true;
        } else {
          vfxDragonNjordGroup.visible = false;
          if (waterMesh && waterMesh.material && waterMesh.material.uniforms && waterMesh.material.uniforms.uDragonIntensity) {
            waterMesh.material.uniforms.uDragonIntensity.value = 0.0;
          }
        }
      }

      /* --- VFX 4: WARM REAWAKENING DOME (285s - 360s) --- */
      if (vfxWarmReawakeningDome) {
        if (timeSec >= 284.5 && timeSec <= 360.0) {
          // Soft growth from 284.5s to 320.0s
          const pGrowth = smoothstep(284.5, 320.0, timeSec);
          // Gentle bio-harmonic breathing pulse
          const pPulse = 1.0 + 0.05 * Math.sin((timeSec - 284.5) * 0.6);
          // Harmonious gentle settling decay toward final stillness
          const pDecay = 1.0 - smoothstep(345.0, 360.0, timeSec) * 0.35;
          const intensity = pGrowth * pPulse * pDecay;

          vfxWarmReawakeningDome.material.uniforms.uGlowIntensity.value = intensity;
          vfxWarmReawakeningDome.visible = intensity > 0.002;
        } else {
          vfxWarmReawakeningDome.visible = false;
          vfxWarmReawakeningDome.material.uniforms.uGlowIntensity.value = 0.0;
        }
      }

      // Check Session Completion
      if (timeSec >= TOTAL_DURATION_SEC && !state.isCompleted) {
        state.isCompleted = true;
        pauseExperience();
        notifyFlutter('onSessionComplete', { duration: TOTAL_DURATION_SEC });
        if (state.isVRMode) {
          showVRCompletionPopup();
        } else {
          show2DCompletionPopup();
        }
      }

      // Update Desktop Scrubber UI
      updateUIProgress(timeSec);
    }

    /* --- SUBTITLES SMOOTH CROSSFADE & VOICE SYNC --- */
    let lastActiveSubtitle = "";
    let subtitleTransitionTimeout = null;
    let pending3DText = "";
    let displayed3DText = "";
    let domHudSubtitleBox = null;
    let domHudSubtitleText = null;

    function setSubtitleTextSmooth(text, immediate = false) {
      if (text === lastActiveSubtitle && !immediate) return;

      if (subtitleTransitionTimeout) {
        clearTimeout(subtitleTransitionTimeout);
        subtitleTransitionTimeout = null;
      }

      const hudBox = domHudSubtitleBox || document.getElementById('hud-subtitle-box');
      const hudText = domHudSubtitleText || document.getElementById('hud-subtitle-text');
      if (!hudBox || !hudText) {
        lastActiveSubtitle = text;
        return;
      }

      if (immediate) {
        lastActiveSubtitle = text;
        hudText.textContent = text || "";
        if (text) {
          hudBox.classList.add('visible');
        } else {
          hudBox.classList.remove('visible');
        }
        return;
      }

      if (!text) {
        // Fade out to empty
        lastActiveSubtitle = "";
        hudBox.classList.remove('visible');
      } else if (!lastActiveSubtitle) {
        // Fade in from empty
        lastActiveSubtitle = text;
        hudText.textContent = text;
        hudBox.classList.add('visible');
      } else {
        // Smooth crossfade between consecutive sentences: fade out old (0.25s), swap, fade in (0.35s)
        lastActiveSubtitle = text;
        hudBox.classList.remove('visible');
        subtitleTransitionTimeout = setTimeout(() => {
          hudText.textContent = text;
          hudBox.classList.add('visible');
          subtitleTransitionTimeout = null;
        }, 260);
      }
    }

    function updateSubtitlesForTime(timeSec, snap = false) {
      // Primary temporal clock: smoothly locked to experience continuous timeline
      const currentVoiceTime = typeof timeSec === 'number' ? timeSec : state.currentTime;

      let activeText = "";
      for (let i = 0; i < SCRIPT_CUES.length; i++) {
        if (currentVoiceTime >= SCRIPT_CUES[i].start && currentVoiceTime <= SCRIPT_CUES[i].end) {
          activeText = SCRIPT_CUES[i].text;
          break;
        }
      }

      setSubtitleTextSmooth(activeText, snap);

      // 3D VR Billboard target
      pending3DText = activeText;
      if (snap && billboardMesh) {
        displayed3DText = activeText;
        update3DSubtitle(activeText);
        billboardMesh.material.opacity = activeText ? 1.0 : 0.0;
        billboardMesh.visible = (state.isVRMode && !!activeText);
      }
    }

    let domProgressFill = null;
    let domCurTime = null;
    let domTotalTime = null;
    let domBadge = null;
    let domScenePills = null;
    let lastRenderedSecond = -1;
    let lastRenderedSceneIndex = -1;

    function cacheDOMElements() {
      domProgressFill = document.getElementById('progress-fill');
      domCurTime = document.getElementById('scrub-current-time');
      domTotalTime = document.getElementById('hud-time-display');
      domBadge = document.getElementById('hud-scene-name');
      domScenePills = document.querySelectorAll('.scene-btn');
      domHudSubtitleBox = document.getElementById('hud-subtitle-box');
      domHudSubtitleText = document.getElementById('hud-subtitle-text');
    }

    function updateUIProgress(timeSec) {
      const p = Math.min(1.0, Math.max(0.0, timeSec / TOTAL_DURATION_SEC));
      if (!domProgressFill) domProgressFill = document.getElementById('progress-fill');
      if (domProgressFill) domProgressFill.style.width = (p * 100) + '%';

      const curSecInt = Math.floor(timeSec);
      if (curSecInt !== lastRenderedSecond) {
        lastRenderedSecond = curSecInt;
        if (!domCurTime) domCurTime = document.getElementById('scrub-current-time');
        if (domCurTime) domCurTime.textContent = formatTime(timeSec);
        if (!domTotalTime) domTotalTime = document.getElementById('hud-time-display');
        if (domTotalTime) domTotalTime.textContent = formatTime(timeSec) + ' / ' + formatTime(TOTAL_DURATION_SEC);
      }

      // Active scene badge update
      let curSceneIdx = 0;
      for (let i = 0; i < SCENES_CONFIG.length; i++) {
        if (timeSec >= SCENES_CONFIG[i].start) {
          curSceneIdx = i;
        }
      }

      if (curSceneIdx !== lastRenderedSceneIndex) {
        lastRenderedSceneIndex = curSceneIdx;
        state.currentSceneIndex = curSceneIdx;
        const curScene = SCENES_CONFIG[curSceneIdx];
        if (!domBadge) domBadge = document.getElementById('hud-scene-name');
        if (domBadge && curScene) {
          domBadge.textContent = curScene.name;
        }
        if (!domScenePills || domScenePills.length === 0) domScenePills = document.querySelectorAll('.scene-btn');
        if (domScenePills) {
          domScenePills.forEach((btn, idx) => {
            if (idx === curSceneIdx) {
              btn.classList.add('active');
            } else {
              btn.classList.remove('active');
            }
          });
        }
      }
    }

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
    }

    /* ======================================================================
       PLAYBACK & NAVIGATION CONTROLS
       ====================================================================== */
    function playExperience() {
      state.isPlaying = true;
      unlockAudio();
      audioVoice.play().catch(() => {});
      audioMusic.play().catch(() => {});

      // Update Desktop play/pause button
      const playIcon = document.getElementById('icon-play');
      const pauseIcon = document.getElementById('icon-pause');
      const playLabel = document.getElementById('play-pause-label');
      if (playIcon) playIcon.style.display = 'none';
      if (pauseIcon) pauseIcon.style.display = 'inline';
      if (playLabel) playLabel.textContent = 'Pausa';

      // Update Mobile play/pause button
      const mPlayIcon = document.getElementById('icon-mobile-play');
      const mPauseIcon = document.getElementById('icon-mobile-pause');
      const mLabel = document.getElementById('label-mobile-pause');
      if (mPlayIcon) mPlayIcon.style.display = 'none';
      if (mPauseIcon) mPauseIcon.style.display = 'inline';
      if (mLabel) mLabel.textContent = 'PAUSA';
    }

    function pauseExperience() {
      state.isPlaying = false;
      try { audioVoice.pause(); } catch(e) {}
      try { audioMusic.pause(); } catch(e) {}

      // Update Desktop play/pause button
      const playIcon = document.getElementById('icon-play');
      const pauseIcon = document.getElementById('icon-pause');
      const playLabel = document.getElementById('play-pause-label');
      if (playIcon) playIcon.style.display = 'inline';
      if (pauseIcon) pauseIcon.style.display = 'none';
      if (playLabel) playLabel.textContent = 'Avvia';

      // Update Mobile play/pause button
      const mPlayIcon = document.getElementById('icon-mobile-play');
      const mPauseIcon = document.getElementById('icon-mobile-pause');
      const mLabel = document.getElementById('label-mobile-pause');
      if (mPlayIcon) mPlayIcon.style.display = 'inline';
      if (mPauseIcon) mPauseIcon.style.display = 'none';
      if (mLabel) mLabel.textContent = 'RIPRENDI';
    }

    function togglePlay() {
      if (state.isPlaying) pauseExperience();
      else playExperience();
    }

    let isAudioSeeking = false;
    let lastSeekTime = 0;

    function seekExperience(sec) {
      const targetSec = Math.max(0, Math.min(TOTAL_DURATION_SEC, sec));
      state.currentTime = targetSec;
      lastSeekTime = performance.now();
      isAudioSeeking = true;
      seekVeilTimer = 0.40;

      if (state.isCompleted && targetSec < TOTAL_DURATION_SEC) {
        state.isCompleted = false;
        hide2DCompletionPopup();
        hideVRCompletionPopup();
      }

      function applyAudioSeek(el, t) {
        if (!el) return;
        try {
          if (el.readyState >= 1) {
            el.currentTime = t;
          } else {
            el.addEventListener('loadedmetadata', () => {
              try { el.currentTime = t; } catch(e) {}
            }, { once: true });
          }
        } catch(e) {}
      }

      const voiceSeekLimit = (audioVoice && isFinite(audioVoice.duration) && audioVoice.duration > 0)
        ? audioVoice.duration
        : VOICE_DURATION_SEC;
      applyAudioSeek(audioVoice, Math.min(targetSec, voiceSeekLimit));
      applyAudioSeek(audioMusic, targetSec);

      setTimeout(() => {
        isAudioSeeking = false;
      }, 350);

      updateExperienceTimeline(targetSec, 0.016, true);
    }

    /* ======================================================================
       CAMERA ROTATION & HEAD TRACKING (Identical to Mattino/Sera Kinematics)
       ====================================================================== */
    function enableDeviceOrientation() {
      window.addEventListener('deviceorientation', (e) => {
        if (!state.isVRMode) return;
        if (e && e.alpha !== null && e.alpha !== undefined && e.beta !== null && e.gamma !== null && (Math.abs(e.alpha) > 0.01 || Math.abs(e.beta) > 0.01 || Math.abs(e.gamma) > 0.01)) {
          deviceOrientationEnabled = true;
          orientationAlpha = e.alpha;
          orientationBeta = e.beta;
          orientationGamma = e.gamma;
        }
      }, true);
    }

    function requestDeviceOrientationPermission() {
      enableDeviceOrientation();
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission()
          .then(perm => {
            if (perm === 'granted') enableDeviceOrientation();
          })
          .catch(() => {});
      }
    }

    function updateCameraRotation() {
      if (!camera) return;

      // Damped smooth yaw & pitch look — zero bounce, zero snapback
      const rotDamp = 1.0 - Math.exp(-14.0 * (state.lastDeltaSec || 0.016));
      yaw += (targetYaw - yaw) * rotDamp;
      pitch += (targetPitch - pitch) * rotDamp;

      if (deviceOrientationEnabled && state.isVRMode) {
        const alphaRad = THREE.MathUtils.degToRad(orientationAlpha + vrAlphaOffset) + yaw;
        const betaRad = THREE.MathUtils.degToRad(orientationBeta);
        const gammaRad = THREE.MathUtils.degToRad(orientationGamma);
        const orientRad = THREE.MathUtils.degToRad(getScreenOrientationAngle());

        _euler.set(betaRad, alphaRad, -gammaRad, 'YXZ');
        camera.quaternion.setFromEuler(_euler);
        camera.quaternion.multiply(_q1);
        _q0.setFromAxisAngle(_zee, -orientRad);
        camera.quaternion.multiply(_q0);
      } else {
        camera.rotation.set(pitch, yaw, 0, 'YXZ');
      }
    }

    function getScreenOrientationAngle() {
      if (screen.orientation && typeof screen.orientation.angle === 'number') {
        return screen.orientation.angle;
      }
      if (typeof window.orientation === 'number') {
        return window.orientation;
      }
      if (window.innerWidth > window.innerHeight) {
        return 90;
      }
      return 0;
    }

    function recenterView() {
      state.userHasDraggedCamera = false;
      targetYaw = 0;
      targetPitch = 0.08;
      yaw = 0;
      pitch = 0.08;
      vrAlphaOffset = -orientationAlpha;
      updateCameraRotation();
    }

    function setVRMode(enable) {
      state.isVRMode = !!enable;
      const overlay = document.getElementById('vr-overlay');

      if (state.isVRMode) {
        camera.fov = 72;
        camera.updateProjectionMatrix();
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1.0, 1.25));
        document.body.classList.add('vr-active');
        if (overlay) overlay.classList.add('active');
        if (vrReticleGroup) vrReticleGroup.visible = true;
        if (billboardMesh) {
          lastRenderedSubtitleText = null;
          const currentText = lastActiveSubtitle || (state.currentTime > 0 ? "" : SCRIPT_CUES[0].text);
          displayed3DText = currentText;
          pending3DText = currentText;
          update3DSubtitle(currentText);
          billboardMesh.material.opacity = currentText ? 1.0 : 0.0;
          billboardMesh.visible = !!currentText;
        }
        requestDeviceOrientationPermission();
        if (screen.orientation && screen.orientation.lock) {
          screen.orientation.lock('landscape').catch(() => {});
        }
      } else {
        deviceOrientationEnabled = false;
        camera.fov = 52;
        camera.updateProjectionMatrix();
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1.0, 1.3));
        document.body.classList.remove('vr-active');
        if (overlay) overlay.classList.remove('active');
        if (vrReticleGroup) vrReticleGroup.visible = false;
        if (billboardMesh) billboardMesh.visible = false;
        hideVRCompletionPopup();
        if (screen.orientation && screen.orientation.unlock) {
          screen.orientation.unlock().catch(() => {});
        }
      }
      onWindowResize();
    }

    function toggleVR() {
      setVRMode(!state.isVRMode);
    }

    /* ======================================================================
       INTERACTION CONTROLS (TOUCH, MOUSE, KEYBOARD)
       ====================================================================== */
    function initControls() {
      cacheDOMElements();
      requestDeviceOrientationPermission();
      const container = document.getElementById('webgl-container');

      // Mouse drag for desktop look
      container.addEventListener('mousedown', (e) => {
        isUserDragging = true;
        prevMouseX = e.clientX;
        prevMouseY = e.clientY;
      });

      window.addEventListener('mousemove', (e) => {
        if (!isUserDragging || state.isVRMode) return;
        state.userHasDraggedCamera = true;
        const dx = e.clientX - prevMouseX;
        const dy = e.clientY - prevMouseY;
        prevMouseX = e.clientX;
        prevMouseY = e.clientY;

        targetYaw -= dx * 0.0035;
        targetPitch -= dy * 0.003;
        targetPitch = Math.max(-Math.PI / 2.3, Math.min(Math.PI / 2.3, targetPitch));
      });

      window.addEventListener('mouseup', () => { isUserDragging = false; });

      // Touch drag for mobile / tablet preview
      let touchStartX = 0, touchStartY = 0;
      container.addEventListener('touchstart', (e) => {
        if (e.target.closest('#mobile-controls-bar') || e.target.closest('#ui-layer')) return;
        if (e.touches.length === 1) {
          isUserDragging = true;
          touchStartX = e.touches[0].clientX;
          touchStartY = e.touches[0].clientY;
        }
        unlockAudio();
      }, { passive: true });

      window.addEventListener('touchmove', (e) => {
        if (!isUserDragging || (state.isVRMode && deviceOrientationEnabled) || e.touches.length !== 1) return;
        state.userHasDraggedCamera = true;
        const dx = e.touches[0].clientX - touchStartX;
        const dy = e.touches[0].clientY - touchStartY;
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;

        targetYaw -= dx * 0.004;
        targetPitch -= dy * 0.0035;
        targetPitch = Math.max(-Math.PI / 2.3, Math.min(Math.PI / 2.3, targetPitch));
      }, { passive: true });

      window.addEventListener('touchend', () => { isUserDragging = false; });

      // Mouse Wheel Zoom
      window.addEventListener('wheel', (e) => {
        if (state.isVRMode) return;
        camera.fov = Math.max(35, Math.min(85, camera.fov + e.deltaY * 0.05));
        camera.updateProjectionMatrix();
      }, { passive: true });

      // Desktop Keyboard Shortcuts
      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
          e.preventDefault();
          togglePlay();
        } else if (e.code === 'KeyV') {
          toggleVR();
        } else if (e.code === 'KeyR') {
          recenterView();
        } else if (e.code === 'KeyF') {
          toggleFullscreen();
        } else if (e.code === 'ArrowRight') {
          seekExperience(state.currentTime + 10);
        } else if (e.code === 'ArrowLeft') {
          seekExperience(state.currentTime - 10);
        } else if (e.code === 'KeyM') {
          toggleMute();
        } else if (e.key >= '1' && e.key <= '8') {
          const sc = SCENES_CONFIG[parseInt(e.key) - 1];
          if (sc) seekExperience(sc.start);
        }
      });

      // UI Button Events
      const btnPlayPause = document.getElementById('btn-play-pause');
      if (btnPlayPause) btnPlayPause.addEventListener('click', togglePlay);

      const btnRecenter = document.getElementById('btn-recenter');
      if (btnRecenter) btnRecenter.addEventListener('click', recenterView);

      const btnAudioMute = document.getElementById('btn-audio-mute');
      if (btnAudioMute) btnAudioMute.addEventListener('click', toggleMute);

      const btnFullscreen = document.getElementById('btn-fullscreen');
      if (btnFullscreen) btnFullscreen.addEventListener('click', toggleFullscreen);

      const btnToggleVR = document.getElementById('btn-toggle-vr');
      if (btnToggleVR) btnToggleVR.addEventListener('click', toggleVR);

      // Mobile Controls Bar Buttons
      const btnMobilePause = document.getElementById('btn-mobile-pause');
      if (btnMobilePause) btnMobilePause.addEventListener('click', togglePlay);

      const btnMobileExit = document.getElementById('btn-mobile-exit');
      if (btnMobileExit) {
        btnMobileExit.addEventListener('click', () => {
          pauseExperience();
          notifyFlutter('onExitRequested', {});
        });
      }

      // Progress Track Scrubbing
      const progressWrapper = document.getElementById('progress-wrapper');
      if (progressWrapper) {
        progressWrapper.addEventListener('click', (e) => {
          const rect = progressWrapper.getBoundingClientRect();
          const clickX = e.clientX - rect.left;
          const ratio = Math.max(0, Math.min(1, clickX / rect.width));
          seekExperience(ratio * TOTAL_DURATION_SEC);
        });
      }

      // Fast Scene Selection Buttons
      const sceneBtns = document.querySelectorAll('.scene-btn');
      sceneBtns.forEach((btn) => {
        btn.addEventListener('click', () => {
          const t = parseFloat(btn.getAttribute('data-time') || '0');
          seekExperience(t);
        });
      });

      // Volume Sliders
      const sliderVoice = document.getElementById('slider-voice');
      if (sliderVoice) {
        sliderVoice.addEventListener('input', (e) => {
          state.voiceVolume = parseFloat(e.target.value);
          syncVolumes();
        });
      }

      const sliderMusic = document.getElementById('slider-music');
      if (sliderMusic) {
        sliderMusic.addEventListener('input', (e) => {
          state.musicVolume = parseFloat(e.target.value);
          syncVolumes();
        });
      }

      // 2D Modal Buttons
      const btnExit = document.getElementById('btn-modal-exit');
      const btnRepeat = document.getElementById('btn-modal-repeat');
      if (btnExit) {
        btnExit.addEventListener('click', () => {
          notifyFlutter('onExitRequested', {});
        });
      }
      if (btnRepeat) {
        btnRepeat.addEventListener('click', () => {
          hide2DCompletionPopup();
          hideVRCompletionPopup();
          state.isCompleted = false;
          seekExperience(0);
          playExperience();
        });
      }
    }

    function toggleMute() {
      state.isMuted = !state.isMuted;
      syncVolumes();
      const soundOn = document.getElementById('icon-sound-on');
      const soundOff = document.getElementById('icon-sound-off');
      if (soundOn && soundOff) {
        soundOn.style.display = state.isMuted ? 'none' : 'inline';
        soundOff.style.display = state.isMuted ? 'inline' : 'none';
      }
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    function onWindowResize() {
      if (!camera || !renderer) return;
      const width = window.innerWidth;
      const height = window.innerHeight;

      camera.aspect = width / height;
      camera.focus = 2.8;
      camera.near = 0.2;
      camera.far = 2000.0;
      camera.updateProjectionMatrix();

      if (stereoCamera) {
        stereoCamera.aspect = 0.5;
        stereoCamera.eyeSep = 0.064;
      }

      const maxDpr = state.isVRMode ? 1.25 : 1.3;
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1.0, maxDpr));
      renderer.setSize(width, height);
    }

    /* ======================================================================
       MAIN ANIMATION & RENDER LOOP (Solid 60/120 FPS)
       ====================================================================== */
    function animate(timestamp) {
      if (state.isDisposed) return;
      animationFrameId = requestAnimationFrame(animate);

      if (!state.lastTimestamp) state.lastTimestamp = timestamp;
      const deltaMs = Math.min(timestamp - state.lastTimestamp, 64);
      const deltaSec = Math.max(0.001, Math.min(deltaMs * 0.001, 0.06));
      state.lastTimestamp = timestamp;
      state.lastDeltaSec = deltaSec;
      ambientWaterTime += deltaSec;

      // Ultra-smooth 60/120 FPS continuous time advancement (Decoupled from 4Hz HTML5 audio polling)
      if (state.isPlaying) {
        state.currentTime += deltaSec;

        const voiceDur = (audioVoice && isFinite(audioVoice.duration) && audioVoice.duration > 0)
          ? audioVoice.duration
          : VOICE_DURATION_SEC;

        // Soft Audio Sync: Only adjust when macro-drift exceeds tolerance (avoids 4Hz/250ms audio step stutter)
        if (performance.now() - lastSeekTime > 600 && !isAudioSeeking) {
          if (audioVoice && !audioVoice.paused && !audioVoice.ended && state.currentTime <= voiceDur) {
            const vTime = audioVoice.currentTime;
            const drift = vTime - state.currentTime;
            if (Math.abs(drift) > 0.5) {
              // Soft correction towards audio time if noticeable drift
              state.currentTime += drift * 0.15;
            }
          } else if (audioMusic && !audioMusic.paused && !audioMusic.ended) {
            const mTime = audioMusic.currentTime;
            const drift = mTime - state.currentTime;
            if (Math.abs(drift) > 1.2) {
              state.currentTime = mTime;
            }
          }
        }

        // Active voice track sync
        if (audioVoice && !audioMusic.paused) {
          if (state.currentTime <= voiceDur) {
            if (audioVoice.paused && !audioVoice.ended) {
              audioVoice.play().catch(() => {});
            }
            const vDrift = audioVoice.currentTime - state.currentTime;
            if (Math.abs(vDrift) > 0.45) {
              try { audioVoice.currentTime = state.currentTime; } catch(e) {}
            }
          } else if (!audioVoice.paused) {
            audioVoice.pause();
          }
        }

        if (state.currentTime >= TOTAL_DURATION_SEC) {
          state.currentTime = TOTAL_DURATION_SEC;
          if (!state.isCompleted) {
            state.isCompleted = true;
            pauseExperience();
            notifyFlutter('onSessionComplete', { duration: TOTAL_DURATION_SEC });
            if (state.isVRMode) {
              showVRCompletionPopup();
            } else {
              show2DCompletionPopup();
            }
          }
        }
      }

      updateExperienceTimeline(state.currentTime, deltaSec);
      updateCameraRotation();
      updateGazeInteraction(deltaSec);

      // 3D Floating Subtitle VR Smooth Dissolve & Fading
      if (billboardMesh) {
        if (state.isVRMode) {
          if (pending3DText !== displayed3DText) {
            // Dissolve out previous text
            billboardMesh.material.opacity = Math.max(0.0, billboardMesh.material.opacity - deltaSec * 4.5);
            if (billboardMesh.material.opacity <= 0.02) {
              displayed3DText = pending3DText;
              update3DSubtitle(displayed3DText);
            }
          } else {
            // Dissolve in current text
            const targetOp = displayed3DText ? 1.0 : 0.0;
            const diff = targetOp - billboardMesh.material.opacity;
            billboardMesh.material.opacity += diff * Math.min(1.0, deltaSec * 4.5);
          }
          billboardMesh.visible = billboardMesh.material.opacity > 0.005;
        } else {
          billboardMesh.visible = false;
        }
      }

      // Stereo Cardboard VR or Monoscopic Rendering
      const width = window.innerWidth;
      const height = window.innerHeight;

      if (state.isVRMode) {
        // Ensure camera rig hierarchy and camera world matrices are fully synchronized
        cameraRig.updateMatrixWorld(true);
        camera.updateMatrixWorld(true);
        stereoCamera.update(camera);

        const halfW = Math.floor(width / 2);
        const rightW = width - halfW;

        renderer.setScissorTest(true);

        // Pre-clear full frame to prevent inter-eye ghosting or previous frame residue
        renderer.setViewport(0, 0, width, height);
        renderer.setScissor(0, 0, width, height);
        renderer.clear();

        // Left Eye Viewport
        renderer.setScissor(0, 0, halfW, height);
        renderer.setViewport(0, 0, halfW, height);
        renderer.render(scene, stereoCamera.cameraL);

        // Right Eye Viewport
        renderer.setScissor(halfW, 0, rightW, height);
        renderer.setViewport(halfW, 0, rightW, height);
        renderer.render(scene, stereoCamera.cameraR);

        renderer.setScissorTest(false);
      } else {
        renderer.setScissorTest(false);
        renderer.setViewport(0, 0, width, height);
        renderer.render(scene, camera);
      }
    }

    /* ======================================================================
       FLUTTER NATIVE BRIDGE & GUIDO VR API
       ====================================================================== */
    function notifyFlutter(eventName, data) {
      try {
        if (window.flutter_inappwebview && typeof window.flutter_inappwebview.callHandler === 'function') {
          window.flutter_inappwebview.callHandler(eventName, data);
        }
        if (window.GuidoFlutterBridge && typeof window.GuidoFlutterBridge.postMessage === 'function') {
          window.GuidoFlutterBridge.postMessage(JSON.stringify({ event: eventName, data: data }));
        } else if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'GUIDO_VR', event: eventName, data: data }, '*');
        }
      } catch (e) {
        console.warn('Flutter notify error:', e);
      }
    }

    window.GuidoVR = {
      start: function() { playExperience(); },
      startSession: function() { playExperience(); },
      pause: function() { pauseExperience(); },
      pauseSession: function() { pauseExperience(); },
      toggle: function() { togglePlay(); },
      reset: function() { 
        state.isCompleted = false;
        hide2DCompletionPopup();
        hideVRCompletionPopup();
        seekExperience(0);
        pauseExperience();
      },
      seek: function(sec) { seekExperience(sec); },
      recenter: function() { recenterView(); },
      setVRMode: function(enable) { setVRMode(enable); },
      enableVR: function() { setVRMode(true); },
      disableVR: function() { setVRMode(false); },
      toggleVR: function() { toggleVR(); },
      setMuted: function(mute) {
        state.isMuted = !!mute;
        syncVolumes();
      },
      setDeviceOrientation: function(alpha, beta, gamma) {
        if (!state.isVRMode) return;
        deviceOrientationEnabled = true;
        orientationAlpha = Number(alpha) || 0;
        orientationBeta = Number(beta) || 0;
        orientationGamma = Number(gamma) || 0;
        updateCameraRotation();
      },
      showCompletionPopup: function() {
        if (state.isVRMode) showVRCompletionPopup();
        else show2DCompletionPopup();
      },
      hideCompletionPopup: function() {
        hideVRCompletionPopup();
        hide2DCompletionPopup();
      },
      getState: function() { return { ...state }; },
      setLookAngle: function(p, y) {
        deviceOrientationEnabled = false;
        pitch = targetPitch = Number(p) || 0;
        yaw = targetYaw = Number(y) || 0;
        if (camera) camera.rotation.set(pitch, yaw, 0, 'YXZ');
      },
      setCameraLook: function(p, y) {
        deviceOrientationEnabled = false;
        pitch = targetPitch = Number(p) || 0;
        yaw = targetYaw = Number(y) || 0;
        if (camera) camera.rotation.set(pitch, yaw, 0, 'YXZ');
      },
      get camera() { return camera; },
      get scene() { return scene; },
      get cameraRig() { return cameraRig; },
      get stereoCamera() { return stereoCamera; },
      get renderer() { return renderer; },
      dispose: function() { disposeExperience(); }
    };

    // Global Window Aliases for WebXR bridges & automated testing
    window.enterVR = function() { setVRMode(true); };
    window.exitVR = function() { setVRMode(false); };
    window.recenterVR = function() { recenterView(); };

    /* --- Web Wake Lock API (Keep Screen Awake) --- */
    let wakeLockSentinel = null;
    async function requestScreenWakeLock() {
      try {
        if ('wakeLock' in navigator && navigator.wakeLock && typeof navigator.wakeLock.request === 'function') {
          wakeLockSentinel = await navigator.wakeLock.request('screen');
        }
      } catch (e) {}
    }
    function releaseScreenWakeLock() {
      if (wakeLockSentinel) {
        try { wakeLockSentinel.release(); } catch (e) {}
        wakeLockSentinel = null;
      }
    }
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && !state.isDisposed) {
        requestScreenWakeLock();
      }
    });

    /* --- iOS Audio & Orientation Unlock On First User Gesture --- */
    function unlockAudioOnGesture() {
      unlockAudio();
      requestDeviceOrientationPermission();
      requestScreenWakeLock();
      window.removeEventListener('touchstart', unlockAudioOnGesture);
      window.removeEventListener('touchend', unlockAudioOnGesture);
      window.removeEventListener('pointerdown', unlockAudioOnGesture);
      window.removeEventListener('click', unlockAudioOnGesture);
    }
    window.addEventListener('touchstart', unlockAudioOnGesture, { passive: true });
    window.addEventListener('pointerdown', unlockAudioOnGesture, { passive: true });
    window.addEventListener('click', unlockAudioOnGesture, { passive: true });

    /* ======================================================================
       RESOURCE TEARDOWN & LIFECYCLE MANAGEMENT (Zero WebGL Leaks)
       ====================================================================== */
    function disposeExperience() {
      if (state.isDisposed) return;
      state.isDisposed = true;
      releaseScreenWakeLock();

      if (animationFrameId) {
        cancelAnimationFrame(animationFrameId);
        animationFrameId = null;
      }

      window.removeEventListener('resize', onWindowResize);

      try {
        if (audioVoice) { audioVoice.pause(); audioVoice.src = ''; }
        if (audioMusic) { audioMusic.pause(); audioMusic.src = ''; }
        if (audioCtx && typeof audioCtx.close === 'function') {
          audioCtx.close();
        }
      } catch (e) {}

      if (renderer) {
        renderer.dispose();
        if (renderer.domElement && renderer.domElement.parentNode) {
          renderer.domElement.parentNode.removeChild(renderer.domElement);
        }
      }
    }

    // Launch Engine & Automatic Start
    window.addEventListener('DOMContentLoaded', () => {
      initEngine();
      syncVolumes();
      requestScreenWakeLock();
      animate(0);

      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('vr') === 'true' || urlParams.get('vr') === '1') {
        setVRMode(true);
      }
      if (urlParams.has('seek')) {
        const targetSec = parseFloat(urlParams.get('seek'));
        seekExperience(targetSec);
      } else {
        playExperience();
      }
      window.focus();
      if (document.body) document.body.focus();

      notifyFlutter('onVRReady', { status: 'ready', experience: 'meditazione_pomeriggio_acqua', duration: TOTAL_DURATION_SEC });
    });
  </script>
