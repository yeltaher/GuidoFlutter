<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Guido VR - Meditazione Generale (Elemento Acqua • 432 Hz)</title>
  
  <style>
    :root {
      --bg-dark: #01030a;
      --water-cyan: #38bdf8;
      --emerald-core: #10b981;
      --emerald-glow: #34d399;
      --sacred-violet: #8b5cf6;
      --gold-solar: #fbbf24;
      --moon-silver: #e2e8f0;
      --text-bright: #ffffff;
      --text-dim: rgba(248, 250, 252, 0.72);
      --glass-panel: rgba(7, 16, 32, 0.78);
      --glass-border: rgba(16, 185, 129, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-dark);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: var(--text-bright);
    }

    #webgl-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      touch-action: none;
    }

    /* VR Cardboard Stereo Overlay */
    #vr-overlay {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 50;
      pointer-events: none;
    }

    #vr-overlay.active,
    body.vr-active #vr-overlay {
      display: block;
    }

    #vr-divider,
    .vr-divider {
      position: absolute;
      top: 0;
      left: 50%;
      width: 1px;
      height: 100%;
      background: rgba(255, 255, 255, 0.25);
      transform: translateX(-50%);
      box-shadow: none !important;
      pointer-events: none;
      z-index: 999;
    }

    /* Clean Floating HUD UI Layer (Clutter-free, zero debug text) */
    #ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 20;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    /* Hide debug elements in production */
    .header-bar,
    .bottom-dock,
    .desktop-dock,
    .hud-title-badge,
    .hud-title,
    .hud-scene-name,
    .hud-vr-btn,
    .hud-audio-indicator,
    .hud-progress-container,
    .debug-overlay,
    .stats-panel {
      display: none !important;
    }

    /* Essential Minimal Top Controls (Hidden: controlled by Flutter native HUD) */
    #minimal-controls {
      position: absolute;
      top: 14px;
      left: 16px;
      right: 16px;
      display: none !important;
      opacity: 0 !important;
      pointer-events: none !important;
      visibility: hidden !important;
      justify-content: space-between;
      align-items: center;
      z-index: 30;
      transition: opacity 0.3s ease;
    }

    .min-btn {
      background: rgba(4, 10, 22, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.20);
      color: #ffffff;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: background 0.2s, transform 0.15s, border-color 0.2s;
    }

    .min-btn:hover {
      background: rgba(16, 185, 129, 0.35);
      border-color: var(--emerald-glow);
    }

    .min-btn:active {
      transform: scale(0.92);
    }

    .min-btn svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    /* 2D Monoscopic Subtitles - Bound to Michela IT Voice */
    /* Positioned safely above bottom (bottom: 42%) with soft glow and subtle black drop shadow, NO dark box */
    #hud-subtitles {
      position: absolute;
      bottom: 42%;
      left: 50%;
      transform: translateX(-50%);
      width: 86%;
      max-width: 780px;
      text-align: center;
      pointer-events: none;
      z-index: 25;
      opacity: 0;
      transition: opacity 0.4s ease-out;
    }

    #hud-subtitles.visible {
      opacity: 1;
    }

    #hud-subtitles-text {
      font-size: 20px;
      line-height: 1.45;
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 0 10px rgba(16, 185, 129, 0.60), 0 2px 4px rgba(0, 0, 0, 0.95);
      letter-spacing: 0.3px;
    }

    @media (min-width: 768px) {
      #hud-subtitles-text {
        font-size: 24px;
      }
    }

    /* White Luminous Bloom Overlay for Scene 16 Conclusion */
    #bloom-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      opacity: 0;
      pointer-events: none;
      z-index: 45;
      transition: opacity 1.8s ease-in-out;
    }

    /* Monoscopic 2D Completion Modal Fallback */
    #completion-modal-2d {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(1, 4, 12, 0.85);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      z-index: 60;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease;
    }

    #completion-modal-2d.active {
      display: flex;
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: rgba(7, 18, 36, 0.90);
      border: 1px solid rgba(16, 185, 129, 0.45);
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.8), 0 0 32px rgba(16, 185, 129, 0.25);
      border-radius: 20px;
      padding: 32px 36px;
      max-width: 420px;
      width: 90%;
      text-align: center;
    }

    .modal-card h2 {
      font-size: 26px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }

    .modal-card p.subtitle {
      font-size: 15px;
      color: var(--emerald-glow);
      margin-bottom: 24px;
    }

    .stats-row {
      display: flex;
      justify-content: space-around;
      margin-bottom: 28px;
      padding: 14px 0;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .stat-item {
      display: flex;
      flex-direction: column;
    }

    .stat-val {
      font-size: 20px;
      font-weight: 700;
      color: #ffffff;
    }

    .stat-lbl {
      font-size: 12px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-top: 2px;
    }

    .modal-actions {
      display: flex;
      gap: 14px;
    }

    .modal-btn {
      flex: 1;
      padding: 14px 18px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: background 0.2s, transform 0.15s;
    }

    .modal-btn-restart {
      background: rgba(255, 255, 255, 0.10);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.20);
    }

    .modal-btn-restart:hover {
      background: rgba(255, 255, 255, 0.18);
    }

    .modal-btn-exit {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #ffffff;
      box-shadow: 0 4px 16px rgba(16, 185, 129, 0.40);
    }

    .modal-btn-exit:hover {
      background: linear-gradient(135deg, #34d399, #10b981);
    }

    /* Start / Touch-To-Unlock Overlay bypassed in mobile app */
    #start-overlay,
    #start-overlay.hidden {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(1, 4, 10, 0.92);
      z-index: 100;
      display: none !important;
      opacity: 0 !important;
      pointer-events: none !important;
      visibility: hidden !important;
    }

    .start-circle {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: linear-gradient(135deg, #10b981, #0284c7);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 36px rgba(16, 185, 129, 0.55);

      margin-bottom: 24px;
    }

    .start-circle svg {
      width: 36px;
      height: 36px;
      fill: #ffffff;
      margin-left: 4px;
    }

    .start-title {
      font-size: 24px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 8px;
      letter-spacing: 0.6px;
    }

    .start-subtitle {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.70);
      letter-spacing: 0.4px;
    }

    @keyframes pulseStart {
      0%, 100% { transform: scale(1); box-shadow: 0 0 28px rgba(16, 185, 129, 0.45); }
      50% { transform: scale(1.08); box-shadow: 0 0 46px rgba(16, 185, 129, 0.75); }
    }
  </style>

  <script>
  (function() {
    'use strict';

    /* ======================================================================

    const SCRIPT_CUES = [

      { start: 84.00, end: 94.00, text: "rinnovando l’energia del tuo corpo, delle tue cellule e dei tuoi pensieri." },
      { start: 95.00, end: 113.00, text: "Accogli questo momento di rigenerazione, abbandona l’ansia e ogni preoccupazione per il futuro." },
      { start: 114.00, end: 126.00, text: "Lascia andare la fretta e la paura di essere in ritardo per realizzare i tuoi sogni e te stesso." },
      { start: 126.00, end: 138.00, text: "Queste piccole sfere ora portano l’energia delle tue paure e delle tossine accumulate fino ad ora dentro la luce," },
      { start: 138.00, end: 165.00, text: "trasmutandole in nuova vibrazione sana e risolutrice, rinnovando l’energia del tuo presente e del tuo futuro con nuove opportunità." },
      { start: 166.00, end: 183.00, text: "Ecco arrivare Njord, il grande drago dell’acqua, un potentissimo totem collegato alla passione, alle emozioni e alla profondità." },
      { start: 184.00, end: 198.00, text: "Esso aiuta a portare alla luce ciò che è nascosto: memorie e desideri che possono anche essere stati dimenticati e repressi nell’Inconscio." },
      { start: 199.00, end: 211.00, text: "Questo animale di potere aiuta ad affrontarli con amore e coraggio, donandoci un grande senso di collegamento con la vita." },
      { start: 212.00, end: 247.00, text: "Guardandoti indietro, nel tuo passato, puoi osservare le energie del caos emotivo creato dagli eventi che hai vissuto e osservare come l’energia del drago ripulisce ora tutto, portando ordine e armonia ovunque attorno a te." },
      { start: 247.00, end: 268.00, text: "Osserva come la strada inerente al tuo passato, ora rinnovata, si collega al tuo futuro." },
      { start: 269.00, end: 290.00, text: "Solo tu hai in mano il potere di gestirlo e hai tutti gli strumenti per farlo, trasmutando in energia creatrice le dinamiche del passato che in qualche modo oscuravano anche il tuo presente." },
      { start: 291.00, end: 302.00, text: "Ora l’energia collegata al diritto che hai di gestire il tuo tempo è tornata a te." },
      { start: 303.00, end: 321.00, text: "Questo strumento simbolico ha il potere di creare nuove energie e pensieri sani nel tuo futuro, affinché possano diventare punti fermi nella tua vita," },
      { start: 322.00, end: 336.00, text: "dei fari di luce che saranno il tuo sostegno mentre ti apri alla vita e alla fiducia in te stesso." },
      { start: 337.00, end: 352.00, text: "Permettiti di accogliere nel profondo una sensazione di protezione e fiducia nell’esistenza che si possa manifestare anche nella tua realtà quotidiana." },
      { start: 353.00, end: 372.00, text: "Da questo momento, se lo vorrai, potrai riappropriarti della consapevolezza di saper come gestire il tuo tempo, perché è un dono prezioso ed è tuo di diritto." },
      { start: 372.00, end: 400.00, text: "La proiezione delle paure collegate all’ansia, che in qualche modo avevi già distribuito nel futuro, ora vengono recuperate e trasformate in sana energia." },
      { start: 403.00, end: 424.00, text: "Questa sfera rappresenta la capacità che hai di gestire il tuo tempo e di trasmutare ogni paura per il futuro, ogni senso d’impotenza, in fiducia nella vita risvegliando il tuo potenziale:" },
      { start: 424.00, end: 439.00, text: "solo tu sei il creatore della tua realtà, rispettando i tuoi tempi per il tuo massimo bene." },
      { start: 439.00, end: 456.00, text: "Lascia che questo mantello di luce ti avvolga e ti protegga, rimanendo sempre attivo nella tua vita, in ogni tuo passo e in ogni tuo respiro." }

    /* ======================================================================
       APPLICATION STATE
       ====================================================================== */
    const state = {
      isPlaying: false,
      isCompleted: false,
      isVRMode: false,
      currentTime: 0.0,
      voiceVolume: 1.0,
      musicVolume: 0.65,
      isDesktop: false,
      lastTimestamp: 0,
      lastDeltaSec: 0.016
    };

    // DOM Elements
    const container = document.getElementById('webgl-container');
    const vrOverlay = document.getElementById('vr-overlay');
    const bloomOverlay = document.getElementById('bloom-overlay');
    const hudSubtitles = document.getElementById('hud-subtitles');
    const hudSubtitlesText = document.getElementById('hud-subtitles-text');
    const completionModal2D = document.getElementById('completion-modal-2d');
    const startOverlay = document.getElementById('start-overlay');
    const btnPauseToggle = document.getElementById('btn-pause-toggle');
    const iconPause = document.getElementById('icon-pause');
    const iconPlay = document.getElementById('icon-play');
    const btnExit = document.getElementById('btn-exit');
    const modalBtnRestart = document.getElementById('modal-btn-restart');
    const modalBtnExit = document.getElementById('modal-btn-exit');

    // Audio Elements
    const audioVoice = document.getElementById('audio-voice');
    const audioMusicA = document.getElementById('audio-music-a');
    const audioMusicB = document.getElementById('audio-music-b');

    let audioContext = null;
    let voiceGainNode = null;
    let musicGainNodeA = null;
    let musicGainNodeB = null;

    /* ======================================================================
       THREE.JS CORE RIG & RENDERER SETUP
       ====================================================================== */
    let scene, renderer;
    let cameraRig, camera, stereoCamera;
    let textureLoader;
    let particleGlowTex = null;

    // Lighting
    let ambientLight, moonLight, emeraldPointLight;

    // Scene Geometries & Systems
    let skySphere, starField;
    let terrainAmphitheater, terrainPromontoryWest, terrainPromontoryEast, terrainForegroundShore, terrainBoulders;
    let waterMesh, waterMaterial;

    // VFX 1: Emerald Light Column & Sparkles (0s - 165s)
    let emeraldColumnGroup, innerColumnMesh, outerColumnMesh, columnGlowLight;
    let sparkleParticles, sparkleGeo, sparkleMat;

    // VFX 2: Njord Dragon & 7 Chakra Trail (166s - 247s)
    let njordGroup, realDragonRoot, dragonModel, dragonMixer, dragonBones = {};
    let chakraRibbonMesh, chakraCurtainMesh, chakraMotes;
    let pastCloudsGroup;

    // VFX 3: White Road of Light & Floating Golden Pocket Watch (247s - 336s)
    let whiteRoadMesh, roadBeaconsGroup = [], bridgeGroup, bridgeMaterials = [], bridgeVeinMat, lanternOpalMat;
    let goldWatchGroup, watchHands = { hour: null, minute: null, second: null };

    // VFX 4: Shifting Light Tunnel, Travel & Future Fears (337s - 402s)
    let lightTunnelGroup, lightTunnelMesh;
    let futureFearSpheresGroup;

    // VFX 5: Emerald-Violet Transmutation Sphere & Protective Mantle (403s - 456.78s)
    let energySphereMesh, protectiveMantleMesh, mantleStardust;

    // 3D VR Subtitle Billboard & Gaze Reticle
    let billboardMesh, billboardCanvas, billboardContext, billboardTexture;
    let vrReticleMesh, vrReticleProgressMesh;
    let vrCompletionPopupGroup;
    let gazeInteractables = [];
    let currentGazeTarget = null;
    let gazeDwellTimer = 0.0;
    const GAZE_DWELL_THRESHOLD = 1.50; // 1.5 seconds dwell to trigger

    // Pre-allocated vectors & quaternions for zero-GC 60/120 FPS loop
    const _vZero = new THREE.Vector3(0, 0, 0);
    const _vCamWorld = new THREE.Vector3();
    const _vTemp1 = new THREE.Vector3();
    const _vTemp2 = new THREE.Vector3();
    const _vTemp3 = new THREE.Vector3();
    const _qTemp = new THREE.Quaternion();
    const _raycaster = new THREE.Raycaster();
    const _reticleDir = new THREE.Vector3(0, 0, -1);
    const _upVec = new THREE.Vector3(0, 1, 0);
    const _forwardZ = new THREE.Vector3(0, 0, 1);
    const _nextTan = new THREE.Vector3();
    const _tempNormal = new THREE.Vector3();
    const _curvature = new THREE.Vector3();
    const _targetQuat = new THREE.Quaternion();
    const _bankQuat = new THREE.Quaternion();
    const _vTempWatchPos = new THREE.Vector3();
    const _vTempSpherePos = new THREE.Vector3();
    const _trailPt = new THREE.Vector3();
    const _trailTan = new THREE.Vector3();
    const _trailNorm = new THREE.Vector3();

    // Initial Camera Rig Position: dry ground at shore X=0.0, Y=1.8, Z=12.0 (water level Y=0.0)
    const CAMERA_INIT_X = 0.0;
    const CAMERA_INIT_Y = 1.8;
    const CAMERA_INIT_Z = 12.0;

    /* ======================================================================
       INITIALIZATION ROUTINE
       ====================================================================== */
    function initThreeScene() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x010206);
      scene.fog = new THREE.FogExp2(0x020713, 0.0018);

      // Camera Rig & Perspective Camera
      cameraRig = new THREE.Group();
      cameraRig.position.set(CAMERA_INIT_X, CAMERA_INIT_Y, CAMERA_INIT_Z);
      scene.add(cameraRig);

      const aspect = window.innerWidth / window.innerHeight;
      camera = new THREE.PerspectiveCamera(55.0, aspect, 0.20, 2000.0);
      camera.focus = 2.8;
      camera.position.set(0, 0, 0);
      cameraRig.add(camera);

      // Stereo Camera for VR Cardboard Mode (0.064m IPD)
      stereoCamera = new THREE.StereoCamera();
      stereoCamera.aspect = 0.5;
      stereoCamera.eyeSep = 0.064;

      // WebGL Renderer with High-Performance Settings & DPR Clamp
      renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: false,
        powerPreference: 'high-performance',
        preserveDrawingBuffer: true
      });
      const dpr = Math.min(window.devicePixelRatio || 1, state.isVRMode ? 1.25 : 1.30);
      renderer.setPixelRatio(dpr);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.outputEncoding = THREE.sRGBEncoding;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.10;
      container.appendChild(renderer.domElement);

      textureLoader = new THREE.TextureLoader();
      const globalTexData = window.GENERAL_WATER_TEXTURES || {};
      if (globalTexData.particleGlow) {
        particleGlowTex = textureLoader.load(globalTexData.particleGlow);
      }

      // Build 3D World Components
      buildLighting();
      buildAtmosphericNightSky();
      buildAlpineTerrain();
      buildSacredGerstnerLake();

      // Build Storyboard VFX Systems
      buildVFX1EmeraldColumn();
      buildVFX2NjordAndChakra();
      buildVFX3WhiteRoadAndGoldWatch();
      buildVFX4LightTunnelAndFutureFears();
      buildVFX5EnergySphereAndMantle();

      // 3D VR Subtitle Billboard, Reticle & 3D Completion Popup
      build3DSubtitleBillboard();
      initVRReticle();
      buildVRCompletionPopup();

      initControls();
      window.addEventListener('resize', onWindowResize, false);
    }

    /* --- 1. LIGHTING SETUP (Night Profile PBR) --- */
    function buildLighting() {
      // Midnight twilight ambient light
      ambientLight = new THREE.AmbientLight(0x0c1b2c, 0.85);
      scene.add(ambientLight);

      // Silvery Arctic Moonlight
      moonLight = new THREE.DirectionalLight(0xcbd5e1, 0.65);
      moonLight.position.set(-60, 140, -180);
      scene.add(moonLight);

      // Radiant Emerald Healing Point Light (for Column & Energy Sphere)
      emeraldPointLight = new THREE.PointLight(0x10b981, 0.0, 80.0, 1.8);
      emeraldPointLight.position.set(0, 2.5, -35);
      scene.add(emeraldPointLight);
    }

    /* --- 2. ATMOSPHERIC NIGHT SKY & TWINKLING STARFIELD --- */
    function buildAtmosphericNightSky() {
      const domeGeo = new THREE.SphereGeometry(1500, 48, 36);
      const domeMat = new THREE.ShaderMaterial({
        side: THREE.BackSide,
        depthWrite: false,
        vertexShader: `
          varying vec3 vWorldPosition;
          void main() {
            vec4 wp = modelMatrix * vec4(position, 1.0);
            vWorldPosition = wp.xyz;
            gl_Position = projectionMatrix * viewMatrix * wp;
          }
        `,
        fragmentShader: `
          varying vec3 vWorldPosition;
          void main() {
            vec3 vDir = normalize(vWorldPosition);
            float h = clamp(vDir.y, 0.0, 1.0);
            vec3 zenith = vec3(0.004, 0.008, 0.022); // Deep cosmic black-indigo
            vec3 horizon = vec3(0.015, 0.038, 0.082); // Twilight cobalt rim
            vec3 sky = mix(horizon, zenith, pow(h, 0.45));
            gl_FragColor = vec4(sky, 1.0);
          }
        `
      });
      skySphere = new THREE.Mesh(domeGeo, domeMat);
      scene.add(skySphere);

      // Starfield with ~3500 twinkling stars
      const starCount = 3500;
      const starGeo = new THREE.BufferGeometry();
      const starPos = new Float32Array(starCount * 3);
      const starShimmer = new Float32Array(starCount);

      for (let i = 0; i < starCount; i++) {
        const u = Math.random();
        const v = Math.random();
        const theta = u * 2.0 * Math.PI;
        const phi = Math.acos(2.0 * v - 1.0);
        const r = 1380 + Math.random() * 80;
        starPos[i * 3 + 0] = r * Math.sin(phi) * Math.cos(theta);
        starPos[i * 3 + 1] = Math.abs(r * Math.cos(phi)) + 15;
        starPos[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
        starShimmer[i] = Math.random() * Math.PI * 2.0;
      }

      starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
      starGeo.setAttribute('aShimmer', new THREE.BufferAttribute(starShimmer, 1));

      const texData = window.GENERAL_WATER_TEXTURES || {};
      const starTex = texData.particleGlow ? textureLoader.load(texData.particleGlow) : null;

      const starMat = new THREE.ShaderMaterial({
        uniforms: {
          uTime: { value: 0.0 },
          uTexture: { value: starTex }
        },
        vertexShader: `
          uniform float uTime;
          attribute float aShimmer;
          varying float vAlpha;
          void main() {
            float blink = 0.55 + 0.45 * sin(uTime * 2.2 + aShimmer);
            vAlpha = blink;
            vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
            gl_PointSize = (2.2 + blink * 1.8) * (280.0 / -mvPosition.z);
            gl_Position = projectionMatrix * mvPosition;
          }
        `,
        fragmentShader: `
          uniform sampler2D uTexture;
          varying float vAlpha;
          void main() {
            vec4 col = texture2D(uTexture, gl_PointCoord);
            gl_FragColor = vec4(vec3(0.92, 0.96, 1.0), col.a * vAlpha * 0.85);
          }
        `,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      starField = new THREE.Points(starGeo, starMat);
      scene.add(starField);
    }

    /* --- 3. HIGH-POLY ALPINE AMPHITHEATER & BASALT/SNOW TERRAIN --- */
    function buildAlpineTerrain() {
      // Noise utility functions for terrain procedural synthesis
      function smoothNoise(x, z) {
        const xi = Math.floor(x);
        const zi = Math.floor(z);
        const xf = x - xi;
        const zf = z - zi;
        const u = xf * xf * (3 - 2 * xf);
        const v = zf * zf * (3 - 2 * zf);
        function h(i, j) {
          const s = Math.sin(i * 12.9898 + j * 78.233) * 43758.5453;
          return s - Math.floor(s);
        }
        return (1 - u) * ((1 - v) * h(xi, zi) + v * h(xi, zi + 1)) +
               u * ((1 - v) * h(xi + 1, zi) + v * h(xi + 1, zi + 1));
      }

      function terrainFbm(x, z, octaves) {
        let val = 0.0;
        let amp = 0.5;
        for (let i = 0; i < octaves; i++) {
          val += amp * smoothNoise(x, z);
          x *= 2.05;
          z *= 2.05;
          amp *= 0.5;
        }
        return val;
      }

      const terrainMaterial = new THREE.ShaderMaterial({
        uniforms: {
          uMoonPos: { value: new THREE.Vector3(-60, 140, -180) },
          uMoonColor: { value: new THREE.Color(0xcbd5e1) },
          uEmeraldGlow: { value: 0.0 }
        },
        vertexShader: `
          varying vec3 vWorldPosition;
          varying vec3 vNormal;
          varying float vElevation;
          void main() {
            vec4 wp = modelMatrix * vec4(position, 1.0);
            vWorldPosition = wp.xyz;
            vNormal = normalize(mat3(modelMatrix) * normal);
            vElevation = wp.y;
            gl_Position = projectionMatrix * viewMatrix * wp;
          }
        `,
        fragmentShader: `
          varying vec3 vWorldPosition;
          varying vec3 vNormal;
          varying float vElevation;
          uniform vec3 uMoonPos;
          uniform vec3 uMoonColor;
          uniform float uEmeraldGlow;

          float hash(vec2 p) {
            return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
          }

          float smoothNoise(vec2 p) {
            vec2 i = floor(p);
            vec2 f = fract(p);
            vec2 u = f * f * (3.0 - 2.0 * f);
            float a = hash(i);
            float b = hash(i + vec2(1.0, 0.0));
            float c = hash(i + vec2(0.0, 1.0));
            float d = hash(i + vec2(1.0, 1.0));
            return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
          }

          float fbmSmooth(vec2 p) {
            mat2 rot = mat2(0.80, 0.60, -0.60, 0.80);
            float v = 0.0;
            float a = 0.5;
            for (int i = 0; i < 3; i++) {
              v += a * smoothNoise(p);
              p = rot * p * 2.05;
              a *= 0.5;
            }
            return v;
          }

          void main() {
            vec3 baseN = normalize(vNormal);

            // Natural Basalt Rock Micro-Texture (Continuous, non-grid-aligned)
            vec2 rockUv = vWorldPosition.xz * 0.35;
            float nFissure = fbmSmooth(rockUv * 2.5) * 0.16;

            // Subtle continuous normal perturbation for organic basalt roughness
            float eps = 0.08;
            float nCenter = smoothNoise(rockUv * 3.0);
            float nDx = smoothNoise(rockUv * 3.0 + vec2(eps, 0.0)) - nCenter;
            float nDz = smoothNoise(rockUv * 3.0 + vec2(0.0, eps)) - nCenter;
            vec3 bumpN = normalize(baseN + vec3(nDx * 0.75, 0.0, nDz * 0.75));

            float slope = baseN.y;
            float nLedge = fbmSmooth(vWorldPosition.xz * 0.06) * 0.22;
            float isHighMountain = smoothstep(3.5, 12.0, vElevation);
            float mountainSnow = smoothstep(0.42, 0.62, slope + nLedge);
            float boulderSnow = smoothstep(0.60, 0.80, baseN.y + nLedge * 0.25);
            float snowMask = mix(boulderSnow, mountainSnow, isHighMountain);

            // Waterline clearing: no snow under water / right at wet shore (vElevation < 0.25)
            float shoreClear = smoothstep(0.15, 0.55, vElevation);
            snowMask *= shoreClear;
            snowMask = clamp(snowMask, 0.0, 1.0);

            vec3 N = normalize(mix(bumpN, baseN, snowMask * 0.80));
            vec3 L_moon = normalize(uMoonPos - vWorldPosition);
            vec3 V = normalize(cameraPosition - vWorldPosition);
            vec3 H_moon = normalize(L_moon + V);

            // Albedo: Basalt rock with wet shoreline darkening vs crisp snow
            float wetness = clamp(1.0 - smoothstep(0.0, 1.4, vElevation), 0.0, 1.0) * (1.0 - snowMask);
            vec3 snowAlbedo = vec3(0.92, 0.96, 1.0);
            float strata = sin(vElevation * 0.55 + fbmSmooth(vWorldPosition.xz * 0.08) * 3.5) * 0.045;
            vec3 dryBasalt = vec3(0.28, 0.32, 0.37) + strata + nFissure * 0.12;
            vec3 wetBasalt = dryBasalt * 0.68; // Rich dark saturated wet granite/basalt, never pitch black
            vec3 rockAlbedo = mix(dryBasalt, wetBasalt, wetness);
            vec3 albedo = mix(rockAlbedo, snowAlbedo, snowMask);

            // Direct Moonlight Illumination
            float NdotL_moon = max(0.0, dot(N, L_moon));
            vec3 moonLit = uMoonColor * (NdotL_moon * 0.75 + 0.25) * 0.85;
            moonLit += vec3(0.88, 0.95, 1.0) * pow(max(0.0, dot(N, H_moon)), 45.0) * snowMask * 0.65;

            // Ambient sky fill & lake upward bounce (illuminating shadowed rock faces)
            vec3 ambient = vec3(0.08, 0.13, 0.22) * mix(0.85, 1.35, snowMask) * (0.45 + 0.55 * N.y);
            vec3 lakeBounce = vec3(0.06, 0.12, 0.20) * max(0.0, -N.y * 0.4 + 0.6);

            // Emerald column diffuse reflection on mountain walls
            vec3 emeraldRefl = vec3(0.06, 0.72, 0.50) * uEmeraldGlow * max(0.0, dot(N, normalize(vec3(-vWorldPosition.x, 20.0, -35.0 - vWorldPosition.z)))) * 0.45;

            // Specular highlights: wet rock glistens near water, snow sparkles
            float specPow = mix(mix(16.0, 55.0, wetness), 110.0, snowMask);
            float specCoeff = mix(mix(0.06, 0.50, wetness), 0.80, snowMask);
            float spec = pow(max(0.0, dot(N, H_moon)), specPow) * specCoeff;

            vec3 litSurface = albedo * (moonLit + ambient + lakeBounce) + emeraldRefl + uMoonColor * spec;

            // Atmospheric Fog
            float dist = length(cameraPosition - vWorldPosition);
            float fogFactor = 1.0 - exp(-pow(dist * 0.0028, 1.45));
            vec3 fogCol = vec3(0.015, 0.035, 0.075);
            gl_FragColor = vec4(mix(litSurface, fogCol, fogFactor), 1.0);
          }
        `
      });

      // 1. Distant 360-degree Mountain Amphitheater
      const radialSegs = 240;
      const ringSegs = 60;
      const alpineGeo = new THREE.BufferGeometry();
      const alpinePos = [];
      const alpineIndices = [];

      for (let ri = 0; ri <= ringSegs; ri++) {
        const tRing = ri / ringSegs;
        const r = 140 + (420 - 140) * Math.pow(tRing, 1.30);

        for (let ai = 0; ai <= radialSegs; ai++) {
          const theta = (ai / radialSegs) * Math.PI * 2;
          const x = r * Math.sin(theta);
          const z = r * Math.cos(theta) - 40;

          const qx = x * 0.0035;
          const qz = z * 0.0035;
          const mountainFbm = terrainFbm(qx * 2.5, qz * 2.5, 4) * 85.0 +
                            terrainFbm(qx * 5.0, qz * 5.0, 3) * 24.0;
          
          let h = mountainFbm * Math.pow(tRing, 1.25);
          if (tRing < 0.06) {
            h = (h * (tRing / 0.06)) - 3.5 * (1.0 - tRing / 0.06);
          }
          alpinePos.push(x, h, z);
        }
      }

      for (let ri = 0; ri < ringSegs; ri++) {
        for (let ai = 0; ai < radialSegs; ai++) {
          const i0 = ri * (radialSegs + 1) + ai;
          const i1 = (ri + 1) * (radialSegs + 1) + ai;
          const i2 = (ri + 1) * (radialSegs + 1) + (ai + 1);
          const i3 = ri * (radialSegs + 1) + (ai + 1);
          alpineIndices.push(i0, i1, i3);
          alpineIndices.push(i1, i2, i3);
        }
      }

      alpineGeo.setAttribute('position', new THREE.Float32BufferAttribute(alpinePos, 3));
      alpineGeo.setIndex(alpineIndices);
      alpineGeo.computeVertexNormals();

      terrainAmphitheater = new THREE.Mesh(alpineGeo, terrainMaterial);
      scene.add(terrainAmphitheater);

      // 2. Dry Foreground Shoreline where Observer Stands (X=0, Y=1.8, Z=12.0)
      // Ground plane elevated to Y=1.8 (eyes) with base ground at Y=0.0..1.2
      const shoreGeo = new THREE.PlaneGeometry(120, 90, 80, 60);
      shoreGeo.rotateX(-Math.PI / 2);
      const sPos = shoreGeo.attributes.position.array;

      for (let i = 0; i < sPos.length; i += 3) {
        const lx = sPos[i];
        const lz = sPos[i + 2];
        const wx = lx;
        const wz = 24.0 + lz; // Observer is at Z=12.0

        let h = 0.0;
        if (wz >= 10.0) {
          // Elevated dry ground plateau (Y=0.35..0.50)
          h = 0.35 + terrainFbm(wx * 0.06, wz * 0.06, 3) * 0.20;
        } else if (wz >= 2.0) {
          // Gentle slope dipping into the lake
          const tSlope = (wz - 2.0) / 8.0;
          h = tSlope * 0.35;
        } else {
          // Submerged lakebed
          h = (wz - 2.0) * 0.35;
        }

        // Lateral fade towards deep sides
        const latFade = Math.max(0.0, 1.0 - Math.pow(Math.abs(lx) / 55.0, 3.0));
        sPos[i + 1] = h * latFade;
      }

      shoreGeo.attributes.position.needsUpdate = true;
      shoreGeo.computeVertexNormals();
      terrainForegroundShore = new THREE.Mesh(shoreGeo, terrainMaterial);
      terrainForegroundShore.position.set(0, 0, 24);
      scene.add(terrainForegroundShore);

      // 3. 100% Photorealistic Alpine Glacial Erratics (Fractured faceted boulders with flat grounded base)
      terrainBoulders = new THREE.Group();

      function createGlacialErraticGeometry(radius, detail, cfg) {
        const rawGeo = new THREE.IcosahedronGeometry(radius, detail);
        const rawPos = rawGeo.attributes.position.array;

        // Weld duplicate vertices to create an indexed geometry with shared topology
        const uniquePos = [];
        const indices = [];
        const vertexMap = new Map();
        const prec = 10000;

        for (let i = 0; i < rawPos.length; i += 3) {
          const vx = rawPos[i];
          const vy = rawPos[i + 1];
          const vz = rawPos[i + 2];
          const key = `${Math.round(vx * prec)}_${Math.round(vy * prec)}_${Math.round(vz * prec)}`;
          let idx = vertexMap.get(key);
          if (idx === undefined) {
            idx = uniquePos.length / 3;
            vertexMap.set(key, idx);
            uniquePos.push(vx, vy, vz);
          }
          indices.push(idx);
        }

        const seed = cfg.seed || 1.0;
        const sx = cfg.sx || 1.0;
        const sy = cfg.sy || 1.0;
        const sz = cfg.sz || 1.0;

        // Sculpt organic weathered glacial shape with sharp geological cleavage planes
        for (let i = 0; i < uniquePos.length; i += 3) {
          const vx = uniquePos[i];
          const vy = uniquePos[i + 1];
          const vz = uniquePos[i + 2];
          const len = Math.hypot(vx, vy, vz) || 1.0;
          const nx = vx / len;
          const ny = vy / len;
          const nz = vz / len;

          const n1 = smoothNoise(nx * 1.5 + seed * 2.1, nz * 1.5 + seed * 1.7) * 2.0 - 1.0;
          const n2 = smoothNoise(ny * 2.1 + seed * 1.3, nx * 2.1 + seed * 0.9) * 2.0 - 1.0;
          const n3 = (smoothNoise(nz * 3.6 + seed * 0.7, ny * 3.6 + seed * 1.4) * 2.0 - 1.0) * 0.35;

          // Natural cleavage planes (sharp fractured facets from mountain frost shattering)
          const cleavage1 = Math.max(0.0, (nx * 0.70 + ny * 0.40 + nz * 0.60) - 0.65) * 0.42;
          const cleavage2 = Math.max(0.0, (-nx * 0.65 + ny * 0.30 - nz * 0.70) - 0.65) * 0.38;
          const cleavage3 = Math.max(0.0, (nx * 0.30 - ny * 0.80 + nz * 0.50) - 0.70) * 0.35;

          const topShelf = ny > 0.15 ? (1.0 - (ny - 0.15) * 0.14) : 1.0;
          const r = Math.max(0.40, 1.0 + (n1 * 0.22 + n2 * 0.14 + n3 * 0.06) - cleavage1 - cleavage2 - cleavage3);

          let px = nx * r * sx;
          let py = ny * r * sy * topShelf;
          let pz = nz * r * sz;

          // Natural grounding: flatten base so boulder rests solidly in shore sand and water
          if (ny < -0.22) {
            const botT = (-ny - 0.22) / 0.78;
            py = py * (1.0 - botT * 0.35);
          }

          uniquePos[i] = px;
          uniquePos[i + 1] = py;
          uniquePos[i + 2] = pz;
        }

        const indexedGeo = new THREE.BufferGeometry();
        indexedGeo.setAttribute('position', new THREE.Float32BufferAttribute(uniquePos, 3));
        indexedGeo.setIndex(indices);
        // Non-indexed conversion guarantees distinct triangular facet normals: spigoli vivi, zero gummy panettone!
        const facetedGeo = indexedGeo.toNonIndexed();
        facetedGeo.computeVertexNormals();
        return facetedGeo;
      }

      const bConfigs = [
        // 1. Foreground Promontory framing the observer (Observer at X=0, Z=12, Y=1.8)
        { x: -5.6, y: 0.18, z: 9.2, sx: 2.5, sy: 1.5, sz: 2.2, ry: 0.85, seed: 12.4 },
        { x: -3.6, y: 0.12, z: 8.0, sx: 1.6, sy: 1.0, sz: 1.4, ry: 1.90, seed: 5.7 },
        { x: -4.6, y: 0.04, z: 6.8, sx: 1.0, sy: 0.45, sz: 0.9, ry: 2.40, seed: 8.1 },
        { x: -3.0, y: 0.02, z: 7.2, sx: 0.6, sy: 0.30, sz: 0.5, ry: 0.30, seed: 19.2 },

        { x:  6.2, y: 0.20, z: 9.6, sx: 2.7, sy: 1.6, sz: 2.3, ry: 2.15, seed: 14.8 },
        { x:  4.1, y: 0.12, z: 8.3, sx: 1.5, sy: 0.9, sz: 1.3, ry: 1.10, seed: 9.3 },
        { x:  5.2, y: 0.04, z: 7.1, sx: 1.1, sy: 0.42, sz: 0.9, ry: 2.80, seed: 11.5 },
        { x:  3.4, y: 0.02, z: 7.6, sx: 0.6, sy: 0.32, sz: 0.55, ry: 1.70, seed: 21.4 },

        // 2. Mid-shore waterline boulders & partially submerged sentinels
        { x: -10.5, y: 0.05, z: 4.8, sx: 3.4, sy: 2.0, sz: 2.8, ry: 1.40, seed: 3.2 },
        { x:  -7.6, y: 0.02, z: 3.5, sx: 2.0, sy: 1.2, sz: 1.8, ry: 2.60, seed: 7.9 },
        { x:  -5.8, y: -0.05, z: 2.2, sx: 1.4, sy: 0.6, sz: 1.2, ry: 0.50, seed: 16.3 },

        { x:  11.8, y: 0.05, z: 4.2, sx: 3.6, sy: 2.1, sz: 3.0, ry: 0.90, seed: 6.1 },
        { x:   8.4, y: 0.02, z: 3.1, sx: 2.2, sy: 1.3, sz: 1.9, ry: 2.10, seed: 15.6 },
        { x:   6.4, y: -0.05, z: 1.8, sx: 1.3, sy: 0.55, sz: 1.1, ry: 3.10, seed: 18.7 },

        // 3. Wide flank sentinels
        { x: -16.5, y: 0.30, z: 8.0, sx: 4.2, sy: 2.5, sz: 3.5, ry: 1.70, seed: 2.1 },
        { x:  17.5, y: 0.35, z: 7.5, sx: 4.5, sy: 2.7, sz: 3.8, ry: 2.50, seed: 4.4 }
      ];

      bConfigs.forEach(cfg => {
        const bGeo = createGlacialErraticGeometry(1.0, 2, cfg);
        const bMesh = new THREE.Mesh(bGeo, terrainMaterial);
        bMesh.position.set(cfg.x, cfg.y + cfg.sy * 0.45, cfg.z);
        bMesh.rotation.y = cfg.ry;
        terrainBoulders.add(bMesh);
      });
      scene.add(terrainBoulders);
    }

    /* --- 4. SACRED GERSTNER LAKE (Physical PBR Water with Dual-Simplex Ripple) --- */
    function buildSacredGerstnerLake() {
      const texData = window.GENERAL_WATER_TEXTURES || {};
      const waterGeo = new THREE.PlaneGeometry(1400, 800, 120, 80);
      waterGeo.rotateX(-Math.PI / 2);

      let waterNormalTex = texData.waterNormal ? textureLoader.load(texData.waterNormal) : null;
      if (waterNormalTex) {
        waterNormalTex.wrapS = THREE.RepeatWrapping;
        waterNormalTex.wrapT = THREE.RepeatWrapping;
      }

      waterMaterial = new THREE.ShaderMaterial({
        uniforms: {
          uTime: { value: 0.0 },
          uNormalMap: { value: waterNormalTex },
          uMoonPos: { value: new THREE.Vector3(-60, 140, -180) },
          uMoonColor: { value: new THREE.Color(0xcbd5e1) },
          uDeepColor: { value: new THREE.Color(0x010814) },
          uShallowColor: { value: new THREE.Color(0x04182e) },
          uSkyReflectColor: { value: new THREE.Color(0x081f3d) },
          uEmeraldColPos: { value: new THREE.Vector3(0, 0, -35) },
          uEmeraldColIntensity: { value: 0.0 },
          uMoonSpecularFactor: { value: 1.0 },
          uSphereReflectPos: { value: new THREE.Vector3(0, 0.91, -9.18) },
          uSphereReflectColor: { value: new THREE.Color(0x10b981) },
          uSphereReflectIntensity: { value: 0.0 }
        },
        vertexShader: `
          uniform float uTime;
          varying vec3 vWorldPosition;
          varying vec3 vNormal;
          varying vec2 vUv;

          void getGerstner(vec2 pos, float time, out vec3 dispPos, out vec3 wNormal) {
            float x = pos.x;
            float z = pos.y;
            float y = 0.0;
            vec3 B = vec3(1.0, 0.0, 0.0);
            vec3 T = vec3(0.0, 0.0, 1.0);

            // Primary gentle mountain lake swell
            float k1 = 2.0 * 3.14159 / 28.0;
            float c1 = 1.8;
            vec2 d1 = normalize(vec2(0.2, 0.98));
            float a1 = 0.08;
            float phase1 = k1 * (dot(d1, pos) - c1 * time);
            x += d1.x * (a1 * cos(phase1));
            z += d1.y * (a1 * cos(phase1));
            y += a1 * sin(phase1);
            B += vec3(-d1.x * d1.x * a1 * k1 * sin(phase1), d1.x * a1 * k1 * cos(phase1), -d1.x * d1.y * a1 * k1 * sin(phase1));
            T += vec3(-d1.x * d1.y * a1 * k1 * sin(phase1), d1.y * a1 * k1 * cos(phase1), -d1.y * d1.y * a1 * k1 * sin(phase1));

            // Secondary crossing wave
            float k2 = 2.0 * 3.14159 / 14.0;
            float c2 = 2.2;
            vec2 d2 = normalize(vec2(-0.4, 0.9));
            float a2 = 0.04;
            float phase2 = k2 * (dot(d2, pos) - c2 * time);
            x += d2.x * (a2 * cos(phase2));
            z += d2.y * (a2 * cos(phase2));
            y += a2 * sin(phase2);
            B += vec3(-d2.x * d2.x * a2 * k2 * sin(phase2), d2.x * a2 * k2 * cos(phase2), -d2.x * d2.y * a2 * k2 * sin(phase2));
            T += vec3(-d2.x * d2.y * a2 * k2 * sin(phase2), d2.y * a2 * k2 * cos(phase2), -d2.y * d2.y * a2 * k2 * sin(phase2));

            dispPos = vec3(x, y, z);
            wNormal = normalize(cross(T, B));
          }

          void main() {
            vUv = uv;
            vec3 dispPos;
            vec3 wNormal;
            getGerstner(position.xz, uTime, dispPos, wNormal);
            vec4 wp = modelMatrix * vec4(dispPos, 1.0);
            vWorldPosition = wp.xyz;
            vNormal = normalize(mat3(modelMatrix) * wNormal);
            gl_Position = projectionMatrix * viewMatrix * wp;
          }
        `,
        fragmentShader: `
          uniform float uTime;
          uniform sampler2D uNormalMap;
          uniform vec3 uMoonPos;
          uniform vec3 uMoonColor;
          uniform vec3 uDeepColor;
          uniform vec3 uShallowColor;
          uniform vec3 uSkyReflectColor;
          uniform vec3 uEmeraldColPos;
          uniform float uEmeraldColIntensity;
          uniform float uMoonSpecularFactor;
          uniform vec3 uSphereReflectPos;
          uniform vec3 uSphereReflectColor;
          uniform float uSphereReflectIntensity;

          varying vec3 vWorldPosition;
          varying vec3 vNormal;
          varying vec2 vUv;

          void main() {
            // Dual-speed scrolling micro normal map
            vec2 uv1 = vUv * 36.0 + vec2(uTime * 0.032, uTime * 0.024);
            vec2 uv2 = vUv * 78.0 + vec2(-uTime * 0.038, uTime * 0.030);
            vec3 n1 = texture2D(uNormalMap, uv1).rgb * 2.0 - 1.0;
            vec3 n2 = texture2D(uNormalMap, uv2).rgb * 2.0 - 1.0;
            vec3 microN = normalize(n1 + n2 * 0.65);

            vec3 N = normalize(vec3(
              vNormal.x + microN.x * 0.20,
              vNormal.y + microN.z * 0.06,
              vNormal.z + microN.y * 0.20
            ));

            vec3 V = normalize(cameraPosition - vWorldPosition);
            vec3 L_moon = normalize(uMoonPos - vWorldPosition);
            vec3 H_moon = normalize(L_moon + V);

            // Fresnel reflectance
            float cosTheta = clamp(dot(N, V), 0.0, 1.0);
            float fresnel = 0.03 + 0.97 * pow(1.0 - cosTheta, 5.0);

            vec3 waterDepth = mix(uDeepColor, uShallowColor, 0.40);
            vec3 baseWater = mix(waterDepth, uSkyReflectColor, fresnel);

            // Moonlight specular glitter path (harmonized & attenuated during sphere phase)
            float NdotH = max(0.0, dot(N, H_moon));
            float moonGlitter = (pow(NdotH, 32.0) * 0.60 + pow(NdotH, 120.0) * 1.8) * uMoonSpecularFactor;
            vec3 moonLit = uMoonColor * moonGlitter * 1.6;

            // Emerald-Violet Energy Sphere harmonic reflection on lake
            vec3 toSphere = uSphereReflectPos - vWorldPosition;
            float distSphereXZ = length(toSphere.xz);
            vec3 L_sphere = normalize(toSphere);
            vec3 H_sphere = normalize(L_sphere + V);
            float sphereSpec = pow(max(0.0, dot(N, H_sphere)), 24.0) * 0.85 + pow(max(0.0, dot(N, H_sphere)), 64.0) * 1.3;
            float sphereDiffuseAura = exp(-distSphereXZ * distSphereXZ / (20.0 * 20.0)) * 0.75;
            vec3 sphereReflect = uSphereReflectColor * (sphereSpec * 0.70 + sphereDiffuseAura) * uSphereReflectIntensity;

            // Emerald light column reflection on lake
            float colDist = length(vWorldPosition.xz - uEmeraldColPos.xz);
            float colGlow = exp(-colDist * colDist / (45.0 * 45.0)) * uEmeraldColIntensity;
            vec3 emeraldReflection = vec3(0.06, 0.85, 0.55) * colGlow * 1.5;

            vec3 finalColor = baseWater + moonLit + emeraldReflection + sphereReflect;
            gl_FragColor = vec4(finalColor, 0.94);
          }
        `,
        transparent: true,
        depthWrite: false,
        polygonOffset: true,
        polygonOffsetFactor: -1.0,
        polygonOffsetUnits: -2.0
      });

      waterMesh = new THREE.Mesh(waterGeo, waterMaterial);
      waterMesh.position.set(0, 0.0, -40); // Lake level strictly at Y = 0.0
      scene.add(waterMesh);

    function buildVFX1EmeraldColumn() {
      emeraldColumnGroup = new THREE.Group();

      const columnShaderMat = (colorHex, glowHex, powerVal) => new THREE.ShaderMaterial({
        uniforms: {
          uTime: { value: 0.0 },
          uOpacity: { value: 0.0 },
          uColor: { value: new THREE.Color(colorHex) },
          uGlowColor: { value: new THREE.Color(glowHex) },
          uPulse: { value: 1.0 }
        },
        vertexShader: `
          varying vec3 vWorldPosition;
          varying vec3 vNormal;
          varying vec2 vUv;
          void main() {
            vUv = uv;
            vec4 wp = modelMatrix * vec4(position, 1.0);
            vWorldPosition = wp.xyz;
            vNormal = normalize(mat3(modelMatrix) * normal);
            gl_Position = projectionMatrix * viewMatrix * wp;
          }
        `,
        fragmentShader: `
          uniform float uTime;
          uniform float uOpacity;
          uniform vec3 uColor;
          uniform vec3 uGlowColor;
          uniform float uPulse;

          varying vec3 vWorldPosition;
          varying vec3 vNormal;
          varying vec2 vUv;

          void main() {
            vec3 V = normalize(cameraPosition - vWorldPosition);
            vec3 N = normalize(vNormal);

            // Fresnel rim falloff
            float fresnel = pow(1.0 - abs(dot(V, N)), ${powerVal});

            // Vertical gradient: soft near bottom lake and sky apex
            float vertFade = sin(vUv.y * 3.14159);
            vertFade = pow(vertFade, 0.35);

            // Subtle energy spiral waves traveling downward
            float wave = 0.85 + 0.15 * sin(vUv.y * 45.0 - uTime * 2.8);

            vec3 col = mix(uColor, uGlowColor, fresnel) * wave * uPulse;
            float alpha = uOpacity * fresnel * vertFade;
            gl_FragColor = vec4(col, alpha);
          }
        `,
        blending: THREE.AdditiveBlending,
        transparent: true,
        depthWrite: false,
        side: THREE.DoubleSide
      });

      innerColumnMesh = new THREE.Mesh(innerGeo, columnShaderMat(0x10b981, 0x34d399, 1.8));
      outerColumnMesh = new THREE.Mesh(outerGeo, columnShaderMat(0x059669, 0x10b981, 2.4));
      emeraldColumnGroup.add(innerColumnMesh);
      emeraldColumnGroup.add(outerColumnMesh);

      // Healing Sparkle Particles (350 motes that can shift from emerald/gold to dark/amber and flow into lake)

      for (let i = 0; i < sparkleCount; i++) {

        sPositions[i * 3 + 2] = CAMERA_INIT_Z + Math.sin(ang) * rad;

        sSeeds[i * 4 + 0] = 0.4 + Math.random() * 0.6; // speed
        sSeeds[i * 4 + 1] = rad;

      }

      sparkleGeo.setAttribute('position', new THREE.BufferAttribute(sPositions, 3));
      sparkleGeo.setAttribute('color', new THREE.BufferAttribute(sColors, 3));

      sparkleMat = new THREE.PointsMaterial({

    /* --- 6. VFX 2: NJORD 3D DRAGON, 7 CHAKRA WAKE & PAST CLOUDS (166s - 247s) --- */
    function createDragonScalesNormalTexture() {
      const width = 512, height = 512;
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      const imgData = ctx.createImageData(width, height);
      const data = imgData.data;

      const rows = 32.0;
      const cols = 16.0;

      for (let y = 0; y < height; y++) {
        const v = (y / height) * rows;
        const row = Math.floor(v);
        const fv = v - row;

        for (let x = 0; x < width; x++) {
          let u = (x / width) * cols;
          if (row % 2 === 1) u += 0.5;
          const col = Math.floor(u);
          const fu = (u - col) - 0.5;

          const cx = fu * 2.1;
          const cy = (fv - 0.38) * 1.85;
          const distSq = cx * cx + cy * cy;
          const shield = Math.max(0.0, 1.0 - Math.sqrt(distSq));
          const carina = Math.exp(-Math.abs(fu) * 6.5) * 0.55;
          const overlapBevel = Math.max(0.0, 1.0 - fv * 1.15) * 0.45;
          const microPores = (Math.sin(x * 0.85) * Math.cos(y * 0.85) + Math.sin(x * 1.7 + y * 1.3) * 0.5) * 0.045;

          let nx = (-cx * 3.4 - Math.sign(fu) * (carina * 4.2)) * shield;
          let ny = (-cy * 2.8 - overlapBevel * 1.8);
          let nz = 1.0;
          const len = Math.hypot(nx, ny, nz) || 1.0;
          nx /= len; ny /= len; nz /= len;

          const idx = (y * width + x) * 4;
          data[idx + 0] = Math.floor((nx * 0.5 + 0.5) * 255);
          data[idx + 1] = Math.floor((ny * 0.5 + 0.5) * 255);
          data[idx + 2] = Math.floor((nz * 0.5 + 0.5) * 255);
          data[idx + 3] = 255;
        }
      }
      ctx.putImageData(imgData, 0, 0);
      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(24, 12);
      tex.generateMipmaps = true;
      return tex;
    }

    function buildVFX2NjordAndChakra() {
      njordGroup = new THREE.Group();

      scene.add(njordGroup);

      realDragonRoot = new THREE.Group();
      njordGroup.add(realDragonRoot);

      // Calibrated Catmull-Rom Flight Trajectory across mountain lake and past skies
      const njordFlightSpline = new THREE.CatmullRomCurve3([

        new THREE.Vector3(-26, 18, -120), // glide low over lake (185s)

      const tailMat = skinMat.clone();

      function configureDragonMesh(gltf) {
        if (!gltf || !gltf.scene) return;
        while (realDragonRoot.children.length > 0) {
          realDragonRoot.remove(realDragonRoot.children[0]);
        }
        dragonModel = gltf.scene;
        dragonBones = {};

        const box = new THREE.Box3().setFromObject(dragonModel);
        const size = new THREE.Vector3();
        const center = new THREE.Vector3();
        box.getSize(size);
        box.getCenter(center);

        // Calibrate majestic wingspan to 22 meters
        const TARGET_WINGSPAN = 22.0;
        const scale = TARGET_WINGSPAN / (size.x || 1.0);
        dragonModel.scale.setScalar(scale);
        dragonModel.position.sub(center.clone().multiplyScalar(scale));

        dragonModel.traverse(c => {
          if (c.isBone) dragonBones[c.name] = c;
          if (c.isMesh) {
            c.frustumCulled = false;
            c.castShadow = true;
            c.receiveShadow = true;
            if (c.name.includes("Eyes")) c.material = eyeMat;
            else if (c.name.includes("Wings")) c.material = wingMat;
            else if (c.name.includes("Tail")) c.material = tailMat;
            else c.material = skinMat;

        });

        const offsetWrapper = new THREE.Group();

        realDragonRoot.add(offsetWrapper);

        if (window.DRAGON_MODEL_DATA && typeof window.DRAGON_MODEL_DATA === 'string') {
          try {
            const raw = window.atob(window.DRAGON_MODEL_DATA);
            const u8 = new Uint8Array(raw.length);
            for (let i = 0; i < raw.length; i++) u8[i] = raw.charCodeAt(i);
            gltfLoader.parse(u8.buffer, '', gltf => configureDragonMesh(gltf), e => console.warn(e));
          } catch(e) {
            console.warn('Dragon Base64 parse fallback', e);
          }
        }
        if (window.location.protocol.startsWith('http')) {
          gltfLoader.load('dragon_flying.glb', gltf => configureDragonMesh(gltf), undefined, e => {

      // 7-Chakra Rainbow Wake Trailing Behind Njord
      const trailSteps = 75;
      const widthVerts = 9;

      function create7ChakraStreamerMesh(name) {
        const pos = new Float32Array(trailVertsCount * 3);
        const uvs = new Float32Array(trailVertsCount * 2);
        const alphas = new Float32Array(trailVertsCount);
        const indices = [];

        for (let s = 0; s < trailSteps - 1; s++) {
          for (let w = 0; w < widthVerts - 1; w++) {
            const i0 = s * widthVerts + w;
            const i1 = (s + 1) * widthVerts + w;
            const i2 = (s + 1) * widthVerts + (w + 1);
            const i3 = s * widthVerts + (w + 1);
            indices.push(i0, i1, i3);
            indices.push(i1, i2, i3);
            indices.push(i0, i3, i1);
            indices.push(i1, i3, i2);
          }
        }

        for (let s = 0; s < trailSteps; s++) {
          const u = s / (trailSteps - 1);
          for (let w = 0; w < widthVerts; w++) {
            const v = w / (widthVerts - 1);
            const idx = s * widthVerts + w;
            uvs[idx * 2 + 0] = u;
            uvs[idx * 2 + 1] = v;
            alphas[idx] = Math.pow(Math.max(0.0, 1.0 - u), 0.70) * Math.min(1.0, u * 12.0);
          }
        }

        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
        geo.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
        geo.setAttribute('aAlpha', new THREE.BufferAttribute(alphas, 1));
        geo.setIndex(indices);

        const mat = new THREE.ShaderMaterial({
          uniforms: {
            uTime: { value: 0.0 },
            uAlpha: { value: 0.0 }
          },
          vertexShader: `
            uniform float uTime;
            uniform float uAlpha;
            attribute float aAlpha;
            varying vec2 vUv;
            varying float vAlpha;
            void main() {
              vUv = uv;
              vAlpha = uAlpha * aAlpha;
              gl_Position = projectionMatrix * viewMatrix * vec4(position, 1.0);
            }
          `,
          fragmentShader: `
            uniform float uTime;
            varying vec2 vUv;
            varying float vAlpha;

            // 7 Chakra Colors interpolation (Muladhara to Sahasrara)
            vec3 sevenChakra(float t) {
              vec3 c0 = vec3(0.94, 0.27, 0.27); // 1. Muladhara (Ruby Red)
              vec3 c1 = vec3(0.98, 0.45, 0.09); // 2. Svadhisthana (Tangerine)
              vec3 c2 = vec3(0.92, 0.70, 0.03); // 3. Manipura (Solar Gold)
              vec3 c3 = vec3(0.06, 0.72, 0.50); // 4. Anahata (Emerald Green)
              vec3 c4 = vec3(0.02, 0.71, 0.83); // 5. Vishuddha (Glacial Cyan)
              vec3 c5 = vec3(0.23, 0.51, 0.96); // 6. Ajna (Deep Sapphire)
              vec3 c6 = vec3(0.66, 0.33, 0.97); // 7. Sahasrara (Celestial Violet)

              float s = clamp(t, 0.0, 1.0) * 6.0;
              float i = floor(s);
              float f = fract(s);
              if (i < 1.0) return mix(c0, c1, f);
              if (i < 2.0) return mix(c1, c2, f);
              if (i < 3.0) return mix(c2, c3, f);
              if (i < 4.0) return mix(c3, c4, f);
              if (i < 5.0) return mix(c4, c5, f);
              return mix(c5, c6, f);
            }

            void main() {
              float edge = pow(sin(vUv.y * 3.14159), 1.6);
              float shimmer = 0.88 + 0.12 * sin(vUv.x * 50.0 - uTime * 3.5);
              vec3 col = sevenChakra(vUv.y) * shimmer;
              float a = clamp(vAlpha * edge, 0.0, 0.95);
              gl_FragColor = vec4(col, a);
            }
          `,
          blending: THREE.AdditiveBlending,
          transparent: true,
          depthWrite: false,
          side: THREE.DoubleSide
        });

        const mesh = new THREE.Mesh(geo, mat);
        mesh.frustumCulled = false;
        return mesh;
      }

      chakraRibbonMesh = create7ChakraStreamerMesh('ChakraRibbonHorizontal');

    function createBridgeStoneTextures() {

      baseGrad.addColorStop(0.5, '#f1f5f9');
      baseGrad.addColorStop(1, '#e2e8f0');
      ctx.fillStyle = baseGrad;
      ctx.fillRect(0, 0, width, height);

      // Fine crystalline marble veining
      ctx.strokeStyle = 'rgba(148, 163, 184, 0.26)';
      ctx.lineWidth = 1.8;
      for (let i = 0; i < 28; i++) {
        ctx.beginPath();
        let sx = Math.random() * width;
        let sy = Math.random() * height;
        ctx.moveTo(sx, sy);
        for (let seg = 0; seg < 6; seg++) {
          sx += (Math.random() - 0.4) * 160;
          sy += (Math.random() - 0.2) * 120;
          ctx.lineTo(sx, sy);
        }
        ctx.stroke();
      }

      // Stone Slabs Layout (Paving transverse joints every 128px with 3D bevels)
      const slabRows = 8;
      const rowH = height / slabRows;
      for (let r = 0; r <= slabRows; r++) {
        const y = r * rowH;
        ctx.fillStyle = 'rgba(30, 41, 59, 0.45)'; // Dark joint line
        ctx.fillRect(0, y - 1, width, 2);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.65)'; // Top bevel highlight
        ctx.fillRect(0, y + 1, width, 1.5);
      }

      // Golden Bronze Trim lines along inner curb margins
      ctx.fillStyle = 'rgba(217, 119, 6, 0.65)';
      ctx.fillRect(0, 0, 24, height);
      ctx.fillRect(width - 24, 0, 24, height);

      const albedoTex = new THREE.CanvasTexture(canvas);
      albedoTex.wrapS = THREE.RepeatWrapping;
      albedoTex.wrapT = THREE.RepeatWrapping;
      albedoTex.repeat.set(2, 28);
      albedoTex.generateMipmaps = true;

      // 2. Micro-roughness Normal Map for stone grain & slab joints
      const nCanvas = document.createElement('canvas');
      nCanvas.width = 512;
      nCanvas.height = 512;
      const nCtx = nCanvas.getContext('2d');
      const nImg = nCtx.createImageData(512, 512);
      const nd = nImg.data;

      for (let y = 0; y < 512; y++) {
        const rowFrac = (y % 64);
        const isJoint = rowFrac < 2 || rowFrac > 62;
        for (let x = 0; x < 512; x++) {
          const idx = (y * 512 + x) * 4;
          const grain = (Math.sin(x * 0.8) * Math.cos(y * 0.8) + Math.sin(x * 1.6 + y * 1.2) * 0.4) * 0.12;
          let nx = grain;
          let ny = isJoint ? (rowFrac < 2 ? -0.45 : 0.45) : grain;
          let nz = 1.0;
          const len = Math.hypot(nx, ny, nz) || 1.0;
          nd[idx + 0] = Math.floor((nx / len * 0.5 + 0.5) * 255);
          nd[idx + 1] = Math.floor((ny / len * 0.5 + 0.5) * 255);
          nd[idx + 2] = Math.floor((nz / len * 0.5 + 0.5) * 255);
          nd[idx + 3] = 255;
        }
      }
      nCtx.putImageData(nImg, 0, 0);
      const normalTex = new THREE.CanvasTexture(nCanvas);
      normalTex.wrapS = THREE.RepeatWrapping;
      normalTex.wrapT = THREE.RepeatWrapping;
      normalTex.repeat.set(2, 28);
      normalTex.generateMipmaps = true;

      return { albedo: albedoTex, normal: normalTex };
    }

    function buildVFX4LightTunnelAndFutureFears() {

        uniforms: {
          uTime: { value: 0.0 },
          uOpacity: { value: 0.0 }
        },
        vertexShader: `
          varying vec3 vWorldPosition;
          varying vec2 vUv;
          void main() {
            vUv = uv;
            vec4 wp = modelMatrix * vec4(position, 1.0);
            vWorldPosition = wp.xyz;
            gl_Position = projectionMatrix * viewMatrix * wp;
          }
        `,
        fragmentShader: `
          uniform float uTime;
          uniform float uOpacity;
          varying vec3 vWorldPosition;
          varying vec2 vUv;

          // Iridescent shifting spectral waves (Turquoise -> Gold -> Magenta)
          vec3 tunnelColor(float t) {
            vec3 c0 = vec3(0.06, 0.82, 0.75); // Turquoise
            vec3 c1 = vec3(0.98, 0.78, 0.22); // Solar Gold
            vec3 c2 = vec3(0.85, 0.25, 0.75); // Radiant Magenta
            vec3 c3 = vec3(0.35, 0.55, 0.98); // Sapphire
            float s = fract(t);
            if (s < 0.33) return mix(c0, c1, s * 3.0);
            if (s < 0.66) return mix(c1, c2, (s - 0.33) * 3.0);
            return mix(c2, c3, (s - 0.66) * 3.0);
          }

          void main() {
            float spiral = sin(vUv.x * 32.0 + vWorldPosition.z * 0.15 - uTime * 2.5);
            float colorPhase = vWorldPosition.z * 0.012 - uTime * 0.18;
            vec3 col = tunnelColor(colorPhase) * (0.85 + 0.15 * spiral);

            // Arch fade (fade out at floor level Y=0)
            float archFade = smoothstep(0.0, 1.8, vWorldPosition.y);
            float alpha = uOpacity * (0.35 + 0.25 * spiral) * archFade;
            gl_FragColor = vec4(col, alpha);
          }
        `,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        side: THREE.BackSide
      });

      lightTunnelMesh = new THREE.Mesh(tunnelGeo, tunnelMat);
      lightTunnelMesh.position.set(0, 3.2, -40);

    /* --- 10. 3D SUBTITLE BILLBOARD & VR RETICLE --- */
    function build3DSubtitleBillboard() {
      billboardCanvas = document.createElement('canvas');
      billboardCanvas.width = 2048;
      billboardCanvas.height = 512;
      billboardContext = billboardCanvas.getContext('2d');

      billboardTexture = new THREE.CanvasTexture(billboardCanvas);
      billboardTexture.minFilter = THREE.LinearFilter;
      billboardTexture.magFilter = THREE.LinearFilter;
      billboardTexture.generateMipmaps = false;

      const billboardGeo = new THREE.PlaneGeometry(3.2, 0.8);
      const billboardMat = new THREE.MeshBasicMaterial({
        map: billboardTexture,
        transparent: true,
        opacity: 1.0,
        depthTest: false,
        depthWrite: false,
        fog: false
      });
      billboardMesh = new THREE.Mesh(billboardGeo, billboardMat);
      billboardMesh.renderOrder = 9999;
      // Positioned safely higher up (Y = -0.16, Z = -2.8) so Cardboard lenses never cut text off at bottom
      billboardMesh.position.set(0, -0.16, -2.8);
      billboardMesh.visible = false;
      camera.add(billboardMesh);
    }

    let lastRenderedSubtitleText = null;
    function update3DSubtitle(text) {
      if (text === lastRenderedSubtitleText) return;
      lastRenderedSubtitleText = text;
      if (!billboardContext) return;
      billboardContext.clearRect(0, 0, billboardCanvas.width, billboardCanvas.height);
      if (!text) {
        billboardTexture.needsUpdate = true;
        return;
      }

      billboardContext.save();
      billboardContext.shadowColor = 'rgba(0, 0, 0, 0.95)';
      billboardContext.shadowBlur = 12;
      billboardContext.shadowOffsetX = 0;
      billboardContext.shadowOffsetY = 2;
      billboardContext.fillStyle = '#FFFFFF';
      billboardContext.font = 'bold 54px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
      billboardContext.textAlign = 'center';
      billboardContext.textBaseline = 'middle';

      // Wrap text inside 1860px width
      const words = text.split(' ');
      let lines = [];
      let currentLine = words[0];
      for (let i = 1; i < words.length; i++) {
        const word = words[i];
        const width = billboardContext.measureText(currentLine + " " + word).width;
        if (width < 1860) {
          currentLine += " " + word;
        } else {
          lines.push(currentLine);
          currentLine = word;
        }
      }
      lines.push(currentLine);

      const lineHeight = 72;
      const totalH = lines.length * lineHeight;
      const startY = 256 - (totalH / 2) + (lineHeight / 2);
      for (let k = 0; k < lines.length; k++) {
        billboardContext.fillText(lines[k], 1024, startY + (k * lineHeight));
      }
      billboardContext.restore();
      billboardTexture.needsUpdate = true;
    }
