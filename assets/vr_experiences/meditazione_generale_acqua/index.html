    /* ======================================================================
       MASTER TIMELINE ENGINE (16 Scene Narrative & VFX Transitions)
       ====================================================================== */
    function updateExperienceTimeline(timeSec, deltaSec) {
      // 1. Update Subtitles (both 2D Monoscopic & 3D VR Billboard)
      updateSubtitlesForTime(timeSec);

      // 2. VFX 1: Emerald Column Trajectory & Breathing Animation (0s - 165s)
      if (timeSec < 165.0) {
        emeraldColumnGroup.visible = true;
        const colProg = Math.min(1.0, timeSec / 2.5); // Fade in over 2.5s
        const fadeOut = Math.min(1.0, Math.max(0.0, (165.0 - timeSec) / 4.0));
        const colAlpha = colProg * fadeOut;

        innerColumnMesh.material.uniforms.uOpacity.value = colAlpha * 0.92;
        outerColumnMesh.material.uniforms.uOpacity.value = colAlpha * 0.70;
        innerColumnMesh.material.uniforms.uTime.value = timeSec;
        outerColumnMesh.material.uniforms.uTime.value = timeSec;

        // 8.0s Sine Breath Cycle (4s Expansion Inhale, 4s Contraction Exhale)
        const breathScale = 1.0 + 0.18 * Math.sin(timeSec * (Math.PI * 2.0 / 8.0));
        emeraldColumnGroup.scale.set(breathScale, 1.0, breathScale);

        // Water reflection and ground illumination
        if (waterMaterial && waterMaterial.uniforms) {
          waterMaterial.uniforms.uEmeraldColIntensity.value = colAlpha * breathScale;
        }
        if (emeraldPointLight) {
          emeraldPointLight.intensity = colAlpha * 1.5;
        }

        // Column Spatial Trajectory:
        // Scene 1 (0s - 16s): at lake center (Z = -35.0)
        // Scene 2-3 (16s - 28s): smoothly advances forward along Z to 12.0 (enveloping user)
        // Scene 4-5 (66s - 94s): retreats back to lake (Z = -35.0)
        if (timeSec < 16.0) {
          emeraldColumnGroup.position.set(0, 50, -35.0);
        } else if (timeSec < 28.0) {
          const tAdv = (timeSec - 16.0) / 12.0;
          const easeAdv = tAdv * tAdv * (3.0 - 2.0 * tAdv);
          const curZ = -35.0 + (CAMERA_INIT_Z - -35.0) * easeAdv;
          emeraldColumnGroup.position.set(0, 50, curZ);
        } else if (timeSec < 66.0) {
          emeraldColumnGroup.position.set(0, 50, CAMERA_INIT_Z);
          // Scene 3: gentle sinusoidal body swaying tilt (+-0.8 deg roll)
          const roll = Math.sin(timeSec * (Math.PI * 2.0 / 8.0)) * 0.014;
          cameraRig.rotation.z = roll;
        } else if (timeSec < 94.0) {
          cameraRig.rotation.z = 0;
          const tRet = (timeSec - 66.0) / 28.0;
          const easeRet = tRet * tRet * (3.0 - 2.0 * tRet);
          const curZ = CAMERA_INIT_Z + (-35.0 - CAMERA_INIT_Z) * easeRet;
          emeraldColumnGroup.position.set(0, 50, curZ);
        } else {
          emeraldColumnGroup.position.set(0, 50, -35.0);
        }

        // Sparkle Particles Management (Scene 4-5: 66s - 165s)
        if (timeSec >= 66.0 && timeSec < 165.0) {
          sparkleParticles.visible = true;
          const sFadeIn = Math.min(1.0, (timeSec - 66.0) / 4.0);
          const sFadeOut = Math.min(1.0, (165.0 - timeSec) / 5.0);
          sparkleMat.opacity = sFadeIn * sFadeOut * 0.90;

          const pPos = sparkleGeo.attributes.position.array;
          const pCols = sparkleGeo.attributes.color.array;
          const pSeeds = sparkleGeo.attributes.aSeed.array;

          // In Scene 5 (95s - 165s), particles turn into dark smoke/amber (fears/toxins) and flow to column
          const isTransmuting = timeSec >= 95.0;
          const transmuteProg = isTransmuting ? Math.min(1.0, (timeSec - 95.0) / 25.0) : 0.0;

          for (let i = 0; i < 350; i++) {
            const spd = pSeeds[i * 4 + 0];
            const rad = pSeeds[i * 4 + 1];
            let ang = pSeeds[i * 4 + 2] + timeSec * 0.25 * spd;
            
            if (!isTransmuting) {
              // Gentle swirling around user
              pPos[i * 3 + 0] = Math.cos(ang) * rad;
              pPos[i * 3 + 1] = 0.5 + Math.sin(timeSec * 1.5 + pSeeds[i * 4 + 3]) * 1.5 + 1.2;
              pPos[i * 3 + 2] = CAMERA_INIT_Z + Math.sin(ang) * rad;

              // Radiant emerald-gold
              pCols[i * 3 + 0] = 0.20;
              pCols[i * 3 + 1] = 0.95;
              pCols[i * 3 + 2] = 0.65;
            } else {
              // Attracted towards emerald column at Z = -35.0
              const tFlow = Math.min(1.0, (timeSec - 95.0 + i * 0.12) / 45.0);
              const curZ = CAMERA_INIT_Z + (-35.0 - CAMERA_INIT_Z) * tFlow;
              pPos[i * 3 + 0] = Math.cos(ang) * (rad * (1.0 - tFlow * 0.6));
              pPos[i * 3 + 1] = 1.0 + Math.sin(timeSec * 2.0 + i) * 1.2;
              pPos[i * 3 + 2] = curZ;

              // Color transmuting to smoky dark amber and dissolving
              pCols[i * 3 + 0] = 0.20 * (1.0 - transmuteProg) + 0.35 * transmuteProg;
              pCols[i * 3 + 1] = 0.95 * (1.0 - transmuteProg) + 0.18 * transmuteProg;
              pCols[i * 3 + 2] = 0.65 * (1.0 - transmuteProg) + 0.05 * transmuteProg;
            }
          }
          sparkleGeo.attributes.position.needsUpdate = true;
          sparkleGeo.attributes.color.needsUpdate = true;
        } else {
          sparkleParticles.visible = false;
        }
      } else {
        emeraldColumnGroup.visible = false;
        sparkleParticles.visible = false;
        if (emeraldPointLight) emeraldPointLight.intensity = 0.0;
        if (waterMaterial && waterMaterial.uniforms) waterMaterial.uniforms.uEmeraldColIntensity.value = 0.0;
      }

      // 3. VFX 2: Njord Flight & 7 Chakra Trail (166s - 247s)
      if (timeSec >= 165.0 && timeSec < 248.0) {
        njordGroup.visible = true;
        const nFadeIn = Math.min(1.0, (timeSec - 165.0) / 4.0);
        const nFadeOut = Math.min(1.0, (248.0 - timeSec) / 4.0);
        const nAlpha = nFadeIn * nFadeOut;

        // Advance skeletal flight animation via AnimationMixer cleanly
        if (dragonMixer) {
          const dt = (typeof deltaSec === 'number' && deltaSec > 0 && deltaSec < 0.2) ? deltaSec : 0.016;
          dragonMixer.update(dt * 1.15);
        }

        // Njord Flight Path with smooth banking into curves (+Z forward, zero GC allocations)
        const flightSpline = njordGroup.userData.flightSpline;
        const uFlight = Math.max(0.0, Math.min(1.0, (timeSec - 166.0) / 81.0));

        let dPos = _vTemp1;
        let dTan = _vTemp2;
        flightSpline.getPointAt(uFlight, dPos);
        flightSpline.getTangentAt(uFlight, dTan).normalize();

        const tNext = Math.min(1.0, uFlight + 0.015);
        flightSpline.getTangentAt(tNext, _nextTan).normalize();
        _tempNormal.crossVectors(dTan, _upVec).normalize();
        _curvature.copy(_nextTan).sub(dTan);
        const bankAngle = THREE.MathUtils.clamp(-_curvature.dot(_tempNormal) * 5.5, -0.65, 0.65);

        realDragonRoot.position.copy(dPos);
        _targetQuat.setFromUnitVectors(_forwardZ, dTan);
        _bankQuat.setFromAxisAngle(dTan, bankAngle);
        _targetQuat.premultiply(_bankQuat);
        realDragonRoot.quaternion.copy(_targetQuat);

        // Past clouds visibility (active when Njord approaches Z > 12: uFlight > 0.50)
        if (uFlight >= 0.50 && uFlight <= 0.92) {
          pastCloudsGroup.visible = true;
          const tPast = (uFlight - 0.50) / 0.42;
          if (pastCloudsGroup.userData && pastCloudsGroup.userData.material) {
            const cloudFade = Math.max(0.0, 1.0 - tPast * 1.5);
            pastCloudsGroup.userData.material.opacity = cloudFade * 0.85;
          }
        } else {
          pastCloudsGroup.visible = false;
        }

        // Update 7 Chakra Rainbow Ribbon Trail
        if (chakraRibbonMesh && chakraRibbonMesh.material.uniforms) {
          chakraRibbonMesh.material.uniforms.uTime.value = timeSec;
          chakraRibbonMesh.material.uniforms.uAlpha.value = nAlpha * 0.95;
          chakraCurtainMesh.material.uniforms.uTime.value = timeSec;
          chakraCurtainMesh.material.uniforms.uAlpha.value = nAlpha * 0.85;

          const trailArr = chakraRibbonMesh.geometry.attributes.position.array;
          const curtainArr = chakraCurtainMesh.geometry.attributes.position.array;

          for (let s = 0; s < 75; s++) {
            const uLag = Math.max(0.0, uFlight - (s * 0.0032 + 0.012));
            flightSpline.getPointAt(uLag, _trailPt);
            flightSpline.getTangentAt(uLag, _trailTan).normalize();
            _trailNorm.crossVectors(_trailTan, _upVec).normalize();

            const sFactor = s / 74.0;
            const trailEnvelope = Math.sin(Math.pow(sFactor, 0.45) * Math.PI);
            const trailWidth = 3.2 + trailEnvelope * 18.0;
            const curtainHeight = 2.0 + trailEnvelope * 10.0;
            const ribbonWave = Math.sin(timeSec * 2.8 - s * 0.22) * 0.45;

            for (let w = 0; w < 9; w++) {
              const wFrac = (w / 8.0) - 0.5;
              const idx = (s * 9 + w) * 3;
              const latX = _trailNorm.x * (wFrac * trailWidth);
              const latZ = _trailNorm.z * (wFrac * trailWidth);

              trailArr[idx + 0] = _trailPt.x + latX;
              trailArr[idx + 1] = _trailPt.y + ribbonWave;
              trailArr[idx + 2] = _trailPt.z + latZ;

              curtainArr[idx + 0] = _trailPt.x + latX * 0.35;
              curtainArr[idx + 1] = _trailPt.y + (w / 8.0) * curtainHeight;
              curtainArr[idx + 2] = _trailPt.z + latZ * 0.35;
            }
          }
          chakraRibbonMesh.geometry.attributes.position.needsUpdate = true;
          chakraCurtainMesh.geometry.attributes.position.needsUpdate = true;
        }
      } else {
        njordGroup.visible = false;
        pastCloudsGroup.visible = false;
      }

      // 4. VFX 3: Volumetric 3D Stone Bridge & Floating Gold Pocket Watch (247s - 403.5s)
      if (timeSec >= 247.0 && timeSec < 403.5) {
        if (bridgeGroup) {
          bridgeGroup.visible = true;
          const roadFadeIn = Math.min(1.0, (timeSec - 247.0) / 4.0);
          // Seamless 3.0-second crossfade starting at 400.5s up to 403.5s (zero sudden pop!)
          const roadFadeOut = (timeSec >= 400.5) ? Math.max(0.0, (403.5 - timeSec) / 3.0) : 1.0;
          const bridgeAlpha = roadFadeIn * roadFadeOut;

          if (bridgeMaterials) {
            bridgeMaterials.forEach(m => {
              if (m && m.opacity !== undefined) {
                m.opacity = bridgeAlpha * 0.98;
              }
            });
          }
          if (bridgeVeinMat) {
            bridgeVeinMat.opacity = bridgeAlpha * 0.98;
            bridgeVeinMat.emissiveIntensity = 0.12 * bridgeAlpha;
          }
          if (lanternOpalMat) {
            lanternOpalMat.emissiveIntensity = (1.2 + 0.45 * Math.sin(timeSec * 2.1)) * bridgeAlpha;
          }
        }

        // Gold Pocket Watch (Scene 9-13: 291s - 402.5s) - Rigidly anchored to cameraRig, ZERO jitter
        if (timeSec >= 291.0 && timeSec < 402.5) {
          goldWatchGroup.visible = true;
          const watchFadeOut = (timeSec >= 400.0) ? Math.max(0.0, (402.5 - timeSec) / 2.5) : 1.0;
          goldWatchGroup.scale.setScalar(watchFadeOut);
          if (watchHands.hour) watchHands.hour.rotation.z = -timeSec * 0.12;
          if (watchHands.minute) watchHands.minute.rotation.z = -timeSec * 1.40;

          // Gentle organic hovering bob in local Y
          const watchBob = Math.sin(timeSec * 1.8) * 0.015;
          goldWatchGroup.position.set(0.0, -0.74 + watchBob, -1.18);
        } else {
          goldWatchGroup.visible = false;
        }
      } else {
        if (bridgeGroup) bridgeGroup.visible = false;
        goldWatchGroup.visible = false;
      }

      // 5. VFX 4: Shifting Light Tunnel, Travel & Future Fears (337s - 402s)
      if (timeSec >= 337.0 && timeSec < 403.0) {
        lightTunnelGroup.visible = true;
        const tFadeIn = Math.min(1.0, (timeSec - 337.0) / 4.0);
        const tFadeOut = Math.min(1.0, (403.0 - timeSec) / 4.0);
        lightTunnelMesh.material.uniforms.uOpacity.value = tFadeIn * tFadeOut * 0.85;
        lightTunnelMesh.material.uniforms.uTime.value = timeSec;

        // Scene 12: Smooth non-jerk camera travel forward along stone bridge (353s - 372s)
        if (timeSec >= 353.0 && timeSec < 372.0) {
          const tWalk = (timeSec - 353.0) / 19.0;
          const easeWalk = tWalk * tWalk * (3.0 - 2.0 * tWalk);
          const curCamZ = CAMERA_INIT_Z + (-8.0 - CAMERA_INIT_Z) * easeWalk;
          cameraRig.position.set(CAMERA_INIT_X, CAMERA_INIT_Y, curCamZ);
        } else if (timeSec >= 372.0) {
          cameraRig.position.set(CAMERA_INIT_X, CAMERA_INIT_Y, -8.0);
        }

        // Scene 13: Future Fears Absorption into Pocket Watch (372s - 402s)
        if (timeSec >= 372.0 && timeSec < 402.0) {
          futureFearSpheresGroup.visible = true;
          const fears = futureFearSpheresGroup.children;
          goldWatchGroup.getWorldPosition(_vTempWatchPos);
          const watchPos = _vTempWatchPos;

          fears.forEach((f, idx) => {
            const data = f.userData;
            const fProg = Math.min(1.0, (timeSec - 372.0 + idx * 0.8) / 22.0);
            if (fProg < 1.0) {
              // Spiral vortex into world watch position
              const spiralAng = data.phase + fProg * Math.PI * 6.0;
              const curDist = (1.0 - fProg) * 35.0;
              f.position.set(
                watchPos.x + Math.cos(spiralAng) * (curDist * 0.15),
                watchPos.y + Math.sin(spiralAng) * (curDist * 0.15),
                watchPos.z - curDist
              );
              f.scale.setScalar(Math.max(0.01, 1.0 - fProg * 0.85));
            } else {
              // Absorbed!
              f.scale.setScalar(0.001);
            }
          });
        } else {
          futureFearSpheresGroup.visible = false;
        }
      } else {
        lightTunnelGroup.visible = false;
        futureFearSpheresGroup.visible = false;
      }

      // 6. VFX 5: Emerald-Violet Sphere & Protective Mantle (400.5s - 456.78s)
      if (timeSec >= 400.5) {
        // Metamorphosis: Watch dissolves into Energy Sphere with soft organic crescendo
        energySphereMesh.visible = (timeSec < 442.0);

        energySphereMesh.material.uniforms.uTime.value = timeSec;
        energySphereMesh.position.set(0.0, -0.74, -1.18);

        if (timeSec < 439.0) {
          // 3.0 second organic crescendo from 400.5s to 403.5s
          const sFadeIn = Math.min(1.0, (timeSec - 400.5) / 3.0);
          const easeSphere = sFadeIn * sFadeIn * (3.0 - 2.0 * sFadeIn);
          energySphereMesh.material.uniforms.uOpacity.value = easeSphere;
          energySphereMesh.scale.setScalar(0.25 + 0.75 * easeSphere);
          protectiveMantleMesh.visible = false;
          if (mantleStardust) mantleStardust.visible = false;
        } else {
          // Scene 15: Expansion into Protective Mantle (439s - 456s)
          protectiveMantleMesh.visible = true;
          protectiveMantleMesh.position.copy(cameraRig.position);

          const tMantle = Math.min(1.0, (timeSec - 439.0) / 14.0);
          const easeMantle = tMantle * tMantle * (3.0 - 2.0 * tMantle);

          // Sphere expands from 0.35m to 3.6m
          const mantleScale = 0.35 + (3.6 - 0.35) * easeMantle;
          protectiveMantleMesh.scale.setScalar(mantleScale / 3.6);
          protectiveMantleMesh.material.uniforms.uOpacity.value = Math.min(1.0, tMantle * 1.5) * 0.90;
          protectiveMantleMesh.material.uniforms.uTime.value = timeSec;

          // Stardust swirling around user
          if (mantleStardust) {
            mantleStardust.visible = true;
            mantleStardust.position.copy(cameraRig.position);
            mantleStardust.material.opacity = Math.min(0.85, tMantle * 1.2);
            mantleStardust.rotation.y = timeSec * 0.15;
          }

          // Energy sphere fades into mantle
          energySphereMesh.material.uniforms.uOpacity.value = Math.max(0.0, 1.0 - tMantle * 1.2);
        }

        // Scene 16: Conclusive Soft Bloom Fade (456.0s - 456.78s)
        if (timeSec >= 455.5 && bloomOverlay) {
          const bAlpha = Math.min(0.40, (timeSec - 455.5) / 1.28);
          bloomOverlay.style.opacity = bAlpha;
        }
      } else {
        energySphereMesh.visible = false;
        protectiveMantleMesh.visible = false;
        if (mantleStardust) mantleStardust.visible = false;
        if (bloomOverlay) bloomOverlay.style.opacity = 0;
      }

      // 7. Water Specular & Sphere Reflection Harmonization (Scene 14-16: 399s - 456s)
      if (waterMaterial && waterMaterial.uniforms) {
        if (timeSec >= 399.0 && timeSec < 442.0) {
          const tHarmonize = Math.min(1.0, (timeSec - 399.0) / 3.5);
          // Attenuate harsh white directional specular on water by 94%
          waterMaterial.uniforms.uMoonSpecularFactor.value = 1.0 - tHarmonize * 0.94;
          if (moonLight) moonLight.intensity = 0.65 - tHarmonize * 0.45;

          // Soft pulsating emerald-violet reflection echoing the sphere
          waterMaterial.uniforms.uSphereReflectIntensity.value = tHarmonize * (1.2 + 0.25 * Math.sin(timeSec * 2.8));
          if (energySphereMesh) {
            energySphereMesh.getWorldPosition(_vTempSpherePos);
            waterMaterial.uniforms.uSphereReflectPos.value.copy(_vTempSpherePos);
          }
          // Harmonic blend between emerald and celestial violet
          const sphereWave = 0.5 + 0.5 * Math.sin(timeSec * 1.8);
          waterMaterial.uniforms.uSphereReflectColor.value.setRGB(
            0.06 * (1.0 - sphereWave) + 0.55 * sphereWave,
            0.85 * (1.0 - sphereWave) + 0.30 * sphereWave,
            0.50 * (1.0 - sphereWave) + 0.95 * sphereWave
          );
        } else if (timeSec < 399.0) {
          waterMaterial.uniforms.uMoonSpecularFactor.value = 1.0;
          waterMaterial.uniforms.uSphereReflectIntensity.value = 0.0;
          if (moonLight) moonLight.intensity = 0.65;
        } else {
          // Mantle phase: gentle return of moon specular
          const tMantleRest = Math.min(1.0, (timeSec - 442.0) / 6.0);
          waterMaterial.uniforms.uMoonSpecularFactor.value = 0.18 + tMantleRest * 0.52;
          waterMaterial.uniforms.uSphereReflectIntensity.value = Math.max(0.0, 1.0 - tMantleRest);
        }
      }

      // 7. Session Completion Check (456.78s)
      if (timeSec >= TOTAL_DURATION_SEC && !state.isCompleted) {
        onExperienceEnded();
      }
    }

    /* --- SUBTITLES UPDATE (2D Overlay & 3D VR Billboard) --- */
    function updateSubtitlesForTime(t) {
      let activeText = '';
      for (let i = 0; i < SCRIPT_CUES.length; i++) {
        if (t >= SCRIPT_CUES[i].start && t <= SCRIPT_CUES[i].end) {
          activeText = SCRIPT_CUES[i].text;
          break;
        }
      }

      // 2D Overlay (Visible in monoscopic mode, hidden in VR mode)
      if (hudSubtitles && hudSubtitlesText) {
        if (activeText && !state.isVRMode) {
          if (hudSubtitlesText.textContent !== activeText) {
            hudSubtitlesText.textContent = activeText;
          }
          hudSubtitles.classList.add('visible');
        } else {
          hudSubtitles.classList.remove('visible');
        }
      }

      // 3D VR Billboard (Visible only in VR Mode)
      if (billboardMesh) {
        if (state.isVRMode && activeText) {
          billboardMesh.visible = true;
          update3DSubtitle(activeText);
        } else {
          billboardMesh.visible = false;
        }
      }

    /* ======================================================================
       AUDIO PLAYBACK & DUAL-BUFFER GAPLESS 432 HZ MUSIC LOOP
       ====================================================================== */
    function unlockAudio() {
      if (!audioContext) {
        try {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          audioContext = new AudioContextClass();
        } catch(e) {
          console.warn('Web Audio API not supported', e);
        }
      }
      if (audioContext && audioContext.state === 'suspended') {
        audioContext.resume().catch(e => console.warn(e));
      }
    }

    function syncVolumes() {
      if (audioVoice) audioVoice.volume = state.voiceVolume;
      if (audioMusicA) audioMusicA.volume = state.musicVolume;
      if (audioMusicB) audioMusicB.volume = 0.0;
    }

    // Dual-buffer 3.0s continuous crossfade for gapless 432 Hz loop
    function updateMusicLoop(timeSec) {
      const musicCycleTime = timeSec % MUSIC_CYCLE_SEC;
      const isCrossfading = musicCycleTime >= (MUSIC_CYCLE_SEC - 3.0);

      if (isCrossfading) {
        const xFade = (musicCycleTime - (MUSIC_CYCLE_SEC - 3.0)) / 3.0; // 0.0 to 1.0
        if (audioMusicB.paused) {
          audioMusicB.currentTime = 0;
          audioMusicB.play().catch(e => {});
        }
        audioMusicA.volume = Math.max(0.0, state.musicVolume * (1.0 - xFade));
        audioMusicB.volume = Math.min(state.musicVolume, state.musicVolume * xFade);
      } else {
        if (!audioMusicB.paused && audioMusicB.volume < 0.01) {
          audioMusicB.pause();
        }
        audioMusicA.volume = state.musicVolume;
      }
    }

    function playExperience() {
      if (state.isCompleted) {
        state.isCompleted = false;
        hide2DCompletionPopup();
        hideVRCompletionPopup();
        seekExperience(0);
      }
      unlockAudio();
      state.isPlaying = true;
      iconPause.style.display = 'block';
      iconPlay.style.display = 'none';

      audioVoice.play().catch(e => console.warn('Voice play fallback', e));
      audioMusicA.play().catch(e => console.warn('Music play fallback', e));
    }

    function pauseExperience() {
      state.isPlaying = false;
      iconPause.style.display = 'none';
      iconPlay.style.display = 'block';

      audioVoice.pause();
      audioMusicA.pause();
      audioMusicB.pause();
    }

    function togglePlay() {
      if (state.isPlaying) pauseExperience();
      else playExperience();
    }

    function seekExperience(targetSec) {
      targetSec = Math.max(0, Math.min(TOTAL_DURATION_SEC, targetSec));
      state.currentTime = targetSec;

      if (state.isCompleted && targetSec < TOTAL_DURATION_SEC) {
        state.isCompleted = false;
        hide2DCompletionPopup();
        hideVRCompletionPopup();
      }

      function applySeek(el, t) {
        if (!el) return;
        if (el.readyState >= 1) {
          try { el.currentTime = t; } catch(e) {}
        } else {
          el.addEventListener('loadedmetadata', () => {
            try { el.currentTime = t; } catch(e) {}
          }, { once: true });
        }
      }

      applySeek(audioVoice, Math.min(targetSec, VOICE_DURATION_SEC));
      applySeek(audioMusicA, targetSec % MUSIC_CYCLE_SEC);
      updateExperienceTimeline(targetSec, 0.016);
    }

    /* ======================================================================
       COMPLETION FLOW (Dual-Layer: 3D in-VR Canvas + Flutter Native Dialog)
       ====================================================================== */
    function isFlutterEnvironment() {
      try {
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('is-mobile-app') || urlParams.has('isMobileApp') || urlParams.get('source') === 'flutter') {
          return true;
        }
      } catch (e) {}
      if (typeof window.flutter_inappwebview !== 'undefined' && window.flutter_inappwebview.callHandler) return true;
      if (typeof window.GuidoFlutterBridge !== 'undefined') return true;
      if (navigator.userAgent && navigator.userAgent.includes('GuidoFlutter')) return true;
      return false;
    }

    function onExperienceEnded() {
      state.isCompleted = true;
      state.isPlaying = false;
      audioVoice.pause();
      audioMusicA.pause();
      audioMusicB.pause();

      const isInsideFlutter = isFlutterEnvironment();

      // In VR mode: show 3D in-VR Cardboard dwell dialog
      // In monoscopic mode: NEVER show 2D HTML popup on mobile app (Flutter displays its native Japandi dialog).
      // Only show 2D HTML popup if standalone PC Windows preview!
      if (state.isVRMode) {
        showVRCompletionPopup();
      } else if (!isInsideFlutter) {
        show2DCompletionPopup();
      }

      // Layer 2: Flutter Native Bridge Notification & XP persistence
      notifyFlutter('onSessionComplete', {
        duration: TOTAL_DURATION_SEC,
        xp: 150,
        title: 'Meditazione Generale • Acqua'
      });
      notifyFlutter('completed', {
        duration: TOTAL_DURATION_SEC
      });
      notifyFlutter('onEnded', {
        duration: TOTAL_DURATION_SEC
      });
    }

    function show2DCompletionPopup() {
      // Safety guard: NEVER show HTML 2D popup if inside Flutter mobile app
      if (isFlutterEnvironment()) return;
      if (completionModal2D) completionModal2D.classList.add('active');
    }

    function hide2DCompletionPopup() {
      if (completionModal2D) completionModal2D.classList.remove('active');
    }

    function showVRCompletionPopup() {
      if (vrCompletionPopupGroup) vrCompletionPopupGroup.visible = true;
    }

    function hideVRCompletionPopup() {
      if (vrCompletionPopupGroup) vrCompletionPopupGroup.visible = false;
    }

    function exitExperience() {
      notifyFlutter('onExit', { duration: state.currentTime });
      if (window.history.length > 1) {
        window.history.back();
      }
    }

    /* ======================================================================
       VR STEREO RIG, GAZE DWELL RETICLE & CONTROLS
       ====================================================================== */
    function setVRMode(enable) {
      state.isVRMode = !!enable;
      if (state.isVRMode) {
        document.body.classList.add('vr-active');
        if (vrOverlay) vrOverlay.classList.add('active');
        if (vrReticleMesh) vrReticleMesh.visible = true;
        if (hudSubtitles) hudSubtitles.classList.remove('visible');
        requestDeviceOrientationPermission();
        if (screen.orientation && screen.orientation.lock) {
          screen.orientation.lock('landscape').catch(() => {});
        }
        if (state.isCompleted) {
          hide2DCompletionPopup();
          showVRCompletionPopup();
        }
      } else {
        document.body.classList.remove('vr-active');
        if (vrOverlay) vrOverlay.classList.remove('active');
        if (vrReticleMesh) vrReticleMesh.visible = false;
        if (vrReticleProgressMesh) vrReticleProgressMesh.visible = false;
        if (billboardMesh) billboardMesh.visible = false;
        hideVRCompletionPopup();
        if (screen.orientation && screen.orientation.unlock) {
          try { screen.orientation.unlock(); } catch (e) {}
        }
        if (state.isCompleted) {
          show2DCompletionPopup();
        }
      }
      onWindowResize();
      notifyFlutter('onVRModeChanged', { isVR: state.isVRMode });
    }

    function updateGazeInteraction(deltaSec) {
      if (!state.isVRMode || gazeInteractables.length === 0) {
        setReticleProgress(0);
        currentGazeTarget = null;
        gazeDwellTimer = 0;
        return;
      }

      _raycaster.setFromCamera(_vZero, camera);
      const intersects = _raycaster.intersectObjects(gazeInteractables, false);

      if (intersects.length > 0 && intersects[0].object.userData.isGazeTarget) {
        const target = intersects[0].object;
        if (currentGazeTarget === target) {
          gazeDwellTimer += deltaSec;
          const prog = Math.min(1.0, gazeDwellTimer / GAZE_DWELL_THRESHOLD);
          setReticleProgress(prog);

          if (gazeDwellTimer >= GAZE_DWELL_THRESHOLD) {
            // Trigger Action!
            gazeDwellTimer = 0;
            setReticleProgress(0);
            const act = target.userData.action;
            if (act === 'restart') {
              seekExperience(0);
              playExperience();
            } else if (act === 'exit') {
              exitExperience();
            }
          }
        } else {
          currentGazeTarget = target;
          gazeDwellTimer = 0;
          setReticleProgress(0);
        }
      } else {
        currentGazeTarget = null;
        gazeDwellTimer = 0;
        setReticleProgress(0);
      }
    }

    // Touch / Mouse Look & W3C Gyroscope Quaternion Handlers
    let isDragging = false;
    let prevMouseX = 0, prevMouseY = 0;
    let yawAngle = 0, pitchAngle = 0;
    let targetYaw = 0, targetPitch = 0;
    let deviceOrientationEnabled = false;
    let orientationAlpha = 0, orientationBeta = 0, orientationGamma = 0;
    let vrAlphaOffset = 0;
    const _zee = new THREE.Vector3(0, 0, 1);
    const _euler = new THREE.Euler();
    const _q0 = new THREE.Quaternion();
    const _q1 = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5)); // -PI/2 around X

    function getScreenOrientationAngle() {
      if (screen.orientation && typeof screen.orientation.angle === 'number') {
        return screen.orientation.angle;
      }
      if (typeof window.orientation === 'number') {
        return window.orientation;
      }
      if (window.innerWidth > window.innerHeight) {
        return 90;
      }
      return 0;
    }

    function enableDeviceOrientation() {
      window.addEventListener('deviceorientation', (e) => {
        if (e && e.alpha !== null && e.alpha !== undefined && e.beta !== null && e.gamma !== null && (Math.abs(e.alpha) > 0.01 || Math.abs(e.beta) > 0.01 || Math.abs(e.gamma) > 0.01)) {
          deviceOrientationEnabled = true;
          orientationAlpha = e.alpha;
          orientationBeta = e.beta;
          orientationGamma = e.gamma;
        }
      }, true);
    }

    function requestDeviceOrientationPermission() {
      enableDeviceOrientation();
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission()
          .then(res => {
            if (res === 'granted') {
              enableDeviceOrientation();
            }
          })
          .catch(() => {});
      }
    }

    function recenterView() {
      targetYaw = 0;
      targetPitch = 0;
      yawAngle = 0;
      pitchAngle = 0;
      vrAlphaOffset = -orientationAlpha;
      updateCameraRotation();
    }

    function updateCameraRotation() {
      if (!camera) return;

      const rotDamp = 1.0 - Math.exp(-14.0 * (state.lastDeltaSec || 0.016));
      yawAngle += (targetYaw - yawAngle) * rotDamp;
      pitchAngle += (targetPitch - pitchAngle) * rotDamp;

      if (deviceOrientationEnabled) {
        const alphaRad = THREE.MathUtils.degToRad(orientationAlpha + vrAlphaOffset) + yawAngle;
        const betaRad = THREE.MathUtils.degToRad(orientationBeta);
        const gammaRad = THREE.MathUtils.degToRad(orientationGamma);
        const orientRad = THREE.MathUtils.degToRad(getScreenOrientationAngle());

        _euler.set(betaRad, alphaRad, -gammaRad, 'YXZ');
        camera.quaternion.setFromEuler(_euler);
        camera.quaternion.multiply(_q1);
        _q0.setFromAxisAngle(_zee, -orientRad);
        camera.quaternion.multiply(_q0);
      } else {
        camera.rotation.set(pitchAngle, yawAngle, 0, 'YXZ');
      }
    }

    function initControls() {
      requestDeviceOrientationPermission();

      // Minimal Pause/Play Button
      if (btnPauseToggle) {
        btnPauseToggle.addEventListener('click', (e) => {
          e.stopPropagation();
          togglePlay();
        });
      }

      // Exit Button
      if (btnExit) {
        btnExit.addEventListener('click', (e) => {
          e.stopPropagation();
          exitExperience();
        });
      }

      // 2D Modal Buttons
      if (modalBtnRestart) {
        modalBtnRestart.addEventListener('click', () => {
          seekExperience(0);
          playExperience();
        });
      }
      if (modalBtnExit) {
        modalBtnExit.addEventListener('click', () => {
          exitExperience();
        });
      }

      // Tap-To-Start Overlay (Fallback if ever clicked)
      if (startOverlay) {
        startOverlay.addEventListener('click', () => {
          startOverlay.classList.add('hidden');
          unlockAudio();
          requestDeviceOrientationPermission();
          playExperience();
        });
      }

      // Mouse Look for Desktop / Testing
      window.addEventListener('mousedown', (e) => {
        if (e.target.closest('#ui-layer') || e.target.closest('#completion-modal-2d')) return;
        isDragging = true;
        prevMouseX = e.clientX;
        prevMouseY = e.clientY;
      });

      window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        const dx = e.clientX - prevMouseX;
        const dy = e.clientY - prevMouseY;
        prevMouseX = e.clientX;
        prevMouseY = e.clientY;

        targetYaw -= dx * 0.0035;
        targetPitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, targetPitch - dy * 0.0035));
      });

      window.addEventListener('mouseup', () => { isDragging = false; });

      // Touch Drag for Mobile 360° Preview
      let touchStartX = 0, touchStartY = 0;
      window.addEventListener('touchstart', (e) => {
        if (e.target.closest('#ui-layer') || e.target.closest('#completion-modal-2d')) return;
        if (e.touches.length === 1) {
          touchStartX = e.touches[0].clientX;
          touchStartY = e.touches[0].clientY;
        }
        unlockAudio();
      }, { passive: true });

      window.addEventListener('touchmove', (e) => {
        if (state.isVRMode && deviceOrientationEnabled) return;
        if (e.touches.length === 1) {
          const dx = e.touches[0].clientX - touchStartX;
          const dy = e.touches[0].clientY - touchStartY;
          touchStartX = e.touches[0].clientX;
          touchStartY = e.touches[0].clientY;

          targetYaw -= dx * 0.004;
          targetPitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, targetPitch - dy * 0.0035));
        }
      }, { passive: true });

      // Keyboard space to play/pause, arrows to seek, R to recenter
      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
          e.preventDefault();
          togglePlay();
        } else if (e.code === 'ArrowRight') {
          seekExperience(state.currentTime + 10);
        } else if (e.code === 'ArrowLeft') {
          seekExperience(state.currentTime - 10);
        } else if (e.key === 'v' || e.key === 'V') {
          setVRMode(!state.isVRMode);
        } else if (e.key === 'r' || e.key === 'R') {
          recenterView();
        }
      });
    }

    function onWindowResize() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      camera.focus = 2.8;
      camera.near = 0.20;
      camera.far = 2000.0;
      camera.updateProjectionMatrix();

      if (stereoCamera) {
        stereoCamera.aspect = 0.5;
        stereoCamera.eyeSep = 0.064;
      }
      const dpr = Math.min(window.devicePixelRatio || 1, state.isVRMode ? 1.25 : 1.30);
      renderer.setPixelRatio(dpr);
      renderer.setSize(w, h);
    }

    /* ======================================================================
       MAIN ANIMATION LOOP (Rock-Solid 60/120 FPS, Zero-GC)
       ====================================================================== */
    let animationFrameId = null;

    function animate(timestamp) {
      animationFrameId = requestAnimationFrame(animate);

      if (!state.lastTimestamp) state.lastTimestamp = timestamp;
      const deltaSec = Math.min(0.066, (timestamp - state.lastTimestamp) / 1000.0);
      state.lastTimestamp = timestamp;
      state.lastDeltaSec = deltaSec;

      if (state.isPlaying) {
        // Direct synchronization on voiceAudio.currentTime
        if (audioVoice && !audioVoice.paused && !isNaN(audioVoice.currentTime)) {
          state.currentTime = audioVoice.currentTime;
        } else {
          state.currentTime = Math.min(TOTAL_DURATION_SEC, state.currentTime + deltaSec);
        }
        updateExperienceTimeline(state.currentTime, deltaSec);
        updateMusicLoop(state.currentTime);
      }

      // Continuous lake ripple motion even when paused
      if (waterMaterial && waterMaterial.uniforms) {
        waterMaterial.uniforms.uTime.value += deltaSec;
      }
      if (starField && starField.material && starField.material.uniforms) {
        starField.material.uniforms.uTime.value += deltaSec;
      }

      // Camera Rotation & Gyroscope Tracking
      updateCameraRotation();

      // Gaze Interaction (VR Mode)
      updateGazeInteraction(deltaSec);

      // Rendering: Stereo Split Cardboard vs Monoscopic
      const width = window.innerWidth;
      const height = window.innerHeight;

      if (state.isVRMode) {
        // Ensure camera rig hierarchy and camera world matrices are fully synchronized
        cameraRig.updateMatrixWorld(true);
        camera.updateMatrixWorld(true);
        stereoCamera.update(camera);

        const halfW = Math.floor(width / 2);
        const rightW = width - halfW;

        renderer.setScissorTest(true);

        // Pre-clear full frame to prevent inter-eye ghosting or previous frame residue
        renderer.setViewport(0, 0, width, height);
        renderer.setScissor(0, 0, width, height);
        renderer.clear();

        // Left Eye Viewport
        renderer.setScissor(0, 0, halfW, height);
        renderer.setViewport(0, 0, halfW, height);
        renderer.render(scene, stereoCamera.cameraL);

        // Right Eye Viewport
        renderer.setScissor(halfW, 0, rightW, height);
        renderer.setViewport(halfW, 0, rightW, height);
        renderer.render(scene, stereoCamera.cameraR);

        renderer.setScissorTest(false);
      } else {
        renderer.setScissorTest(false);
        renderer.setViewport(0, 0, width, height);
        renderer.render(scene, camera);
      }
    }

    /* ======================================================================
       FLUTTER HARDWARE BRIDGE & CLEAN TEARDOWN
       ====================================================================== */
    function notifyFlutter(action, payload) {
      const msg = JSON.stringify({ action: action, event: action, data: payload || {} });
      if (window.flutter_inappwebview && window.flutter_inappwebview.callHandler) {
        window.flutter_inappwebview.callHandler(action, payload || {});
        window.flutter_inappwebview.callHandler('GuidoVRBridge', msg);
        window.flutter_inappwebview.callHandler('GuidoFlutterBridge', { event: action, data: payload || {} });
      }
      if (window.GuidoFlutterBridge && window.GuidoFlutterBridge.postMessage) {
        window.GuidoFlutterBridge.postMessage(msg);
      }
      if (window.parent && window.parent.postMessage) {
        window.parent.postMessage(msg, '*');
      }
    }

    /* --- Web Wake Lock API (Keep Screen Awake) --- */
    let wakeLockSentinel = null;
    async function requestScreenWakeLock() {
      try {
        if ('wakeLock' in navigator && navigator.wakeLock && typeof navigator.wakeLock.request === 'function') {
          wakeLockSentinel = await navigator.wakeLock.request('screen');
        }
      } catch (e) {}
    }
    function releaseScreenWakeLock() {
      if (wakeLockSentinel) {
        try { wakeLockSentinel.release(); } catch (e) {}
        wakeLockSentinel = null;
      }
    }
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        requestScreenWakeLock();
      }
    });

    /* --- iOS Audio & Orientation Unlock On First User Gesture --- */
    function unlockAudioOnGesture() {
      unlockAudio();
      requestDeviceOrientationPermission();
      requestScreenWakeLock();
      window.removeEventListener('touchstart', unlockAudioOnGesture);
      window.removeEventListener('touchend', unlockAudioOnGesture);
      window.removeEventListener('pointerdown', unlockAudioOnGesture);
      window.removeEventListener('click', unlockAudioOnGesture);
    }
    window.addEventListener('touchstart', unlockAudioOnGesture, { passive: true });
    window.addEventListener('pointerdown', unlockAudioOnGesture, { passive: true });
    window.addEventListener('click', unlockAudioOnGesture, { passive: true });

    function disposeExperience() {
      releaseScreenWakeLock();
      if (animationFrameId) cancelAnimationFrame(animationFrameId);
      state.isPlaying = false;

      if (audioVoice) { audioVoice.pause(); audioVoice.src = ''; }
      if (audioMusicA) { audioMusicA.pause(); audioMusicA.src = ''; }
      if (audioMusicB) { audioMusicB.pause(); audioMusicB.src = ''; }

      if (audioContext && audioContext.state !== 'closed') {
        audioContext.close().catch(e => {});
      }

      // Release WebGL resources
      if (scene) {
        scene.traverse(obj => {
          if (obj.geometry) obj.geometry.dispose();
          if (obj.material) {
            if (Array.isArray(obj.material)) obj.material.forEach(m => m.dispose());
            else obj.material.dispose();
          }
        });
      }
      if (renderer) {
        renderer.dispose();
        if (renderer.domElement && renderer.domElement.parentNode) {
          renderer.domElement.parentNode.removeChild(renderer.domElement);
        }
      }
    }

    // Public window.GuidoVR API
    window.GuidoVR = {
      play: function() { playExperience(); },
      start: function() { playExperience(); },
      startSession: function() { playExperience(); },
      pause: function() { pauseExperience(); },
      pauseSession: function() { pauseExperience(); },
      toggle: function() { togglePlay(); },
      togglePlay: function() { togglePlay(); },
      reset: function() {
        state.isCompleted = false;
        hide2DCompletionPopup();
        hideVRCompletionPopup();
        seekExperience(0);
        pauseExperience();
      },
      recenter: function() { recenterView(); },
      setVRMode: function(enable) { setVRMode(enable); },
      enableVR: function() { setVRMode(true); },
      disableVR: function() { setVRMode(false); },
      toggleVR: function(enable) {
        if (typeof enable === 'boolean') setVRMode(enable);
        else setVRMode(!state.isVRMode);
      },
      seek: function(timeSec) { seekExperience(timeSec); },
      setMuted: function(mute) {
        state.voiceVolume = mute ? 0 : 0.95;
        state.musicVolume = mute ? 0 : 0.32;
        syncVolumes();
      },
      setVolume: function(voiceVol, musicVol) {
        state.voiceVolume = voiceVol;
        state.musicVolume = musicVol;
        syncVolumes();
      },
      setDeviceOrientation: function(alpha, beta, gamma) {
        deviceOrientationEnabled = true;
        orientationAlpha = Number(alpha) || 0;
        orientationBeta = Number(beta) || 0;
        orientationGamma = Number(gamma) || 0;
        updateCameraRotation();
      },
      setLookAngle: function(pitchRad, yawRad) {
        deviceOrientationEnabled = false;
        pitchAngle = targetPitch = Number(pitchRad) || 0;
        yawAngle = targetYaw = Number(yawRad) || 0;
        if (camera) camera.rotation.set(pitchAngle, yawAngle, 0, 'YXZ');
      },
      setCameraLook: function(pitchRad, yawRad) {
        deviceOrientationEnabled = false;
        pitchAngle = targetPitch = Number(pitchRad) || 0;
        yawAngle = targetYaw = Number(yawRad) || 0;
        if (camera) camera.rotation.set(pitchAngle, yawAngle, 0, 'YXZ');
      },
      showCompletionPopup: function() {
        if (state.isVRMode) showVRCompletionPopup();
        else show2DCompletionPopup();
      },
      hideCompletionPopup: function() {
        hideVRCompletionPopup();
        hide2DCompletionPopup();
      },
      getState: function() { return { ...state }; },
      camera: camera,
      scene: scene,
      state: state,
      dispose: function() { disposeExperience(); },
      getTimelineState: function() {
        return {
          currentTime: state.currentTime,
          totalDuration: TOTAL_DURATION_SEC,
          isPlaying: state.isPlaying,
          isCompleted: state.isCompleted,
          isVRMode: state.isVRMode
        };
      },
      captureScreenshot: function() {
        if (renderer && scene && camera) {
          renderer.render(scene, camera);
          return renderer.domElement.toDataURL('image/png');
        }
        return null;
      },
      _debugState: function() {
        const watchW = new THREE.Vector3();
        if (goldWatchGroup) goldWatchGroup.getWorldPosition(watchW);
        return {
          dragonLoaded: !!window.dragonLoaded,
          dragonMixer: !!dragonMixer,
          dragonVisible: njordGroup ? njordGroup.visible : false,
          bridgeGroup: !!bridgeGroup,
          bridgeVisible: bridgeGroup ? bridgeGroup.visible : false,
          bridgeChildren: bridgeGroup ? bridgeGroup.children.length : 0,
          goldWatchVisible: goldWatchGroup ? goldWatchGroup.visible : false,
          goldWatchParentIsCameraRig: goldWatchGroup ? (goldWatchGroup.parent === cameraRig) : false,
          goldWatchPos: goldWatchGroup ? { x: goldWatchGroup.position.x, y: goldWatchGroup.position.y, z: goldWatchGroup.position.z } : null,
          goldWatchWorldPos: { x: watchW.x, y: watchW.y, z: watchW.z },
          camRigPos: cameraRig ? { x: cameraRig.position.x, y: cameraRig.position.y, z: cameraRig.position.z } : null,
          isFlutter: isFlutterEnvironment()
        };
      }
    };

    window.addEventListener('beforeunload', disposeExperience);

    // Boot on DOM Ready & Automatic Start
    window.addEventListener('DOMContentLoaded', () => {
      initThreeScene();
      syncVolumes();
      requestScreenWakeLock();
      animate(0);

      if (startOverlay) {
        startOverlay.classList.add('hidden');
        startOverlay.style.setProperty('display', 'none', 'important');
      }

      // Check query params (?vr=true, ?desktop=true, ?seek=)
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('vr') === 'true' || urlParams.get('vr') === '1') {
        setVRMode(true);
      }
      if (urlParams.get('desktop') === 'true') {
        state.isDesktop = true;
      }
      if (urlParams.has('seek')) {
        const targetSec = parseFloat(urlParams.get('seek'));
        seekExperience(targetSec);
      } else {
        playExperience();
      }
      window.focus();
      if (document.body) document.body.focus();

      notifyFlutter('onVRReady', { status: 'ready', experience: 'meditazione_generale_acqua', duration: TOTAL_DURATION_SEC });
    });

  })();
  </script>
</body>
</html>
