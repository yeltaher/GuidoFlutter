# ============================================================================
# Appcircle Workflow Configuration for Guido Flutter (Pure Flutter 3D / WebXR iOS)
# ============================================================================
# NOTE: This file is a REFERENCE for configuring the workflow in Appcircle Dashboard.
# Appcircle workflows are configured through the UI, not by uploading this file directly.
# Use this file as a guide when setting up your workflow in the Appcircle Dashboard.
#
# Project: Guido — Flutter meditation/VR app (Pure Flutter 3D & WebXR architecture)
# Platform: iOS only
# Runner: macOS with Xcode 27.0
# ============================================================================

# ============================================================================
# WORKFLOW STEPS (in order)
# ============================================================================
#
# 1. Cache Pull
#    - Restore cached dependencies (~/.pub-cache, ios/Pods)
#
# 2. Git Clone (automatic)
#    - Appcircle automatically clones your repository
#
# 3. Xcode Select
#    - Select Xcode 27.0
#
# 4. Flutter Install
#    - Install Flutter SDK (version 3.47.7)
#
# 5. Flutter Build for iOS (Release AOT)
#    - Compile deterministic Release AOT bundle: flutter build ios --release --no-codesign
#
# 6. Custom Script: Package Sideload IPA
#    - Invoke scripts/appcircle/package_sideload_ipa.sh to package and sign candidate bundle
#
# 7. Export Build Artifacts
#    - Export the final IPA from $AC_OUTPUT_DIR for distribution/sideloading
#
# 8. Cache Push
#    - Save dependencies for future builds (~/.pub-cache, ios/Pods)
#
# ============================================================================

# ============================================================================
# DETAILED CONFIGURATION FOR EACH STEP
# ============================================================================

# STEP 1: Cache Pull
# ------------------
# In Appcircle Dashboard:
# - Add "Cache Pull" step from Workflow Marketplace
# - Configure cache paths:
#   - ~/.pub-cache
#   - ios/Pods
# - Cache duration: 7 days

# STEP 2: Git Clone
# -----------------
# This is automatic in Appcircle. No configuration needed.

# STEP 3: Xcode Select
# --------------------
# In Appcircle Dashboard:
# - Add "Xcode Select" step from Workflow Marketplace
# - Set AC_XCODE_VERSION to "27.0" (or the exact version available)

# STEP 4: Flutter Install
# -----------------------
# In Appcircle Dashboard:
# - Add "Flutter Install" step from Workflow Marketplace
# - Set AC_SELECTED_FLUTTER_VERSION to "3.47.7"

# STEP 5: Flutter Build for iOS (Release AOT Deterministic Build)
# -------------------------------------------------------------
# In Appcircle Dashboard:
# - Add "Flutter Build for iOS" step from Workflow Marketplace
# - Build Command: flutter build ios --release --no-codesign
# - Configure the following inputs:
#   - AC_FLUTTER_PROJECT_PATH: "." (repository root)
#   - AC_FLUTTER_BUILD_MODE: "release"
#   - AC_FLUTTER_BUILD_EXTRA_ARGS: "--no-codesign --build-number=$AC_BUILD_NUMBER"
#
# NOTE: Release mode compiles Flutter Dart code to native AOT machine code (App.framework),
# disabling JIT stubs and preventing AMFI codesign rejection on physical devices.

# STEP 6: Custom Script - Package Sideload IPA
# --------------------------------------------
# In Appcircle Dashboard:
# - Add "Custom Script" step from Workflow Marketplace right after Flutter Build for iOS
# - Set "Execute With" to "Bash"
# - Set Step Name to "Package Sideload IPA"
# - Script Content:
#
#   #!/bin/bash
#   set -euo pipefail
#   bash scripts/appcircle/package_sideload_ipa.sh
#
# This script:
# 1. Selects the Release candidate (build/ios/Release-iphoneos/Runner.app)
# 2. Enforces strict AOT validation guards (rejecting Debug/JIT artifacts)
# 3. Recursively resolves transitive @rpath framework and dylib dependencies
# 4. Strips x86_64 simulator slices via lipo -thin arm64
# 5. Executes inside-out ad-hoc codesigning with strict verification
# 6. Packages and exports the IPA to $AC_OUTPUT_DIR (Guido_v0.1.0_b$AC_BUILD_NUMBER.ipa)

# STEP 7: Export Build Artifacts
# ------------------------------
# In Appcircle Dashboard:
# - Add "Export Build Artifacts" step from Workflow Marketplace
# - Automatically exports all .ipa artifacts located in $AC_OUTPUT_DIR

# STEP 8: Cache Push
# -------------------
# In Appcircle Dashboard:
# - Add "Cache Push" step from Workflow Marketplace
# - Configure cache paths:
#   - ~/.pub-cache
#   - ios/Pods
# - Cache duration: 7 days

# ============================================================================
# ENVIRONMENT VARIABLES
# ============================================================================
#
# The following environment variables are available in Appcircle:
#
# Common:
#   $AC_REPOSITORY_DIR        - Cloned repository path
#   $AC_OUTPUT_DIR            - Output directory for artifacts
#   $AC_BUILD_NUMBER          - Build number (auto-incremented)
#   $AC_GIT_BRANCH            - Current Git branch
#   $AC_GIT_COMMIT            - Current Git commit hash
#
# iOS Specific:
#   $AC_SCHEME                - Xcode scheme (Runner)
#   $AC_PROJECT_PATH          - Xcode project/workspace path (ios/Runner.xcworkspace)
#   $AC_CERTIFICATES          - Signing certificates
#   $AC_PROVISIONING_PROFILES - Provisioning profiles
#   $AC_BUNDLE_IDENTIFIERS    - App bundle identifier
#
# Flutter Specific:
#   $AC_FLUTTER_PROJECT_PATH  - Flutter project path (.)
#   $AC_FLUTTER_BUILD_MODE    - Build mode (release)
#   $AC_FLUTTER_BUILD_EXTRA_ARGS - Extra arguments (--no-codesign --build-number=$AC_BUILD_NUMBER)
#
# ============================================================================

# ============================================================================
# CACHE CONFIGURATION
# ============================================================================
#
# Paths to cache:
#   - ~/.pub-cache (Flutter/Dart packages)
#   - ios/Pods (CocoaPods dependencies)
#
# Cache duration: 7 days
#
# ============================================================================

# ============================================================================
# WORKFLOW VISUALIZATION
# ============================================================================
#
# [Cache Pull] → [Git Clone] → [Xcode Select] → [Flutter Install] →
# [Flutter Build iOS (Release)] → [Package Sideload IPA] →
# [Export Build Artifacts] → [Cache Push]
#
# ============================================================================

